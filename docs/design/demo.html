      ...MODULES.filter((m) => m.soon).map((m) => ({ label: m.label, href: `soon/${m.key}`, icon: m.icon }))].filter((s) => !q || s.label.toLowerCase().includes(q));
    const people = (q ? ratings.filter((r) => `${r.sn} ${r.surname} ${r.first} ${r.middle}`.toLowerCase().includes(q)) : ratings.slice(0, 4))
      .slice(0, 6).map((r) => ({ label: fullName(r), sub: `${r.sn} · ${r.status === 'current' ? r.ship : 'Former'}`, href: `ratings/record/${r.sn}`, rating: r }));
    return [['Screens', screens.slice(0, q ? 8 : 5)], ['Ratings', people]];
  }
  function renderPalette() {
    const groups = paletteItems();
    const flat = groups.flatMap(([, items]) => items);
    paletteIndex = Math.max(0, Math.min(paletteIndex, flat.length - 1));
    let n = -1;
    $('#palette-results').innerHTML = flat.length ? groups.filter(([, items]) => items.length).map(([label, items]) => `<div class="px-2 pb-1 pt-2 text-2xs font-semibold uppercase tracking-widest text-muted-foreground">${label}</div>
      ${items.map((it) => { n += 1; return `<a href="#${it.href}" data-idx="${n}" class="flex items-center gap-3 rounded-ctl px-2 py-2 text-sm ${n === paletteIndex ? 'bg-secondary/10' : 'hover:bg-subtle'}">
        ${it.rating ? avatar(it.rating, 'h-8 w-8 text-2xs') : `<span class="flex h-8 w-8 items-center justify-center rounded-ctl bg-muted text-muted-foreground">${ic(it.icon)}</span>`}
        <span class="min-w-0 flex-1"><b class="block truncate font-medium">${esc(it.label)}</b>${it.sub ? `<span class="block truncate text-xs text-muted-foreground">${esc(it.sub)}</span>` : ''}</span>${n === paletteIndex ? ic('arrow-left', 'icon rotate-180 text-muted-foreground') : ''}</a>`; }).join('')}`).join('')
      : empty('search', 'Nothing Matches');
  }
  $('#palette-input').addEventListener('input', () => { paletteIndex = 0; renderPalette(); });
  $('#palette-input').addEventListener('keydown', (e) => {
    const count = paletteItems().flatMap(([, i]) => i).length;
    if (e.key === 'ArrowDown') { e.preventDefault(); paletteIndex = (paletteIndex + 1) % Math.max(count, 1); renderPalette(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); paletteIndex = (paletteIndex - 1 + count) % Math.max(count, 1); renderPalette(); }
    else if (e.key === 'Enter') { e.preventDefault(); const a = $(`#palette-results [data-idx="${paletteIndex}"]`); if (a) { location.hash = a.getAttribute('href'); closePalette(); } }
  });

  // ==========================================================================
  // Events
  // ==========================================================================
  document.addEventListener('keydown', (e) => {
    if (locked) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
    else if (e.key === 'Escape') { if (!$('#palette').classList.contains('hidden')) closePalette(); else if (!$('#overlay').classList.contains('hidden')) closeDialog(); else closePhone(); }
    else if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-pick]')) pickRating(e.target.dataset.pick);
  });
  document.addEventListener('click', (e) => {
    const menuBtn = e.target.closest('[data-act="export"],[data-act="account"]');
    document.querySelectorAll('#export-menu,#account-menu').forEach((m) => { if (!menuBtn || !menuBtn.parentElement.contains(m)) m.classList.add('hidden'); });
    const pickEl = e.target.closest('[data-pick]');
    if (pickEl) { pickRating(pickEl.dataset.pick); return; }
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const A = {
      'toggle-rail': () => { state.collapsed = !state.collapsed; renderRail(route); },
      palette: openPalette, 'close-palette': closePalette,
      close: () => closeDialog(),
      account: () => $('#account-menu').classList.toggle('hidden'),
      'account-sheet': () => openDialog({ title: 'HICO Administrator', body: `<div class="mb-3 text-sm text-muted-foreground">HICO001 · Administrator</div><div class="flex flex-col gap-2"><a href="#ratings/my-details" data-act="close" class="${btn.outline} justify-start">${ic('user-round')}View My Details</a><a href="#admin/password" data-act="close" class="${btn.outline} justify-start">${ic('key-round')}Change Password</a><button type="button" data-act="lock" class="${btn.outline} justify-start">${ic('lock-keyhole')}Lock Screen</button><button type="button" data-act="theme" class="${btn.outline} justify-start">${themeItem()}</button><button type="button" data-act="sign-out" class="${btn.outline} justify-start text-destructive">${ic('log-out')}Sign Out</button></div>`, size: 'sm' }),
      'sign-out': () => { closeDialog(); signOut(); },
      theme: () => { closeDialog(); const m = $('#account-menu'); if (m) m.classList.add('hidden'); toggleTheme(); },
      more: openMore,
      export: () => $('#export-menu').classList.toggle('hidden'),
      'export-sheet': () => openDialog({ title: 'Export', size: 'sm', body: `<div class="flex flex-col gap-2">${[['copy', 'Copy Rows'], ['file-spreadsheet', 'Excel'], ['file-text', 'PDF'], ['file-text', 'CSV']].map(([i, l]) => `<button type="button" data-act="exported" class="${btn.outline} justify-start">${ic(i)}${l}</button>`).join('')}</div>` }),
      exported: () => { const m = $('#export-menu'); if (m) m.classList.add('hidden'); closeDialog(); toast('Demo only: no file was made.'); },
      page: () => { const k = el.dataset.list; if (state.list[k]) state.list[k].page = Number(el.dataset.to); else state.pages[k] = Number(el.dataset.to); render(); $('#page').scrollTop = 0; },
      filters: () => openDialog({ title: 'Filter', body: `<div class="space-y-4">${field('Rate', `<select name="rate-filter">${options(RATES, state.rate, 'All Rates')}</select>`)}${field('Ship', `<select name="ship-filter">${options(SHIPS, state.ship, 'All Ships')}</select>`)}</div>`,
        foot: `<button type="button" data-act="clear-filters" class="${btn.outline}">Clear</button><button type="button" data-act="close" class="${btn.primary}">Show Ratings</button>`, size: 'sm' }),
      'clear-filters': () => { state.rate = ''; state.ship = ''; closeDialog(); render(); },
      'record-tab': () => { state.recordTab = el.dataset.tab; state.docPicked = null; render(); },
      edit: () => editForm(el.dataset.what), saved: () => demoSave(),
      print: () => toast('Demo only: the PDF is made by the server.'),
      delete: () => openDialog({ title: 'Delete Rating', body: '<p class="text-sm">This removes the record and all its tabs.</p>', foot: `<button type="button" data-act="close" class="${btn.outline}">Cancel</button><button type="button" data-act="saved" class="${btn.danger}">${ic('trash-2')}Delete Rating</button>`, size: 'sm' }),
      'docs-for': () => { state.docSn = el.dataset.sn; closeDialog(); },
      'doc-cat': () => { state.docCat = el.dataset.cat; state.docPicked = null; render(); },
      'doc-pick': () => pickDoc(el.dataset.doc),
      'upload-doc': () => openDialog({ title: 'Upload Document', body: `<div class="space-y-4">${field('Category', `<select name="doc-category">${options(CATEGORIES.map(([, n]) => n), state.docCat === 'ALL' ? 'Drafting' : (CATEGORIES.find(([c]) => c === state.docCat) || [, ''])[1])}</select>`)}
          <button type="button" class="flex w-full flex-col items-center gap-2 rounded-card border-2 border-dashed border-input bg-subtle transition-colors px-4 py-6 text-sm text-muted-foreground">${ic('file-up', 'icon h-7 w-7')}Choose a PDF, image or Word file</button></div>`,
        foot: `<button type="button" data-act="close" class="${btn.outline}">Cancel</button><button type="button" data-act="saved" class="${btn.primary}">${ic('upload')}Upload</button>`, size: 'sm' }),
      download: () => toast('Demo only: no file to download.'),
      'delete-doc': () => toast('Demo only: nothing was deleted.'),
      step: () => setNewStep(Number(el.dataset.step)),
      'new-rating': () => openNewRating(),
      'save-new': () => { closeDialog(); toast('Demo only: nothing was saved.'); location.hash = '#ratings/record/B0539'; },
      template: () => { state.upload = Math.max(state.upload, 1); render(); toast('Demo only: no workbook was made.'); },
      'choose-workbook': () => { state.upload = 2; render(); },
      commit: () => { state.upload = 3; render(); toast('Demo only: nothing was added.'); },
      demo: () => toast('Demo only.'),
      'table-add': () => tableForm(route.slice(7), null),
      'table-edit': () => tableForm(route.slice(7), Number(el.dataset.i)),
      'run-report': () => { render(); toast('Report updated.'); },
      'user-pick': () => { state.userPicked = el.dataset.user; if (sideBySide()) render(); else { const u = USERS.find((x) => x.username === el.dataset.user); openDialog({ title: 'User', size: 'md', body: userCard(u) }); } },
      'user-add': () => userForm(null),
      'user-edit': () => userForm(USERS.find((x) => x.username === el.dataset.user)),
      'reset-pw': () => openDialog({ title: 'Reset Password', size: 'sm', body: '<p class="text-sm">The user gets a one-time password and must change it at their next sign in.</p>', foot: `<button type="button" data-act="close" class="${btn.outline}">Cancel</button><button type="button" data-act="saved" class="${btn.blue}">${ic('key-round')}Reset Password</button>` }),
      'role-pick': () => { state.role = el.dataset.role; render(); },
      'role-add': () => openDialog({ title: 'Add Role', size: 'sm', body: field('Role Name', `<input type="text" class="${INPUT}" />`) + `<div class="mt-4">${field('Copy Access From', `<select name="role-copy">${options(ROLES, '', '-- None --')}</select>`, true)}</div>`, foot: `<button type="button" data-act="close" class="${btn.outline}">Cancel</button><button type="button" data-act="saved" class="${btn.primary}">${ic('check')}Add Role</button>` }),
      perm: () => { perms[state.role][el.dataset.key] = !perms[state.role][el.dataset.key]; render(); },
      'pw-save': () => { if (!$('#pw-current').value) { toast('Enter your current password.', 'error'); return; } if (!pwCheck()) { toast('The new password needs every check.', 'error'); return; } toast('Demo only: the password is unchanged.'); },
      eye: () => { const i = document.getElementById(el.dataset.for); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.innerHTML = ic(show ? 'eye-off' : 'eye'); el.setAttribute('aria-label', show ? 'Hide Password' : 'Show Password'); },
      'audit-search': () => { const v = (n) => { const x = document.querySelector(`[name="${n}"]`); return x ? x.value : ''; }; state.audit = { action: v('audit-action'), table: v('audit-table'), by: v('audit-by'), key: v('audit-key') }; state.pages.audit = 1; render(); },
      'audit-reset': () => { state.audit = { action: '', table: '', by: '', key: '' }; state.pages.audit = 1; render(); },
      'audit-view': () => { const e = AUDIT[Number(el.dataset.i)]; openDialog({ title: `${e.action} · ${e.key}`, size: 'lg', body: `<div class="mb-4">${dl([['Time', stamp(e.time)], ['Table', e.table], ['Performed By', e.by], ['IP Address', e.ip]])}</div>
          <div class="overflow-hidden rounded-card border border-border/70"><table class="w-full text-sm"><thead class="text-left"><tr><th class="${TH}">Field</th><th class="${TH}">Before</th><th class="${TH}">After</th></tr></thead>
          <tbody>${auditChanges(e).map(([f, b, a]) => `<tr class="border-t border-border/70"><td class="px-4 py-2.5 font-medium">${esc(f)}</td><td class="px-4 py-2.5">${b === '-' ? '<span class="text-muted-foreground">-</span>' : `<span class="rounded bg-error-soft px-1.5 py-0.5 text-error line-through decoration-error/50">${esc(b)}</span>`}</td><td class="px-4 py-2.5">${a === '-' ? '<span class="text-muted-foreground">-</span>' : `<span class="rounded bg-success-soft px-1.5 py-0.5 text-success">${esc(a)}</span>`}</td></tr>`).join('')}</tbody></table></div>` }); },
      lock: () => { closeDialog(); const m = $('#account-menu'); if (m) m.classList.add('hidden'); lockScreen('manual'); },
      'lock-eye': () => { const i = $('#lock-pass'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.innerHTML = ic(show ? 'eye-off' : 'eye'); el.setAttribute('aria-label', show ? 'Hide Password' : 'Show Password'); i.focus(); },
      'lock-signout': () => { unlockScreen({ announce: false }); signOut(); },
      'phone-preview': openPhone, 'close-phone': closePhone,
    };
    if (A[act]) A[act]();
  });
  document.addEventListener('input', (e) => {
    if (e.target.dataset && e.target.dataset.q) {
      const key = e.target.dataset.q; state.qs[key] = e.target.value; state.pages[key] = 1;
      const pos = e.target.selectionStart; const id = e.target.id;
      render();
      const i = document.getElementById(id); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
      return;
    }
    if (e.target.id === 'pw-new' || e.target.id === 'pw-confirm') { pwCheck(); return; }
    if (e.target.id === 'list-q') {
      state.q = e.target.value;
      Object.values(state.list).forEach((l) => { l.page = 1; l.picked = null; });
      const pos = e.target.selectionStart;
      render();
      const i = $('#list-q'); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
    }
  });
  document.addEventListener('change', (e) => {
    const name = e.target.getAttribute && e.target.getAttribute('name');
    if (name === 'rate-filter' || name === 'ship-filter') {
      state[name === 'rate-filter' ? 'rate' : 'ship'] = e.target.value;
      Object.values(state.list).forEach((l) => { l.page = 1; l.picked = null; });
      if ($('#overlay').classList.contains('hidden')) render(); else setTimeout(render, 0);
    } else if (name && name.startsWith('rep-')) {
      state.report[name.slice(4)] = e.target.value;
    } else if (name === 'doc-rating') {
      state.docSn = e.target.value; state.docCat = 'ALL'; state.docPicked = null; render();
    }
  });

  // ---- phone preview (demo only) ----
  function openPhone() {
    const frame = $('#phone-frame');
    $('#phone-iframe').src = `${location.href.split('#')[0].split('?')[0]}?frame=phone${location.hash || '#dashboard'}`;
    frame.classList.remove('hidden'); frame.classList.add('flex');
  }
  function closePhone() { const f = $('#phone-frame'); f.classList.add('hidden'); f.classList.remove('flex'); $('#phone-iframe').src = 'about:blank'; }
  if (new URLSearchParams(location.search).get('frame')) $('#demo-bar').remove();
  themeListeners.push(() => renderRail(route));

  lastRoute = location.hash.replace(/^#\/?/, '') || 'dashboard';
  const openNewAtStart = lastRoute === 'ratings/new';
  if (openNewAtStart) { lastRoute = 'ratings/current'; history.replaceState(null, '', '#ratings/current'); }
  render();
  if (framed) { $('#login').classList.add('hidden'); } else showLogin();
  if (openNewAtStart) openNewRating();
  if (store.get()) lockScreen(store.get(), { announce: false });
})();
</script>
</body>
</html>
