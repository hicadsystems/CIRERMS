<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CIRERMS Layout Demo</title>
<link rel="icon" type="image/png" href="__CREST__" />
<script>
/* Light or dark before the page draws: the person's choice, else the device's (as js/core/theme-boot.js in the app) */
(function () {
  var stored = null;
  try { stored = window.localStorage.getItem('cirerms-theme'); } catch (e) { /* storage off (opened from disk): follow the device */ }
  var dark = stored === 'dark' || stored === 'light' ? stored === 'dark' : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<style>
/*__CSS__*/
</style>

<body class="app-canvas h-full overflow-hidden text-foreground">
<!--__SPRITE__-->

<div id="shell" class="flex h-dvh min-h-0">
  <aside id="rail" class="flex flex-none flex-col bg-sidebar text-sidebar-foreground phone:hidden" aria-label="Main"></aside>

  <div class="flex min-h-0 min-w-0 flex-1 flex-col">
    <!-- desktop top bar -->
    <header class="relative z-20 flex h-14 flex-none items-center gap-3 border-b border-border/60 bg-background/70 px-4 backdrop-blur-xl phone:hidden">
      <button type="button" data-act="toggle-rail" class="inline-flex h-9 w-9 items-center justify-center rounded-ctl text-muted-foreground hover:bg-muted hover:text-foreground" aria-label="Collapse Menu">
        <svg class="icon h-5 w-5" aria-hidden="true"><use href="#i-panel-left"></use></svg>

      <button type="button" data-act="palette" class="flex h-9 w-full max-w-md items-center gap-2 rounded-full border border-border bg-muted px-3.5 text-sm text-muted-foreground transition-all hover:border-input hover:bg-background hover:shadow-card">

      </button>
      <!-- demo only: see the phone layout from a desktop browser -->
      <div id="demo-bar" class="ml-auto flex flex-none items-center gap-2 text-xs">
        <span class="rounded-full bg-warning-soft px-2 py-1 font-semibold text-warning">Layout Demo</span>

<script>
(function () {
  'use strict';

  // ==========================================================================
  // Demonstration data (synthetic)
  // ==========================================================================
  const TODAY = new Date(2026, 10, 18);
  const RATES = ['Ordinary Seaman (OS)', 'Able Seaman (AB)', 'Leading Seaman (LS)', 'Petty Officer (PO)', 'Chief Petty Officer (CPO)', 'Warrant Officer (WO)', 'Master Warrant Officer (MWO)', 'Navy Warrant Officer (NWO)'];
  const SHIPS = ['NNS ARADU', 'NNS THUNDER', 'NNS OKPABANA', 'NNS CENTENARY', 'NNS UNITY', 'NNS PROSPERITY', 'NNS KADA', 'NNS BEECROFT', 'NNS PATHFINDER', 'NNS VICTORY', 'NNS DELTA', 'NNS JUBILEE'];
  const BRANCHES = ['Seaman', 'Marine Engineering', 'Weapon Engineering', 'Logistics', 'Medical', 'Information Technology', 'Education', 'Naval Police'];
  const COMMANDS = ['Western Naval Command', 'Eastern Naval Command', 'Central Naval Command', 'Naval Training Command', 'Logistics Command'];
  const STATES = ['Lagos', 'Rivers', 'Enugu', 'Kaduna', 'Delta', 'Oyo', 'Anambra', 'Kano', 'Cross River', 'Bayelsa', 'Imo', 'Ondo'];
  const SURNAMES = ['Adebayo', 'Okafor', 'Bello', 'Eze', 'Ibrahim', 'Ogunleye', 'Nwosu', 'Abubakar', 'Etim', 'Okoro', 'Danjuma', 'Akpan', 'Olatunji', 'Umar', 'Obi', 'Lawal', 'Effiong', 'Musa', 'Adeyemi', 'Chukwu', 'Garba', 'Ndukwe', 'Bassey', 'Yusuf', 'Ogbonna', 'Idowu', 'Ajayi', 'Onyeka', 'Salisu', 'Ekanem', 'Agbaje', 'Uzor', 'Tanko'];
  const FIRST = ['Chinedu', 'Tunde', 'Abdullahi', 'Emeka', 'Aisha', 'Segun', 'Ngozi', 'Uduak', 'Kelechi', 'Sadiq', 'Funmilayo', 'Obinna', 'Halima', 'Ikechukwu', 'Bola', 'Nnamdi', 'Zainab', 'Yemi', 'Chidi', 'Blessing', 'Amina', 'Femi', 'Ebere', 'Bashir', 'Tosin', 'Uchenna', 'Danladi', 'Kemi', 'Ese', 'Nkechi'];
  const EXITS = ['Retired', 'Completed engagement', 'Discharged at own request', 'Medical discharge'];
  const CATEGORIES = [['DRAFTING', 'Drafting'], ['CERTIFICATE', 'Certificate'], ['REQUEST_FORM', 'Request Form'], ['EMOLUMENT', 'Emolument'], ['GEN_FORM', 'General Form'], ['OTHER', 'Other']];

  const short = (rate) => (rate.match(/\(([^)]+)\)/) || [, rate])[1];
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  const d = (y, m, day) => new Date(y, m - 1, day);
  const fmt = (dt) => (dt ? `${pad(dt.getDate())}/${pad(dt.getMonth() + 1)}/${dt.getFullYear()}` : '-');
  const years = (from, to = TODAY) => Math.floor((to - from) / 31557600000);
  const since = (from) => { const m = Math.max(0, (TODAY.getFullYear() - from.getFullYear()) * 12 + TODAY.getMonth() - from.getMonth()); return m >= 12 ? `${Math.floor(m / 12)} yr ${m % 12} mo` : `${m} mo`; };

  const ratings = [];
  for (let i = 0; i < 33; i += 1) {
    const enlisted = d(2004 + (i % 17), 1 + ((i * 5) % 12), 1 + ((i * 11) % 27));
    ratings.push({
      sn: `B0${pad(410 + i * 9, 3)}`,
      surname: SURNAMES[i],
      first: FIRST[(i * 7) % FIRST.length],
      middle: FIRST[(i * 3 + 5) % FIRST.length],
      rate: RATES[[1, 2, 3, 1, 2, 4, 0, 3, 2, 5, 1, 3, 2, 6, 1, 3, 2][i % 17]],
      ship: SHIPS[(i * 5) % SHIPS.length],
      shipSince: d(2019 + (i % 7), 1 + ((i * 7) % 12), 3 + (i % 20)),
      branch: BRANCHES[(i * 3) % BRANCHES.length],
      command: COMMANDS[i % COMMANDS.length],
      state: STATES[(i * 7) % STATES.length],
      enlisted,
      dob: d(enlisted.getFullYear() - 19 - (i % 4), 1 + ((i * 3) % 12), 2 + ((i * 13) % 26)),
      phone: `080${3 + (i % 6)} ${pad((412 + i * 137) % 1000, 3)} ${pad((4000 + i * 911) % 10000, 4)}`,
      gender: [4, 6, 12, 18, 19, 20, 27, 29].includes((i * 7) % FIRST.length) ? 'Female' : 'Male',
      status: i < 25 ? 'current' : 'former',
      exitDate: i < 25 ? null : d(2023 + (i % 4), 1 + ((i * 5) % 12), 4 + (i % 22)),
      exitReason: i < 25 ? null : EXITS[i % EXITS.length],
    });
  }
  // the demo login's own record
  const me = {
    sn: 'B0539', surname: 'Okonkwo', first: 'Chukwuemeka', middle: 'Ifeanyi', rate: 'Petty Officer (PO)', ship: 'NNS ARADU', shipSince: d(2020, 3, 14),
    branch: 'Seaman', command: 'Western Naval Command', state: 'Anambra', enlisted: d(2010, 2, 8), dob: d(1990, 4, 18), phone: '0803 539 2041',
    gender: 'Male', status: 'current', exitDate: null, exitReason: null,
  };
  ratings.splice(6, 0, me);
  const bySn = (sn) => ratings.find((r) => r.sn === sn);
  const fullName = (r) => `${short(r.rate)} ${r.surname} ${r.first}`;
  const initials = (r) => `${r.surname[0]}${r.first[0]}`;

  // the record's child lists; the demo login's record is complete, the others sparse
  const RECORDS = {
    B0539: {
      nok: [{ name: 'Adaeze Okonkwo', relation: 'Spouse', phone: '0805 221 9087', address: '14 Marine Road, Apapa, Lagos' }, { name: 'Ifeanyi Okonkwo', relation: 'Brother', phone: '0809 114 3302', address: '3 Zik Avenue, Awka, Anambra' }],
      spouse: [{ name: 'Adaeze Okonkwo', married: d(2016, 12, 10), phone: '0805 221 9087', occupation: 'Teacher' }],

  // ---- sign-in sea (as js/sections/login-canvas.js): day in light mode, night with stars in dark; every colour a --login-* token ----
  const sea = (() => {
    const canvas = $('#login-canvas');
    const ctx = canvas.getContext('2d');
    const token = (name) => { const [rgb, alpha] = getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).split('/'); return { rgb: rgb.trim().split(/\s+/).join(', '), a: alpha === undefined ? 1 : parseFloat(alpha) }; };
    const rgba = (c, k = 1) => `rgba(${c.rgb}, ${c.a * k})`;
    const WAVES = [
      { level: 0.70, height: 0.022, length: 0.0042, speed: 0.00018, crest: 0.60 },
      { level: 0.76, height: 0.028, length: 0.0034, speed: -0.00024, crest: 0.73 },
      { level: 0.83, height: 0.034, length: 0.0027, speed: 0.00031, crest: 0.87 },
      { level: 0.90, height: 0.040, length: 0.0021, speed: -0.00038, crest: 1 },
    ];
    const still = window.matchMedia('(prefers-reduced-motion: reduce)');
    let paint = null; let width = 0; let height = 0; let stars = []; let frame = null;
    const readPaint = () => { paint = { sky: ['login-from', 'login-via', 'login-to'].map(token), waves: WAVES.map((_, i) => token(`login-wave-${i + 1}`)), crest: token('login-crest'), glow: token('login-glow'), star: token('login-star') }; };
    function resize() {
      const ratio = window.devicePixelRatio || 1;
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      const count = Math.max(50, Math.min(160, Math.round((width * height * 0.68) / 9000)));
      stars = Array.from({ length: count }, () => ({ x: Math.random() * width, y: Math.random() * height * 0.68, size: Math.random() * 1.2 + 0.3, base: Math.random() * 0.45 + 0.15, phase: Math.random() * Math.PI * 2, rate: Math.random() * 0.0015 + 0.0005 }));
    }
    const waveY = (w, x, t) => { const base = height * w.level; const amp = height * w.height; return base + Math.sin(x * w.length + t * w.speed) * amp + Math.sin(x * w.length * 2.3 - t * w.speed * 1.7 + 1.3) * amp * 0.35; };
    function draw(t) {
      const sky = ctx.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, rgba(paint.sky[0])); sky.addColorStop(0.55, rgba(paint.sky[1])); sky.addColorStop(1, rgba(paint.sky[2]));
      ctx.fillStyle = sky; ctx.fillRect(0, 0, width, height);
      const mx = width * 0.82; const my = height * 0.16;
      const glow = ctx.createRadialGradient(mx, my, 0, mx, my, Math.max(width, height) * 0.35);
      glow.addColorStop(0, rgba(paint.glow)); glow.addColorStop(0.3, rgba(paint.glow, 0.375)); glow.addColorStop(1, rgba(paint.glow, 0));
      ctx.fillStyle = glow; ctx.fillRect(0, 0, width, height);
      if (paint.star.a > 0) {
        for (const s of stars) {
          ctx.fillStyle = rgba(paint.star, s.base * (0.6 + 0.4 * Math.sin(s.phase + t * s.rate)));
          ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      const step = 8;
      WAVES.forEach((w, i) => {
        ctx.beginPath(); ctx.moveTo(0, height);
        for (let x = 0; x <= width + step; x += step) ctx.lineTo(x, waveY(w, x, t));
        ctx.lineTo(width, height); ctx.closePath();
        ctx.fillStyle = rgba(paint.waves[i]); ctx.fill();
        ctx.beginPath();
        for (let x = 0; x <= width + step; x += step) { const y = waveY(w, x, t); if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
        ctx.strokeStyle = rgba(paint.crest, w.crest); ctx.lineWidth = 1.2; ctx.stroke();
      });
    }
    const loop = (t) => { draw(t); frame = window.requestAnimationFrame(loop); };
    function stop() { if (frame !== null) window.cancelAnimationFrame(frame); frame = null; }
    function start() { stop(); readPaint(); resize(); if (still.matches) draw(0); else frame = window.requestAnimationFrame(loop); }
    window.addEventListener('resize', () => { if (frame === null && $('#login').classList.contains('hidden')) return; resize(); if (still.matches) draw(0); });
    themeListeners.push(() => { if ($('#login').classList.contains('hidden')) return; readPaint(); if (still.matches) draw(0); });
    return { start, stop };
  })();

              ${m.soon && !c ? '<span class="rounded-full bg-sidebar-hover px-2 py-0.5 text-2xs font-semibold text-sidebar-foreground">Soon</span>' : ''}
              ${c ? `<span class="pointer-events-none absolute left-full top-1/2 z-40 ml-2 hidden -translate-y-1/2 whitespace-nowrap rounded-ctl bg-foreground px-2 py-1 text-xs text-background group-hover:block">${esc(m.label)}</span>` : ''}
            </a>`;
          }).join('')}`).join('')}
      </div>
      <div class="relative flex-none border-t border-sidebar-border p-2.5">
        <button type="button" data-act="account" aria-haspopup="menu" class="flex w-full items-center gap-2.5 rounded-ctl p-1 text-left hover:bg-sidebar-hover ${c ? 'justify-center' : ''}">
          <span class="flex h-9 w-9 flex-none items-center justify-center rounded-full bg-sidebar-accent text-xs font-bold text-sidebar-accent-foreground">HA</span>
          <span class="min-w-0 flex-1 leading-tight ${c ? 'hidden' : ''}"><b class="block truncate text-sm font-semibold">HICO001</b><span class="block truncate text-2xs text-sidebar-muted">Administrator</span></span>
          ${c ? '' : ic('chevron-up', 'icon text-sidebar-muted')}
        </button>
        <div id="account-menu" role="menu" class="absolute bottom-full left-2.5 z-40 mb-1 hidden w-56 rounded-card border border-border/70 bg-popover p-1 text-sm text-popover-foreground shadow-pop">
          <a role="menuitem" href="#ratings/my-details" class="flex items-center gap-2 rounded-md px-3 py-2 hover:bg-subtle">${ic('user-round')}View My Details</a>
          <a role="menuitem" href="#admin/password" class="flex items-center gap-2 rounded-md px-3 py-2 hover:bg-subtle">${ic('key-round')}Change Password</a>
          <button role="menuitem" type="button" data-act="lock" class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-left hover:bg-subtle">${ic('lock-keyhole')}Lock Screen</button>
          <button role="menuitem" type="button" data-act="theme" class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-left hover:bg-subtle">${themeItem()}</button>
          <div class="my-1 h-px bg-border"></div>
          <button role="menuitem" type="button" data-act="sign-out" class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-left text-destructive hover:bg-error-soft">${ic('log-out')}Sign Out</button>
        </div>
      </div>`;
    // Redrawing the rail must not lose its place: keep the scroll, then bring the current item into view if it is not.
    const box = rail.querySelector('[data-rail-scroll]');
    box.scrollTop = kept;
    const cur = box.querySelector('[aria-current="page"]');
    if (cur) {
      const b = box.getBoundingClientRect(); const r = cur.getBoundingClientRect();
      if (r.top < b.top) box.scrollTop -= b.top - r.top + 12;
      else if (r.bottom > b.bottom) box.scrollTop += r.bottom - b.bottom + 12;
    }
  }

  // ==========================================================================
  // Tabs (desktop strip, phone chips), phone header and bottom bar
  // ==========================================================================
  function tabRoute(route) {
    if (route.startsWith('ratings/record') || route === 'ratings/new') return route.startsWith('ratings/record/') && ratingFromRoute(route)?.status === 'former' ? 'ratings/former' : 'ratings/current';
    return route;
  }
  function renderTabs(route) {
    const nav = $('#tabs');
    const TABS = MODULE_TABS[moduleOf(route)];
    if (!TABS) { nav.innerHTML = ''; nav.className = 'flex-none'; return; }
    const cur = route.startsWith('ratings') ? tabRoute(route) : (D1.owns(route) ? D1.tabOf(route) : route);
    const desk = `<div class="flex gap-1 overflow-x-auto scrollbar-none border-b border-border/60 bg-background/60 px-4 backdrop-blur-xl phone:hidden">${TABS.map((t) => {
      const on = t.route === cur;
      return `<a href="#${t.route}" ${on ? 'aria-current="page"' : ''} class="relative whitespace-nowrap px-3 py-3 text-sm font-medium transition-colors ${on ? 'text-brand after:absolute after:inset-x-3 after:bottom-0 after:h-0.5 after:rounded-full after:bg-brand' : 'text-muted-foreground hover:text-foreground'}">${esc(t.label)}</a>`;
    }).join('')}</div>`;
    const phone = route.startsWith('ratings/record') ? '' : `<div class="flex gap-2 overflow-x-auto scrollbar-none border-b border-border/60 bg-background/70 px-3.5 py-2 backdrop-blur-xl desk:hidden">${TABS.map((t) => {
      const on = t.route === cur;
      return `<a href="#${t.route}" ${on ? 'aria-current="page"' : ''} class="inline-flex h-9 flex-none items-center rounded-full border px-3.5 text-sm font-medium ${on ? 'border-brand bg-brand text-brand-foreground' : 'border-border bg-background text-foreground'}">${esc(t.label)}</a>`;
    }).join('')}</div>`;
    nav.className = 'relative z-10 flex-none';
    nav.innerHTML = desk + phone;
    // a long strip (Static Tables has 16) keeps the current tab in view
    nav.querySelectorAll('[aria-current="page"]').forEach((a) => { const strip = a.parentElement; strip.scrollLeft = a.offsetLeft - (strip.clientWidth - a.offsetWidth) / 2; });
  }
  function phoneTitle(route) {
    if (route === 'dashboard') return 'Home';
    if (route === 'ratings/my-details') return 'My Details';
    if (route === 'ratings/documents') return 'Documents';
    if (route.startsWith('ratings')) return 'Ratings';
    if (route.startsWith('tables/')) return 'Static Tables';
    if (route.startsWith('reports/')) return 'Reports';
    if (route.startsWith('admin/')) return 'Administration';
    const m = MODULES.find((x) => x.key === moduleOf(route));
    return m ? m.label : 'CIRERMS';
  }
  function renderPhoneHeader(route) {
    const rec = route.startsWith('ratings/record/') ? ratingFromRoute(route) : null;
    const back = rec;
    const backTo = rec ? (rec.status === 'former' ? 'ratings/former' : 'ratings/current') : 'ratings/current';
    $('#phone-header').innerHTML = `
      ${back
        ? `<a href="#${backTo}" class="inline-flex h-tap w-tap items-center justify-center rounded-full hover:bg-sidebar-hover" aria-label="Back">${ic('arrow-left', 'icon h-5 w-5')}</a>`
        : `<span class="ml-1.5 flex h-9 w-9 flex-none items-center justify-center rounded-full bg-background p-0.5 ring-2 ring-sidebar-foreground/30"><img src="__CREST__" alt="" class="h-8 w-8 object-contain" /></span>`}
      <span class="min-w-0 flex-1 truncate px-1 text-base font-semibold">${esc(rec ? fullName(rec) : phoneTitle(route))}</span>
      <button type="button" data-act="palette" class="inline-flex h-tap w-tap items-center justify-center rounded-full hover:bg-sidebar-hover" aria-label="Search">${ic('search', 'icon h-5 w-5')}</button>
      <button type="button" data-act="account-sheet" class="inline-flex h-tap w-tap items-center justify-center" aria-label="Account"><span class="flex h-8 w-8 items-center justify-center rounded-full bg-sidebar-accent text-2xs font-bold text-sidebar-accent-foreground">HA</span></button>`;
  }
  function renderBottomBar(route) {
    const cur = route === 'dashboard' ? 'dashboard' : route === 'ratings/documents' ? 'documents' : route === 'ratings/my-details' ? 'me' : route.startsWith('ratings') ? 'ratings' : 'more';
    $('#bottom-bar').innerHTML = BOTTOM.map((b) => {
      const on = b.key === cur;
      const cls = `flex h-16 flex-col items-center justify-center gap-1 text-2xs ${on ? 'font-semibold text-brand' : 'text-muted-foreground'}`;
      const inner = `<span class="flex h-7 w-14 items-center justify-center rounded-full transition-colors ${on ? 'bg-brand/10' : ''}">${ic(b.icon, 'icon h-[22px] w-[22px]')}</span><span>${esc(b.label)}</span>`;
      return b.href ? `<a href="#${b.href}" class="${cls}" ${on ? 'aria-current="page"' : ''}>${inner}</a>` : `<button type="button" data-act="more" aria-haspopup="dialog" class="${cls}">${inner}</button>`;
    }).join('');
    $('#fab').classList.toggle('hidden', !(route === 'ratings/current' || route === 'ratings/former'));
    $('#fab').classList.toggle('flex', route === 'ratings/current' || route === 'ratings/former');
  }
  function openMore() {
    openDialog({
      title: 'More',
      body: AREAS.map((a) => `<div class="mb-4"><div class="mb-2 text-2xs font-semibold uppercase tracking-widest text-muted-foreground">${esc(a.label)}</div>
        <div class="grid grid-cols-4 gap-2">${a.modules.map((m) => `<a href="#${m.href || `soon/${m.key}`}" data-act="close" class="relative flex flex-col items-center gap-1.5 rounded-card p-2 text-center text-2xs font-medium hover:bg-muted">
          <span class="flex h-12 w-12 items-center justify-center rounded-2xl ${m.soon ? 'bg-muted text-muted-foreground' : 'bg-gradient-to-br from-brand-fill to-brand-deep text-on-fill shadow-md shadow-brand-fill/30'}">${ic(m.icon, 'icon h-6 w-6')}</span>${esc(m.short)}
          ${m.soon ? `<span class="${pill.neutral} absolute right-0 top-0">Soon</span>` : ''}</a>`).join('')}</div></div>`).join(''),
    });
  }

  // ==========================================================================
  // Screens
  // ==========================================================================
  function ratingFromRoute(route) { return bySn(route.split('/')[2]); }

  function viewDashboard() {
    const current = ratings.filter((r) => r.status === 'current');
    const former = ratings.length - current.length;
    const tile = (label, value, iconName, tone, foot) => `<div class="${CARD} relative overflow-hidden p-4 transition-all hover:-translate-y-0.5 hover:shadow-card-hover">
        <div class="pointer-events-none absolute -right-8 -top-8 h-28 w-28 rounded-full ${tone[1]}"></div>
        <div class="relative flex items-start justify-between gap-3"><div class="text-2xs font-semibold uppercase tracking-wider text-muted-foreground">${esc(label)}</div>
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br text-on-fill shadow-md ${tone[0]}">${ic(iconName, 'icon h-5 w-5')}</span></div>
        <div class="relative mt-1 text-3xl font-bold tracking-tight">${value}</div>
        <div class="relative mt-2 flex gap-4 border-t border-border/70 pt-2.5 text-xs text-muted-foreground">${foot}</div></div>`;
    const byRate = RATES.map((rate) => [rate, current.filter((r) => r.rate === rate).length]).filter(([, n]) => n);
    const max = Math.max(...byRate.map(([, n]) => n));
    const recent = ratings.slice().sort((a, b) => b.enlisted - a.enlisted).slice(0, 5);
    return pageHeader('Dashboard', 'Ratings at a glance', `<button type="button" data-act="new-rating" class="${btn.primary}">${ic('user-plus')}New Rating</button>`) + `
      <div class="grid grid-cols-4 gap-4 phone:grid-cols-2 phone:gap-3">
        ${tile('Members', ratings.length, 'users', ['from-primary to-primary-hover shadow-primary/30', 'bg-primary/10'], `<a href="#ratings/current" class="hover:text-foreground"><b class="text-foreground">${current.length}</b> current</a><a href="#ratings/former" class="hover:text-foreground"><b class="text-foreground">${former}</b> former</a>`)}
        ${tile('Drafting', 0, 'briefcase', ['from-destructive to-destructive-hover shadow-destructive/30', 'bg-destructive/10'], '<span><b class="text-foreground">0</b> this year</span>')}
        ${tile('Memos and Mails', 0, 'file-text', ['from-secondary to-secondary-hover shadow-secondary/30', 'bg-secondary/10'], '<span><b class="text-foreground">0</b> unread</span>')}
        ${tile('Appraisals', 0, 'clipboard-check', ['from-brand-fill to-brand-deep shadow-brand-fill/30', 'bg-brand/10'], '<span><b class="text-foreground">0</b> this month</span>')}
      </div>
      <div class="mt-4 grid grid-cols-5 gap-4 phone:grid-cols-1">
        <section class="${CARD} col-span-3 phone:col-span-1">
          <div class="flex items-center justify-between border-b border-border px-4 py-3"><h2 class="text-sm font-semibold">Recently Enlisted</h2><a href="#ratings/current" class="${btn.ghost}">View All</a></div>
          <ul>${recent.map((r) => `<li><a href="#ratings/record/${r.sn}" class="flex items-center gap-3 border-b border-border/70 px-4 py-2.5 transition-colors last:border-0 hover:bg-subtle">${avatar(r, 'h-9 w-9 text-xs')}
            <span class="min-w-0 flex-1"><b class="block truncate text-sm font-medium">${esc(fullName(r))}</b><span class="block truncate text-xs text-muted-foreground">${esc(r.sn)} · ${esc(r.ship)}</span></span>
            <span class="text-xs text-muted-foreground">${fmt(r.enlisted)}</span></a></li>`).join('')}</ul>
        </section>
        <section class="${CARD} col-span-2 phone:col-span-1">
          <div class="border-b border-border px-4 py-3"><h2 class="text-sm font-semibold">Current Ratings by Rate</h2></div>
          <div class="space-y-2.5 p-4">${byRate.map(([rate, n]) => `<div><div class="mb-1 flex justify-between text-xs"><span>${esc(rate)}</span><b>${n}</b></div>
            <div class="h-2 rounded-full bg-muted"><div class="h-2 rounded-full bg-gradient-to-r from-brand-fill to-secondary ${fraction(n / max)}"></div></div></div>`).join('')}</div>
        </section>
      </div>`;
  }

  function filtered(status) {
    const q = state.q.trim().toLowerCase();
    return ratings.filter((r) => r.status === status
      && (!q || r.sn.toLowerCase().includes(q) || `${r.surname} ${r.first} ${r.middle}`.toLowerCase().includes(q))
      && (!state.rate || r.rate === state.rate) && (!state.ship || r.ship === state.ship));
  }

  function ratingCard(r, { inSheet = false } = {}) {
    const rec = record(r);
    const current = r.status === 'current';
    return `<div class="space-y-4">
      <div class="flex items-start gap-3">${avatar(r, 'h-12 w-12 text-base')}
        <div class="min-w-0"><div class="text-base font-semibold leading-tight">${esc(fullName(r))}</div>
        <div class="text-sm text-muted-foreground">${esc(r.sn)} · ${esc(r.rate)}</div>
        <div class="mt-1.5 flex flex-wrap gap-1.5"><span class="${current ? pill.success : pill.neutral}">${current ? 'Current' : 'Former'}</span><span class="${pill.info}">${esc(r.branch)}</span></div></div>
      </div>
      ${dl(current ? [['Current Ship', r.ship], ['On Ship For', since(r.shipSince)], ['Command', r.command], ['Enlisted', fmt(r.enlisted)], ['Phone', r.phone], ['Age', `${years(r.dob)}`], ['State of Origin', r.state], ['Documents', `${rec.documents.length}`]]
        : [['Exit Date', fmt(r.exitDate)], ['Reason', r.exitReason], ['Last Ship', r.ship], ['Enlisted', fmt(r.enlisted)], ['Service', `${years(r.enlisted, r.exitDate)} years`], ['State of Origin', r.state]])}
      <div class="flex flex-wrap gap-2 ${inSheet ? 'phone:flex-col' : ''}">
        <a href="#ratings/record/${r.sn}" data-act="close" class="${btn.primary}">${ic('id-card')}Open Record</a>
        <button type="button" data-act="print" class="${btn.blue}">${ic('printer')}Print Report</button>
        <a href="#ratings/documents" data-act="docs-for" data-sn="${r.sn}" class="${btn.outline}">${ic('folder-open')}Documents</a>
      </div></div>`;
  }

  function viewList(status) {
    const isCurrent = status === 'current';
    const rows = filtered(status);
    const ls = state.list[status];
    const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    ls.page = Math.min(ls.page, pages);
    const shown = rows.slice((ls.page - 1) * PAGE_SIZE, ls.page * PAGE_SIZE);
    if (sideBySide() && (!ls.picked || !shown.some((r) => r.sn === ls.picked))) ls.picked = shown[0] ? shown[0].sn : null;
    const picked = ls.picked && bySn(ls.picked);
    const cols = isCurrent ? ['Official No', 'Name', 'Rate', 'Ship', 'Branch'] : ['Official No', 'Name', 'Rate', 'Exit Date', 'Reason'];
    const cells = (r) => isCurrent ? [r.sn, fullName(r), short(r.rate), r.ship, r.branch] : [r.sn, fullName(r), short(r.rate), fmt(r.exitDate), r.exitReason];
    const from = rows.length ? (ls.page - 1) * PAGE_SIZE + 1 : 0;
    const to = Math.min(ls.page * PAGE_SIZE, rows.length);

    const header = pageHeader(isCurrent ? 'Current Ratings' : 'Former Ratings', isCurrent ? 'Serving ratings on the nominal roll' : 'Retired and discharged ratings', `
      <div class="relative">
        <button type="button" data-act="export" aria-haspopup="menu" class="${btn.blue}">${ic('download')}Export${ic('chevron-down')}</button>
        <div id="export-menu" role="menu" class="absolute right-0 top-full z-30 mt-1.5 hidden w-44 rounded-card border border-border/70 bg-popover p-1 text-sm shadow-pop phone:left-0 phone:right-auto">
          ${[['copy', 'Copy Rows'], ['file-spreadsheet', 'Excel'], ['file-text', 'PDF'], ['file-text', 'CSV']].map(([i, l]) => `<button role="menuitem" type="button" data-act="exported" class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-left hover:bg-subtle">${ic(i)}${l}</button>`).join('')}
        </div>
      </div>
      <button type="button" data-act="new-rating" class="${btn.primary}">${ic('user-plus')}New Rating</button>`, false);

    const toolbar = `<div class="mb-3 flex flex-wrap items-end gap-3 phone:gap-2">
        <label class="relative min-w-0 flex-1 desk:max-w-xs"><span class="sr-only">Search</span>
          <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-muted-foreground">${ic('search')}</span>
          <input id="list-q" type="search" value="${esc(state.q)}" placeholder="Official No or name" class="${INPUT} pl-9" /></label>
        <div class="w-56 phone:hidden"><select name="rate-filter" aria-label="Rate">${options(RATES, state.rate, 'All Rates')}</select></div>
        <div class="w-48 phone:hidden"><select name="ship-filter" aria-label="Ship">${options(SHIPS, state.ship, 'All Ships')}</select></div>
        <button type="button" data-act="export-sheet" class="${btn.outline} w-tap px-0 desk:hidden" aria-label="Export">${ic('download')}</button>
        <button type="button" data-act="filters" class="${btn.outline} desk:hidden">${ic('funnel')}Filter${state.rate || state.ship ? ` <span class="${pill.info}">${(state.rate ? 1 : 0) + (state.ship ? 1 : 0)}</span>` : ''}</button>
        <span class="ml-auto text-sm text-muted-foreground phone:hidden">${rows.length} ${rows.length === 1 ? 'rating' : 'ratings'}</span>
      </div>`;

    const table = `<div class="${CARD} overflow-hidden phone:hidden"><div class="overflow-x-auto"><table class="w-full text-sm">
        <thead class="bg-subtle text-left"><tr>${cols.map((c) => `<th class="${TH}">${c}</th>`).join('')}</tr></thead>
        <tbody>${shown.map((r) => {
          const on = sideBySide() && r.sn === ls.picked;
          return `<tr data-pick="${r.sn}" tabindex="0" class="cursor-pointer border-t border-border transition-colors ${on ? 'bg-secondary/10 shadow-[inset_3px_0_0_0_rgb(var(--secondary))]' : 'hover:bg-subtle'}">${cells(r).map((c, i) => `<td class="whitespace-nowrap px-4 py-2.5 ${i === 1 ? 'font-medium' : ''} ${i === 0 ? 'text-muted-foreground' : ''}">${esc(c)}</td>`).join('')}</tr>`;
        }).join('') || `<tr><td colspan="5">${empty('search', 'No Ratings Found')}</td></tr>`}</tbody></table></div>
        ${pager(ls.page, pages, from, to, rows.length, status)}</div>`;

    const cards = `<div class="space-y-2 desk:hidden">${shown.map((r) => `<button type="button" data-pick="${r.sn}" class="${CARD} flex w-full items-center gap-3 p-3 text-left transition-all hover:shadow-card-hover active:bg-subtle">${avatar(r, 'h-10 w-10 text-xs')}
        <span class="min-w-0 flex-1"><b class="block truncate text-sm font-semibold">${esc(fullName(r))}</b>
        <span class="block truncate text-xs text-muted-foreground">${esc(r.sn)} · ${esc(isCurrent ? r.ship : `Left ${fmt(r.exitDate)}`)}</span></span>${ic('chevron-right', 'icon text-muted-foreground')}</button>`).join('') || `<div class="${CARD}">${empty('search', 'No Ratings Found')}</div>`}
        <div class="${CARD}">${pager(ls.page, pages, from, to, rows.length, status)}</div></div>`;

    const detail = picked && sideBySide()
      ? `<aside class="${CARD} sticky top-0 self-start p-4" aria-label="Rating">${ratingCard(picked)}</aside>` : '';
    return header + toolbar + `<div class="grid gap-4 ${detail ? 'grid-cols-3' : 'grid-cols-1'}"><div class="min-w-0 ${detail ? 'col-span-2' : ''}">${table}${cards}</div>${detail}</div>`;
  }

  function pager(page, pages, from, to, total, status) {
    return `<div class="flex items-center gap-2 border-t border-border px-4 py-2.5 text-sm text-muted-foreground phone:border-0 phone:px-3">
      <span class="flex-1">${from}-${to} of ${total}</span>
      <button type="button" data-act="page" data-list="${status}" data-to="${page - 1}" ${page <= 1 ? 'disabled' : ''} class="inline-flex h-8 w-8 items-center justify-center rounded-ctl border border-input bg-background text-foreground disabled:opacity-40 phone:h-tap phone:w-tap" aria-label="Previous Page">${ic('chevron-left')}</button>
      <span class="text-xs">Page ${page} of ${pages}</span>
      <button type="button" data-act="page" data-list="${status}" data-to="${page + 1}" ${page >= pages ? 'disabled' : ''} class="inline-flex h-8 w-8 items-center justify-center rounded-ctl border border-input bg-background text-foreground disabled:opacity-40 phone:h-tap phone:w-tap" aria-label="Next Page">${ic('chevron-right')}</button>
    </div>`;
  }

  // ---- the rating's record: one page, ten tabs ----
  const RECORD_TABS = [
    ['details', 'Details'], ['nok', 'Next of Kin'], ['spouse', 'Spouse'], ['children', 'Children'], ['advancement', 'Advancement'],
    ['drafting', 'Drafting'], ['training', 'Training'], ['education', 'Education'], ['language', 'Language'], ['documents', 'Documents'],
  ];
  function viewRecord(r, { readOnly = false } = {}) {
    if (!r) return empty('search', 'Rating Not Found', `<a href="#ratings/current" class="${btn.outline}">Back to List</a>`);
    const rec = record(r);
    const filled = ['nok', 'spouse', 'children', 'advancement', 'drafting', 'training', 'education', 'language', 'documents'].filter((k) => rec[k].length).length + 1;
    const level = filled * 10 >= 80 ? 'high' : filled * 10 >= 50 ? 'mid' : 'low';
    const levelText = { low: 'text-error', mid: 'text-warning', high: 'text-success' }[level];
    const tabCount = (k) => (k === 'details' ? '' : rec[k].length ? `<span class="ml-1.5 rounded-full bg-muted px-1.5 text-2xs font-semibold text-muted-foreground">${rec[k].length}</span>` : '');
    const tab = state.recordTab;
    const add = (label) => (readOnly ? '' : `<button type="button" data-act="edit" data-what="${esc(label)}" class="${btn.outline}">${ic('plus')}${esc(label)}</button>`);
    const tableCard = (heads, rows, emptyIcon, emptyText, addLabel) => `<div class="${CARD} overflow-hidden">
        ${rows.length ? `${readOnly ? '' : `<div class="flex justify-end border-b border-border px-4 py-2.5">${add(addLabel)}</div>`}<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-subtle text-left"><tr>${heads.map((h) => `<th class="${TH}">${h}</th>`).join('')}</tr></thead>
        <tbody>${rows.map((cells) => `<tr class="border-t border-border">${cells.map((c, i) => `<td class="whitespace-nowrap px-4 py-2.5 ${i === 0 ? 'font-medium' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
        : empty(emptyIcon, emptyText, add(addLabel))}</div>`;
    const yes = (v) => (v ? `<span class="text-success">${ic('check')}</span>` : '<span class="text-muted-foreground">-</span>');

    let body = '';
    if (tab === 'details') {
      const section = (title, rows) => `<section class="${CARD}"><div class="flex items-center justify-between border-b border-border px-4 py-2.5"><h3 class="text-sm font-semibold">${title}</h3>
          ${readOnly ? '' : `<button type="button" data-act="edit" data-what="${title}" class="${btn.ghost}">${ic('pencil')}Edit</button>`}</div><div class="p-4">${dl(rows)}</div></section>`;
      body = `<div class="grid grid-cols-2 gap-4 phone:grid-cols-1">
        ${section('Basic Details', [['Surname', r.surname], ['First Name', r.first], ['Middle Name', r.middle], ['Rate', r.rate], ['Date of Birth', `${fmt(r.dob)} (${years(r.dob)})`], ['Gender', r.gender], ['Marital Status', rec.spouse.length ? 'Married' : 'Single'], ['Religion', 'Christianity']])}
        ${section('Contact', [['Phone', r.phone], ['Email', `${r.first.toLowerCase()}.${r.surname.toLowerCase()}@navy.mil.ng`], ['State of Origin', r.state], ['Local Government', `${r.state} North`], ['Address', '14 Marine Road, Apapa, Lagos']])}
        ${section('Health', [['Blood Group', 'O+'], ['Genotype', 'AA'], ['Height', '1.76 m'], ['Complexion', 'Dark'], ['Disability', 'None']])}
        ${section('Official', [['Official Number', r.sn], ['Branch', r.branch], ['Command', r.command], ['Date Enlisted', fmt(r.enlisted)], ['Entry Mode', 'Direct Entry'], ['Current Ship', r.status === 'current' ? `${r.ship} (${since(r.shipSince)})` : '-']])}
      </div>`;
    } else if (tab === 'nok') {
      body = rec.nok.length ? `<div class="grid grid-cols-2 gap-4 phone:grid-cols-1">${rec.nok.map((n) => `<section class="${CARD} p-4"><div class="mb-3 flex items-center justify-between"><b class="text-sm">${esc(n.name)}</b><span class="${pill.info}">${esc(n.relation)}</span></div>${dl([['Phone', n.phone], ['Address', n.address]])}</section>`).join('')}</div>${readOnly ? '' : `<div class="mt-3">${add('Add Next of Kin')}</div>`}`
        : `<div class="${CARD}">${empty('users', 'No Next of Kin Recorded', add('Add Next of Kin'))}</div>`;
    } else if (tab === 'spouse') {
      body = tableCard(['Name', 'Married', 'Phone', 'Occupation'], rec.spouse.map((s) => [esc(s.name), fmt(s.married), esc(s.phone), esc(s.occupation)]), 'heart', 'No Spouse Recorded', 'Add Spouse');
    } else if (tab === 'children') {
      body = tableCard(['Name', 'Gender', 'Date of Birth', 'Age'], rec.children.map((c) => [esc(c.name), c.gender, fmt(c.dob), years(c.dob)]), 'baby', 'No Children Recorded', 'Add Child');
    } else if (tab === 'advancement') {
      body = tableCard(['From', 'To', 'Effective'], rec.advancement.map((a) => [esc(a.from), esc(a.to), fmt(a.date)]), 'trending-up', 'No Advancement Recorded', 'Add Advancement');
    } else if (tab === 'drafting') {
      body = `<div class="${CARD} p-4"><ol class="relative ml-2 border-l-2 border-border">${rec.drafting.slice().reverse().map((p) => `<li class="relative pb-5 pl-5 last:pb-0">
          <span class="absolute -left-[9px] top-1 h-4 w-4 rounded-full border-2 border-background ${p.to ? 'bg-border' : 'bg-primary'}"></span>
          <div class="flex flex-wrap items-center gap-2"><b class="text-sm">${esc(p.ship)}</b>${p.to ? '' : `<span class="${pill.success}">Current</span>`}</div>
          <div class="text-xs text-muted-foreground">${fmt(p.from)} to ${p.to ? fmt(p.to) : 'date'} · ${since(p.from)}${p.to ? '' : ' so far'}</div></li>`).join('')}</ol>
          ${readOnly ? '' : `<div class="mt-4 border-t border-border pt-3">${add('Add Posting')}</div>`}</div>`;
    } else if (tab === 'training') {
      body = tableCard(['Course', 'Institution', 'From', 'To', 'Result'], rec.training.map((t) => [esc(t.course), esc(t.place), fmt(t.from), fmt(t.to), `<span class="${pill.success}">${esc(t.result)}</span>`]), 'graduation-cap', 'No Training Recorded', 'Add Course');
    } else if (tab === 'education') {
      body = tableCard(['Qualification', 'Institution', 'Year'], rec.education.map((e) => [esc(e.qualification), esc(e.school), e.year]), 'book-open', 'No Education Recorded', 'Add Qualification');
    } else if (tab === 'language') {
      body = tableCard(['Language', 'Read', 'Write', 'Speak'], rec.language.map((l) => [esc(l.language), yes(l.read), yes(l.write), yes(l.speak)]), 'languages', 'No Languages Recorded', 'Add Language');
    } else if (tab === 'documents') {
      body = documentsBlock(r, rec, readOnly);
    }

    const actions = readOnly
      ? `<button type="button" data-act="print" class="${btn.blue}">${ic('printer')}Print Dossier</button>`
      : `<button type="button" data-act="edit" data-what="Basic Details" class="${btn.primary}">${ic('pencil')}Edit Details</button>
         <button type="button" data-act="print" class="${btn.blue}">${ic('printer')}Print Dossier</button>
         <button type="button" data-act="delete" class="${btn.outline} text-destructive phone:hidden">${ic('trash-2')}Delete</button>`;

    return `${readOnly ? pageHeader('My Details', 'Your service record') : `<a href="#${r.status === 'former' ? 'ratings/former' : 'ratings/current'}" class="mb-3 inline-flex items-center gap-1 text-sm text-secondary hover:underline phone:hidden">${ic('chevron-left')}${r.status === 'former' ? 'Former Ratings' : 'Current Ratings'}</a>`}
      <section class="${CARD} mb-4 overflow-hidden">
        <div class="flex flex-wrap items-center gap-4 p-4">
          ${avatar(r, 'h-16 w-16 text-xl phone:h-14 phone:w-14 phone:text-lg')}
          <div class="min-w-0 flex-1">
            <h1 class="text-xl font-semibold tracking-tight">${esc(`${short(r.rate)} ${r.surname} ${r.first} ${r.middle}`)}</h1>
            <div class="text-sm text-muted-foreground">${esc(r.sn)} · ${esc(r.rate)} · ${esc(r.status === 'current' ? r.ship : `Left ${fmt(r.exitDate)}`)}</div>
            <div class="mt-1.5 flex flex-wrap gap-1.5"><span class="${r.status === 'current' ? pill.success : pill.neutral}">${r.status === 'current' ? 'Current' : 'Former'}</span><span class="${pill.info}">${esc(r.branch)}</span><span class="${pill.neutral}">${esc(r.command)}</span></div>
          </div>
          <div class="flex flex-wrap gap-2 phone:w-full phone:[&>*]:flex-1">${actions}</div>
        </div>
        <div class="flex items-center gap-3 border-t border-border/70 bg-subtle/60 px-4 py-3"><div class="cirerms-progress-track flex-1"><div class="cirerms-progress-bar ${fraction(filled / 10)}" data-level="${level}"></div></div><span class="text-xs text-muted-foreground">Record <b class="${levelText}">${filled * 10}%</b> complete</span></div>
      </section>
      <div class="mb-4 flex gap-1 overflow-x-auto scrollbar-none border-b border-border phone:gap-2 phone:border-0" role="tablist">${RECORD_TABS.map(([k, label]) => {
        const on = k === tab;
        return `<button type="button" role="tab" aria-selected="${on}" data-act="record-tab" data-tab="${k}" class="inline-flex flex-none items-center whitespace-nowrap text-sm font-medium transition-colors desk:relative desk:px-2.5 desk:py-2.5 phone:h-9 phone:rounded-full phone:border phone:px-3.5 ${on ? 'text-brand desk:after:absolute desk:after:inset-x-3 desk:after:bottom-0 desk:after:h-0.5 desk:after:rounded-full desk:after:bg-brand phone:border-brand phone:bg-brand phone:text-brand-foreground' : 'text-muted-foreground hover:text-foreground phone:border-border phone:bg-background phone:text-foreground'}">${esc(label)}${tabCount(k)}</button>`;
      }).join('')}</div>
      ${body}`;
  }

  function documentsBlock(r, rec, readOnly) {
    const docs = rec.documents.filter((x) => state.docCat === 'ALL' || x.cat === state.docCat);
    const catName = (code) => (CATEGORIES.find(([c]) => c === code) || [, code])[1];
    if (sideBySide() && (!state.docPicked || !docs.some((x) => x.name === state.docPicked))) state.docPicked = docs[0] ? docs[0].name : null;
    const picked = docs.find((x) => x.name === state.docPicked);
    const chips = `<div class="mb-3 flex gap-2 overflow-x-auto scrollbar-none">${[['ALL', 'All']].concat(CATEGORIES).map(([code, label]) => {
      const n = code === 'ALL' ? rec.documents.length : rec.documents.filter((x) => x.cat === code).length;
      const on = state.docCat === code;
      return `<button type="button" data-act="doc-cat" data-cat="${code}" class="inline-flex h-8 flex-none items-center gap-1.5 rounded-full border px-3 text-xs font-medium phone:h-9 ${on ? 'border-brand bg-brand text-brand-foreground' : 'border-border bg-background text-foreground hover:bg-subtle'}">${label}<span class="${on ? 'text-brand-foreground' : 'text-muted-foreground'}">${n}</span></button>`;
    }).join('')}</div>`;
    const list = `<div class="${CARD} self-start overflow-hidden">${docs.length ? `<ul>${docs.map((x) => `<li><button type="button" data-act="doc-pick" data-doc="${esc(x.name)}" class="flex w-full items-center gap-3 border-b border-border px-4 py-3 text-left last:border-0 ${sideBySide() && x.name === state.docPicked ? 'bg-secondary/10' : 'hover:bg-subtle'}">
        <span class="flex h-10 w-10 flex-none items-center justify-center rounded-xl bg-gradient-to-br from-error-soft to-background text-error ring-1 ring-error/15">${ic('file-text')}</span>
        <span class="min-w-0 flex-1"><b class="block truncate text-sm font-medium">${esc(x.name)}</b><span class="block text-xs text-muted-foreground">${esc(catName(x.cat))} · ${x.size} · ${fmt(x.date)}</span></span>
        ${ic('chevron-right', 'icon text-muted-foreground')}</button></li>`).join('')}</ul>` : empty('folder-open', 'No Documents Here')}
        ${readOnly ? '' : `<div class="border-t border-border bg-subtle px-4 py-3"><button type="button" data-act="upload-doc" class="${btn.primary}">${ic('upload')}Upload Document</button></div>`}</div>`;
    const preview = picked && sideBySide() ? `<aside class="${CARD} sticky top-0 self-start overflow-hidden">${docPreview(picked, catName(picked.cat), r, readOnly)}</aside>` : '';
    return chips + `<div class="grid gap-4 ${preview ? 'grid-cols-2' : 'grid-cols-1'}">${list}${preview}</div>`;
  }
  function docPreview(x, cat, r, readOnly) {
    return `<div class="flex items-center gap-2 border-b border-border px-4 py-2.5"><b class="min-w-0 flex-1 truncate text-sm">${esc(x.name)}</b><span class="${pill.info}">${esc(cat)}</span></div>
      <div class="bg-muted p-5"><div class="mx-auto aspect-[3/4] max-w-xs space-y-2.5 rounded-md bg-background p-6 shadow-pop">
        <div class="mx-auto mb-4 h-10 w-10 rounded-full bg-muted"></div><div class="mx-auto h-2 w-2/3 rounded bg-foreground/70"></div><div class="mx-auto mb-4 h-1.5 w-1/2 rounded bg-muted-foreground/40"></div>
        ${FRACTIONS.slice(7, 13).map((w) => `<div class="h-1.5 ${w} rounded bg-muted"></div>`).join('')}
        <div class="pt-6"><div class="h-1.5 w-1/3 rounded bg-muted"></div><div class="mt-1.5 h-1.5 w-1/4 rounded bg-muted"></div></div></div></div>
      <div class="flex flex-wrap gap-2 border-t border-border px-4 py-3 phone:flex-col">
        <button type="button" data-act="download" class="${btn.blue}">${ic('download')}Download</button>
        ${readOnly ? '' : `<button type="button" data-act="delete-doc" class="${btn.outline} text-destructive">${ic('trash-2')}Delete</button>`}</div>`;
  }

  const NEW_STEPS = ['Basic Details', 'Contact', 'Health', 'Official'];
  function newRatingSteps(s) {
    return NEW_STEPS.map((label, i) => {
      const n = i + 1; const done = n < s; const on = n === s;
      return `<li><button type="button" data-act="step" data-step="${n}" ${on ? 'aria-current="step"' : ''} class="flex w-full items-center gap-2.5 rounded-ctl px-3 py-2 text-left text-sm transition-colors phone:flex-col phone:gap-1 phone:px-1 phone:text-center phone:text-2xs ${on ? 'bg-brand/10 font-semibold text-foreground' : 'text-muted-foreground hover:bg-subtle'}">
        <span class="flex h-7 w-7 flex-none items-center justify-center rounded-full text-xs font-semibold ${done ? 'bg-primary text-primary-foreground' : on ? 'bg-brand text-brand-foreground' : 'bg-muted text-muted-foreground'}">${done ? ic('check') : n}</span>${label}</button></li>`;
    }).join('');
  }
  function newRatingFoot(s) {
    return `<button type="button" data-act="step" data-step="${s - 1}" ${s === 1 ? 'disabled' : ''} class="${btn.outline} disabled:opacity-40 desk:mr-auto ${s === 1 ? 'phone:hidden' : ''}">${ic('chevron-left')}Back</button>
      <button type="button" data-act="close" class="${btn.outline}">Cancel</button>
      ${s < 4 ? `<button type="button" data-act="step" data-step="${s + 1}" class="${btn.blue}">Next${ic('chevron-right')}</button>` : `<button type="button" data-act="save-new" class="${btn.primary}">${ic('check')}Save Rating</button>`}`;
  }
  function setNewStep(n) {
    state.step = Math.max(1, Math.min(4, n));
    $('#nr-steps').innerHTML = newRatingSteps(state.step);
    document.querySelectorAll('[data-panel]').forEach((p) => p.classList.toggle('hidden', Number(p.dataset.panel) !== state.step));
    $('#dialog-foot').innerHTML = newRatingFoot(state.step);
    $('#dialog-body').scrollTop = 0;
  }
  function openNewRating() {
    state.step = 1;
    openDialog({ title: 'New Rating', size: '2xl', body: newRatingBody(), foot: newRatingFoot(1) });
  }
  function newRatingBody() {
    const s = 1;
    const grid = (inner) => `<div class="grid grid-cols-3 gap-4 phone:grid-cols-1">${inner}</div>`;
    const sel = (label, list, opt) => field(label, `<select name="${esc(label)}">${options(list)}</select>`, opt);
    const txt = (label, opt, type = 'text', ph = '') => field(label, `<input type="${type}" placeholder="${esc(ph)}" class="${INPUT}" />`, opt);
    const fields = [
      grid(sel('Rate', RATES) + sel('Title', RATES.map(short)) + txt('Official Number', false, 'text', 'e.g. B0539') + txt('Surname') + txt('First Name') + txt('Middle Name', true)
        + sel('Gender', ['Male', 'Female']) + txt('Date of Birth', false, 'text', 'dd/mm/yyyy') + sel('Marital Status', ['Single', 'Married', 'Divorced', 'Widowed'])
        + sel('Religion', ['Christianity', 'Islam', 'Traditional', 'Other']) + sel('Tribe', ['Igbo', 'Yoruba', 'Hausa', 'Ijaw', 'Efik', 'Tiv', 'Other'], true)),
      grid(txt('Phone', false, 'tel', '0803 000 0000') + txt('Email', true, 'email') + sel('State of Origin', STATES) + sel('Local Government', ['Select a state first'], false) + sel('Geopolitical Zone', ['North Central', 'North East', 'North West', 'South East', 'South South', 'South West'])
        + `<div class="col-span-3 phone:col-span-1">${txt('Residential Address')}</div>`),
      grid(sel('Blood Group', ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-']) + sel('Genotype', ['AA', 'AS', 'SS', 'AC']) + txt('Height (m)', true) + sel('Complexion', ['Fair', 'Light', 'Dark'], true) + sel('Disability', ['None', 'Visual', 'Hearing', 'Physical'], true) + sel('Tribal Mark', ['No', 'Yes'], true)),
      grid(sel('Branch', BRANCHES) + sel('Command', COMMANDS) + sel('Staff Branch', BRANCHES, true) + sel('Entry Mode', ['Direct Entry', 'Recruit', 'Transfer']) + txt('Date Enlisted', false, 'text', 'dd/mm/yyyy') + txt('Seniority Date', true, 'text', 'dd/mm/yyyy')),
    ];
    // every step is in the form at once and only the current one shows, so moving between steps keeps what was typed
    return `<form onsubmit="return false">
        <ol id="nr-steps" class="mb-5 grid grid-cols-4 gap-1 rounded-card bg-subtle/70 p-1">${newRatingSteps(s)}</ol>
        ${fields.map((f, i) => `<div data-panel="${i + 1}" class="${i ? 'hidden' : ''} flex gap-6 phone:flex-col">
          <div class="min-w-0 flex-1">${f}</div>
          ${i === 0 ? `<div class="w-48 flex-none phone:w-full"><span class="${LABEL}">Passport Photograph</span>
            <div class="flex aspect-[4/5] flex-col items-center justify-center gap-2 rounded-card border-2 border-dashed border-input bg-subtle text-center text-xs text-muted-foreground transition-colors phone:aspect-auto phone:py-6">${ic('image', 'icon h-8 w-8')}JPG, PNG or WebP, up to 5 MB
            <button type="button" data-act="demo" class="${btn.outline} mt-1">${ic('upload')}Choose Photo</button></div></div>` : ''}
        </div>`).join('')}
      </form>`;
  }

  function viewUpload() {
    const st = state.upload;
    const stepHead = (n, title, on, done) => `<div class="flex items-center gap-3"><span class="flex h-8 w-8 flex-none items-center justify-center rounded-full text-sm font-semibold ${done ? 'bg-primary text-primary-foreground' : on ? 'bg-brand text-brand-foreground' : 'bg-muted text-muted-foreground'}">${done ? ic('check') : n}</span><h2 class="text-sm font-semibold">${title}</h2></div>`;
    const issues = [['Row 7', 'B0611', 'Rate "Senior Seaman" is not in the list', 'error'], ['Row 12', 'B0539', 'Official Number already exists, skipped', 'warning'], ['Row 19', 'B0702', 'Official Number already exists, skipped', 'warning']];
    return pageHeader('Batch Upload', 'Add many ratings from one workbook') + `
      <div class="grid grid-cols-3 gap-4 phone:grid-cols-1">
        <section class="${CARD} space-y-3 p-4">${stepHead(1, 'Download Template', st === 0, st > 0)}
          <p class="text-sm text-muted-foreground">The workbook lists every field and its allowed values.</p>
          <button type="button" data-act="template" class="${btn.blue}">${ic('file-spreadsheet')}Download Template</button></section>
        <section class="${CARD} space-y-3 p-4">${stepHead(2, 'Upload Workbook', st <= 1, st > 1)}
          <button type="button" data-act="choose-workbook" class="flex w-full flex-col items-center gap-2 rounded-card border-2 border-dashed border-input bg-subtle transition-colors px-4 py-6 text-center text-sm text-muted-foreground hover:border-ring">
            ${ic('file-up', 'icon h-7 w-7')}${st > 1 ? '<b class="text-foreground">ratings-nov-2026.xlsx</b>28 rows read' : 'Choose an .xlsx workbook'}</button></section>
        <section class="${CARD} space-y-3 p-4">${stepHead(3, 'Review and Commit', st === 2, st > 2)}
          ${st >= 2 ? `<div class="grid grid-cols-3 gap-2 text-center"><div class="rounded-ctl bg-success-soft p-2 text-success"><b class="block text-lg">25</b><span class="text-2xs">Ready</span></div>
            <div class="rounded-ctl bg-warning-soft p-2 text-warning"><b class="block text-lg">2</b><span class="text-2xs">Skipped</span></div><div class="rounded-ctl bg-error-soft p-2 text-error"><b class="block text-lg">1</b><span class="text-2xs">Errors</span></div></div>
            <button type="button" data-act="commit" ${st > 2 ? 'disabled' : ''} class="${btn.primary} w-full disabled:opacity-50">${ic('check')}${st > 2 ? 'Committed' : 'Commit 25 Ratings'}</button>`
            : '<p class="text-sm text-muted-foreground">Upload a workbook to see what will be added.</p>'}</section>
      </div>
      ${st >= 2 ? `<section class="${CARD} mt-4 overflow-hidden"><div class="border-b border-border px-4 py-3"><h2 class="text-sm font-semibold">Rows Not Added</h2></div>
        <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-subtle text-left"><tr>${['Row', 'Official No', 'Issue'].map((h) => `<th class="${TH}">${h}</th>`).join('')}</tr></thead>
        <tbody>${issues.map(([row, sn, msg, tone]) => `<tr class="border-t border-border"><td class="px-4 py-2.5 font-medium">${row}</td><td class="px-4 py-2.5">${sn}</td><td class="px-4 py-2.5"><span class="${pill[tone]}">${tone === 'error' ? 'Error' : 'Skipped'}</span> ${esc(msg)}</td></tr>`).join('')}</tbody></table></div></section>` : ''}`;
  }

  function viewDocuments() {
    const r = bySn(state.docSn);
    return pageHeader('Documents', 'Navpers files by service number') + `
      <div class="mb-4 flex flex-wrap items-end gap-3">
        <div class="w-80 phone:w-full"><span class="${LABEL}">Rating</span><select name="doc-rating" aria-label="Rating">${`<option value="">-- Select Rating --</option>${ratings.map((x) => `<option value="${x.sn}"${x.sn === state.docSn ? ' selected' : ''}>${esc(`${x.sn} · ${fullName(x)}`)}</option>`).join('')}`}</select></div>
        ${r ? `<a href="#ratings/record/${r.sn}" class="${btn.outline}">${ic('id-card')}Open Record</a>` : ''}
      </div>
      ${r ? documentsBlock(r, record(r), false) : `<div class="${CARD}">${empty('folder-open', 'Choose a Rating')}</div>`}`;
  }

  function viewSoon(key) {
    const m = MODULES.find((x) => x.key === key) || { label: 'Module', icon: 'lock' };
    return pageHeader(m.label, '') + `<div class="${CARD}">${empty(m.icon, 'Coming in a Later Release', `<a href="#dashboard" class="${btn.outline}">${ic('house')}Go to Dashboard</a>`)}</div>`;
  }

  // ==========================================================================
  // Administration: Static Tables, Reports, System Administration
  // ==========================================================================
  const T = (slug, tab, title, item, cols, rows, extra = {}) => ({ slug, tab, title, item, cols, rows: rows.map((r) => (Array.isArray(r) ? r : [r])), ...extra });
  const TABLES = [
    T('appraisal-ratings', 'Appraisal Ratings', 'Appraisal Ratings', 'Grade', ['Grade', 'Code', 'Score Range'], [['Outstanding', 'A', '90 - 100'], ['Very Good', 'B', '75 - 89'], ['Good', 'C', '60 - 74'], ['Fair', 'D', '45 - 59'], ['Poor', 'E', '0 - 44']]),
    T('branch', 'Branch', 'Branches', 'Branch', ['Branch'], ['Seaman', 'Marine Engineering', 'Weapon Engineering', 'Logistics', 'Medical', 'Information Technology', 'Education', 'Naval Police', 'Music', 'Physical Training']),
    T('exit-type', 'Exit Type', 'Exit Types', 'Exit Type', ['Exit Type'], ['Discharged', 'Retired', 'Voluntary Discharge', 'Medical Discharge', 'Dismissed', 'Deceased']),

  // historic cycles, built from each record's own postings and advancements: every move is a reported draft in a closed batch
  (function history() {
    const sigN = { DOD: 20, DOA: 12 };
    const group = (flow, items, keyOf, codeOf) => {
      const g = {};
      items.forEach((it) => { const k = keyOf(it); (g[k] = g[k] || []).push(it); });
      const minD = (l) => l.reduce((m, it) => (it.date < m ? it.date : m), l[0].date);
      Object.keys(g).sort((a, c) => minD(g[a]) - minD(g[c])).forEach((k) => {
        const list = g[k]; const first = list.reduce((m, it) => (it.date < m ? it.date : m), list[0].date);
        const closed = addDays(first, -21);
        sigN[flow] += 1;
        const o = codeOf(list[0]);
        const b = makeBatch(flow, { ...o, status: 'closed', init: addDays(closed, -24), by: ['NAVPERS01', 'NAVPERS02'][sigN[flow] % 2], closed, closedBy: 'HICO001', signal: `NHQ/NP/${flow}/${sigN[flow]}/${closed.getFullYear()}`,
          rows: list.map((it) => (flow === 'DOD' ? { sn: it.r.sn, from: it.from, to: it.to, vice: '', remark: '', request: '', wef: it.date } : { sn: it.r.sn, from: it.from, to: it.to, reason: '', remark: '', date: it.date })) });
        return b;
      });
    };
    const drafts = []; const advs = [];
    ratings.forEach((r) => {
      const h = postings(r);
      for (let i = 1; i < h.length; i += 1) drafts.push({ r, from: h[i - 1].ship, to: h[i].ship, date: h[i].from });
      record(r).advancement.forEach((a) => advs.push({ r, from: a.from, to: a.to, date: a.date }));
    });
    group('DOD', drafts, (it) => `${it.r.branch}|${it.date.getFullYear()}`, (it) => ({ branch: it.r.branch }));
    group('DOA', advs, (it) => `${it.date.getFullYear()}`, () => ({}));
  })();

  // open and closed batches of this cycle
  (function thisCycle() {
    const shipFor = (r, n) => SHIP_NAMES.filter((s) => s !== r.ship && s !== 'NAVTRAC EBUTE-ERO')[(n * 3 + ratings.indexOf(r)) % (SHIP_NAMES.length - 2)];

    makeBatch('DOD', { branch: 'Marine Engineering', init: d(2026, 11, 9), by: 'NAVPERS02', rows: dod(br('Marine Engineering')) });

    const c1 = makeBatch('DOD', { branch: 'Logistics', init: d(2026, 10, 20), by: 'NAVPERS02', status: 'closed', closed: d(2026, 11, 6), closedBy: 'HICO001', signal: 'NHQ/NP/DOD/131/2026', rows: dod(br('Logistics')) });
    makeBatch('DOD', { branch: 'Naval Police', init: d(2026, 10, 26), by: 'NAVPERS01', status: 'closed', closed: d(2026, 11, 12), closedBy: 'HICO001', signal: 'NHQ/NP/DOD/134/2026', rows: dod(br('Naval Police')) });

    const pos = current().filter((r) => r.rate === 'Petty Officer (PO)' && rateMo(r) >= 48 && !a2rows.some((x) => x.sn === r.sn)).slice(0, 3);
    makeBatch('DOA', { rate: 'Petty Officer (PO)', init: d(2026, 10, 14), by: 'NAVPERS02', status: 'closed', closed: d(2026, 11, 5), closedBy: 'HICO001', signal: 'NHQ/NP/DOA/052/2026', rows: pos.map((r) => ({ sn: r.sn, from: r.rate, to: 'Chief Petty Officer (CPO)', reason: '', remark: '', date: null })) });

  // ---- Training Drafting (DOT) ----

  // ---- add one rating to a batch: find by Official No, then add ----
