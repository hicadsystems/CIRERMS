  }
  const finish = (res) => { if (res.done) toast(res.done, res.tone); closeDialog(); if (res.go) location.hash = `#${res.go}`; else render(); if (res.then) setTimeout(res.then, 30); };
  D1ACT.submit = () => {
    feClear();
    const res = S.form && S.form();
    if (!res) return;
    if (res.errors) { Object.entries(res.errors).forEach(([k, v]) => fe(k, v)); const first = document.querySelector('#dialog [data-err]:not(.hidden)'); if (first) first.scrollIntoView({ block: 'nearest' }); return; }
    finish(res);
  };
  const confirmBox = ({ title, text, label, icon = 'check', tone = 'primary', run }) => d1Form({ title, size: 'sm', body: `<p class="text-sm">${text}</p>`, submit: label, icon, tone, onSubmit: run });

  // a printout as a paper sheet; the server makes the real PDF
  function d1Pdf({ title, file, meta = [], cols, rows, sign = [], note = '' }) {
    const per = 22; const chunks = []; for (let i = 0; i < Math.max(rows.length, 1); i += per) chunks.push(rows.slice(i, i + per));
    const paper = (chunk, n) => `<div class="mx-auto mb-4 max-w-4xl overflow-x-auto rounded-md bg-card shadow-pop last:mb-0"><div class="min-w-[46rem] p-7 text-2xs leading-snug text-foreground">
        <div class="flex items-center gap-3 border-b border-border pb-3"><img src="__CREST__" alt="" class="h-12 w-12 object-contain" /><div class="flex-1 text-center"><div class="text-xs font-bold tracking-[0.2em]">NIGERIAN NAVY</div><div class="text-sm font-semibold">${esc(title)}</div></div>
          <div class="text-right text-muted-foreground">Printed ${fmt(TODAY)}<br />Page ${n} of ${chunks.length}</div></div>
        ${n === 1 && meta.length ? `<dl class="mt-3 grid grid-cols-3 gap-x-4 gap-y-1.5">${meta.map(([k, v]) => `<div><dt class="text-muted-foreground">${esc(k)}</dt><dd class="font-semibold">${esc(v)}</dd></div>`).join('')}</dl>` : ''}
        <table class="mt-3 w-full border-collapse"><thead><tr>${cols.map((c) => `<th class="border border-border bg-subtle px-1.5 py-1 text-left font-semibold">${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${chunk.map((r) => `<tr class="${r.struck ? 'text-muted-foreground line-through' : ''}">${r.map((c) => `<td class="border border-border px-1.5 py-1">${esc(c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="border border-border px-1.5 py-3 text-center text-muted-foreground">No rows</td></tr>`}</tbody></table>
        ${n === chunks.length && note ? `<p class="mt-3 text-muted-foreground">${esc(note)}</p>` : ''}
        ${n === chunks.length && sign.length ? `<div class="mt-8 grid grid-cols-${sign.length} gap-6">${sign.map((s) => `<div class="border-t border-foreground/60 pt-1">${esc(s)}</div>`).join('')}</div>` : ''}
        <div class="mt-5 flex justify-between border-t border-border pt-2 text-muted-foreground"><span>${esc(file)}</span><span>CIRERMS · HICO001</span></div></div></div>`;
    openDialog({ title: `${title} (PDF)`, size: '2xl', body: `<div class="-mx-5 -my-4 bg-muted p-4 phone:p-2">${chunks.map((c, i) => paper(c, i + 1)).join('')}</div>`,
      foot: `<span class="mr-auto self-center text-xs text-muted-foreground phone:hidden">${esc(file)} · ${chunks.length} ${chunks.length === 1 ? 'page' : 'pages'}</span><button type="button" data-act="close" class="${btn.outline}">Close</button><button type="button" data-d1="print-pdf" class="${btn.outline}">${ic('printer')}Print</button><button type="button" data-d1="download-pdf" class="${btn.blue}">${ic('download')}Download PDF</button>` });
  }
  D1ACT['download-pdf'] = () => toast('Demo only: the server makes the PDF.');
  D1ACT['print-pdf'] = () => toast('Demo only: the server makes the PDF.');
  D1ACT.excel = () => toast('Demo only: no file was made.');

  // ---- add one rating to a batch: find by Official No, then add ----
  function findRating(sn) { const t = String(sn || '').trim().toUpperCase(); return ratings.find((r) => r.sn.toUpperCase() === t); }
  D1ACT.find = () => {
    const box = document.querySelector('#d1-found'); if (!box) return;
    const sn = dv('sn'); const ctx = S.addCtx;
    S.found = null;
    if (!sn) { box.innerHTML = notice('error', 'circle-alert', 'Enter an Official Number.'); return; }
    const r = findRating(sn);
    if (!r) { box.innerHTML = notice('error', 'circle-alert', `No rating has Official Number <b>${esc(sn)}</b>.`); return; }
    if (r.status !== 'current') { box.innerHTML = notice('error', 'circle-alert', `${esc(fullName(r))} has left the service and cannot be added.`); return; }
    const inBatch = ctx.batch.rows.some((x) => x.sn === r.sn && !x.rejected);
    const dupCourse = ctx.kind === 'DOT' ? DOT.find((b) => b.status === 'open' && b !== ctx.batch && b.course.id === ctx.batch.course.id && b.rows.some((x) => x.sn === r.sn)) : null;
    const other = ctx.kind === 'DOT' ? null : inOpenBatch(ctx.kind, r.sn);
    if (inBatch) { box.innerHTML = notice('warning', 'circle-alert', `${esc(fullName(r))} is already in this batch.`); return; }
    if (other) { box.innerHTML = notice('warning', 'circle-alert', `${esc(fullName(r))} is already in open batch <b>${esc(other.no)}</b>.`); return; }
    if (ctx.kind === 'DOT' && !courseEligible(ctx.batch.course, r)) { box.innerHTML = notice('error', 'circle-alert', `${esc(fullName(r))} is not eligible for ${esc(ctx.batch.course.name)}. ${esc(courseRuleText(ctx.batch.course))}.`); return; }
    if (dupCourse) { box.innerHTML = notice('warning', 'circle-alert', `${esc(fullName(r))} is already in open batch <b>${esc(dupCourse.no)}</b> for this course.`); return; }
    S.found = r;
    box.innerHTML = `<div class="flex items-center gap-3 rounded-card border border-border bg-subtle/60 p-3">${avatar(r, 'h-10 w-10 text-xs')}<div class="min-w-0 flex-1"><b class="block truncate text-sm">${esc(fullName(r))}</b><span class="block truncate text-xs text-muted-foreground">${r.sn} · ${esc(r.rate)} · ${esc(r.ship)}</span></div>${ctx.kind === 'DOA' ? ratePill(rateMo(r)) : shipPill(shipMo(r))}</div>`;
  };
  // ==== D1 END: shared parts ====

  // ==== D1 BEGIN: Drafting (9 pages) ====
  const DRAFT_TABS = [
    { route: 'drafting/manning', label: 'Update Manning Requirement' }, { route: 'drafting/proposal', label: 'Print Draft Proposal' }, { route: 'drafting/review', label: 'Review/Print Draft' },
    { route: 'drafting/approval', label: 'Draft Approval' }, { route: 'drafting/close', label: 'Close Draft' }, { route: 'drafting/wef', label: 'Update WEF' },
    { route: 'drafting/batches', label: 'Batch/Signal Content' }, { route: 'drafting/history', label: 'Rate DOD History' }, { route: 'drafting/report', label: 'Draft Report' },
  ];
  const RANKS = ['S/LT', 'LT', 'LTCDR', 'CDR', 'CAPT', 'CDRE', 'R/ADM', 'ADM'];
  const shipOptions = (r) => SHIP_NAMES.filter((s) => s !== r.ship);

  // ---- 1. Update Manning Requirement ----
  const mnDiff = (m) => { const d = aboardN(m.ship, m.rate, m.spec) - m.qty; return d === 0 ? `<span class="${pill.success}">Full</span>` : d < 0 ? `<span class="${pill.warning}">Short by ${-d}</span>` : `<span class="${pill.info}">Over by ${d}</span>`; };
  function viewManning() {
    const f = S.f.manning || {};
    const rows = MANNING.filter((m) => (!f.ship || m.ship === f.ship) && (!f.rate || m.rate === f.rate) && (!f.spec || m.spec === f.spec));
    const add = `<button type="button" data-d1="manning-add" class="${btn.outline}">${ic('plus')}Add Requirement</button>`;
    const aboard = rows.reduce((a, m) => a + aboardN(m.ship, m.rate, m.spec), 0);
    return pageHeader('Update Manning Requirement', 'What each ship or unit needs, and who is aboard now. It advises; it never blocks a draft', `<button type="button" data-d1="manning-print" class="${btn.blue}">${ic('printer')}Print</button><button type="button" data-d1="manning-add" class="${btn.primary}">${ic('plus')}Add Requirement</button>`)
      + d1Filters('manning', [{ name: 'ship', label: 'Ship', list: SHIP_NAMES, ph: 'All Ships' }, { name: 'rate', label: 'Rate', list: RATES, ph: 'All Rates' }, { name: 'spec', label: 'Specialisation', list: SPEC_NAMES, ph: 'All Specialisations', w: 'w-60' }])
      + stat3([['Requirements', rows.length], ['Required', rows.reduce((a, m) => a + m.qty, 0), 'text-primary-hover'], ['Aboard', aboard]])
      + d1Table('manning', rows, {
        cols: [['Ship', (m) => `<b class="font-medium">${esc(m.ship)}</b>`], ['Rate and Specialisation', (m) => esc(short(m.rate)) + subl(esc(m.spec))], ['Required', (m) => `<b>${m.qty}</b>`, 'text-center'], ['Aboard', (m) => aboardN(m.ship, m.rate, m.spec), 'text-center'], ['Difference', mnDiff]],
        title: (m) => `${m.ship} · ${short(m.rate)} ${m.spec}`, all: (m) => [['No', m.sn], ['Ship or Unit', esc(m.ship)], ['Rate', esc(m.rate)], ['Specialisation', esc(m.spec)], ['Required', `<b>${m.qty}</b>`], ['Aboard', aboardN(m.ship, m.rate, m.spec)], ['Difference', mnDiff(m)]],
        acts: (m) => sbtn('manning-del', m.sn, 'Delete', 'trash-2', 'outline', 'text-destructive') + sbtn('manning-edit', m.sn, 'Edit', 'pencil', 'primary'),
        card: (m) => ({ t: esc(m.ship), s: `${esc(m.rate)} · ${esc(m.spec)}`, r: mnDiff(m), body: `Required ${m.qty} · aboard ${aboardN(m.ship, m.rate, m.spec)}` }),
        empty: ['search', 'No Requirement Matches', 'Change the filters, or add a requirement for the ship.', add],
      });
  }
  function manningForm(m) {
    d1Form({ title: m ? 'Edit Requirement' : 'Add Requirement', size: 'md',
      body: fld('Ship or Unit', sel('ship', SHIP_NAMES, m ? m.ship : ''), 'ship') + fld('Rate', sel('rate', RATES, m ? m.rate : ''), 'rate') + fld('Specialisation', sel('spec', SPEC_NAMES, m ? m.spec : ''), 'spec')
        + fld('Quantity', inp('qty', m ? m.qty : '', 'Number of ratings', 'number'), 'qty', { hint: 'How many ratings of this rate and specialisation the ship needs.' }),
      onSubmit: () => {
        const v = { ship: dv('ship'), rate: dv('rate'), spec: dv('spec'), qty: dv('qty') }; const errors = {};
        if (!v.ship) errors.ship = 'Choose the ship or unit.';
        if (!v.rate) errors.rate = 'Choose the rate.';
        if (!v.spec) errors.spec = 'Choose the specialisation.';
        if (!/^\d+$/.test(v.qty) || +v.qty < 1 || +v.qty > 99) errors.qty = 'Enter a whole number from 1 to 99.';
        if (!errors.ship && !errors.rate && !errors.spec && MANNING.some((x) => x !== m && x.ship === v.ship && x.rate === v.rate && x.spec === v.spec)) errors.ship = `${v.ship} already has a requirement for ${short(v.rate)} ${v.spec}. Edit that one instead.`;
        if (Object.keys(errors).length) return { errors };
        if (m) Object.assign(m, { ship: v.ship, rate: v.rate, spec: v.spec, qty: +v.qty }); else MANNING.push({ sn: Math.max(...MANNING.map((x) => x.sn)) + 1, ship: v.ship, rate: v.rate, spec: v.spec, qty: +v.qty });
        return { done: m ? 'Requirement updated.' : 'Requirement added.' };
      } });
  }
  D1ACT['manning-add'] = () => manningForm(null);
  D1ACT['manning-edit'] = (el) => manningForm(MANNING.find((m) => m.sn === +el.dataset.id));
  D1ACT['manning-del'] = (el) => { const m = MANNING.find((x) => x.sn === +el.dataset.id); confirmBox({ title: 'Delete Requirement', text: `Delete the requirement for <b>${esc(short(m.rate))} ${esc(m.spec)}</b> on <b>${esc(m.ship)}</b>? Its ${m.qty} places are removed from the ship's manning.`, label: 'Delete Requirement', icon: 'trash-2', tone: 'danger', run: () => { MANNING.splice(MANNING.indexOf(m), 1); return { done: 'Requirement deleted.' }; } }); };
  D1ACT['manning-print'] = () => d1Form({ title: 'Print Manning Requirement', size: 'sm', body: fld('Ship or Unit', sel('ship', SHIP_NAMES, (S.f.manning || {}).ship || '', 'All ships and units'), 'ship', { opt: true }), submit: 'Preview PDF', icon: 'printer', onSubmit: () => {
    const ship = dv('ship'); const list = MANNING.filter((m) => !ship || m.ship === ship);
    return { then: () => d1Pdf({ title: 'Manning Requirement Report', file: 'Manning Requirement.pdf', meta: [['Ship or Unit', ship || 'All'], ['Requirements', String(list.length)], ['Required', String(list.reduce((a, m) => a + m.qty, 0))]], cols: ['Ship', 'Rate', 'Specialisation', 'Required', 'Aboard', 'Difference'], rows: list.map((m) => { const a = aboardN(m.ship, m.rate, m.spec); return [m.ship, m.rate, m.spec, String(m.qty), String(a), String(a - m.qty)]; }) }) };
  } });

  // ---- 2. Print Draft Proposal: who is due; the batch is made only when the button is pressed ----
  const dueDrafts = () => { const f = S.f.proposal || {}; return current().filter((r) => shipMo(r) >= 10 && (!f.branch || r.branch === f.branch) && (!f.spec || r.spec === f.spec) && (!f.rate || r.rate === f.rate)).sort((a, b) => shipMo(b) - shipMo(a)); };
  function viewProposal() {
    const rows = dueDrafts();
    return pageHeader('Print Draft Proposal', 'Ratings due for a draft; make a batch of them for review', `<button type="button" data-d1="create-batch" data-id="DOD" ${rows.length ? '' : 'disabled'} class="${btn.primary} disabled:opacity-50">${ic('plus')}Create Draft Batch</button>`, true)
      + d1Filters('proposal', [{ name: 'branch', label: 'Branch', list: BRANCHES, ph: 'All Branches' }, { name: 'spec', label: 'Specialisation', list: SPEC_NAMES, ph: 'All Specialisations', w: 'w-60' }, { name: 'rate', label: 'Rate', list: RATES, ph: 'All Rates' }])
      + `<div class="mb-3 text-sm text-muted-foreground"><b class="text-foreground">${rows.length}</b> ${rows.length === 1 ? 'rating is' : 'ratings are'} due${rows.filter((r) => inOpenBatch('DOD', r.sn)).length ? `, ${rows.filter((r) => inOpenBatch('DOD', r.sn)).length} already in an open batch` : ''}</div>`
      + d1Table('proposal', rows, {

        title: fullName, all: (r) => [['Official No', r.sn], ['Name', esc(fullName(r))], ['Sex', esc(r.gender)], ['Current Ship', esc(r.ship)], ['DOJ Ship', fmt(r.shipSince)], ['On Ship', shipPill(shipMo(r))], ['Last Ship 1', esc(lastShip(r, 1))], ['Last Ship 2', esc(lastShip(r, 2))], ['Authority', esc(prevAuth(r))], ['Batch', inOpenBatch('DOD', r.sn) ? esc(inOpenBatch('DOD', r.sn).no) : '-']],
        acts: (r) => (inOpenBatch('DOD', r.sn) ? lbtn('drafting/review', 'Go to Review', 'list', `data-d1="to-review" data-id="${inOpenBatch('DOD', r.sn).no}"`) : '') + lbtn(`ratings/record/${r.sn}`, 'Open Record', 'id-card'),
        card: (r) => ({ t: esc(fullName(r)), s: `${r.sn} · ${esc(r.ship)}`, r: shipPill(shipMo(r)), body: `Joined ${fmt(r.shipSince)}${inOpenBatch('DOD', r.sn) ? ` · in ${esc(inOpenBatch('DOD', r.sn).no)}` : ''}` }),
        empty: ['users', 'Nobody Is Due', 'No rating matches these filters. Widen the branch, specialisation or rate.', `<button type="button" data-d1="reset" data-key="proposal" class="${btn.outline}">${ic('rotate-ccw')}Reset Filters</button>`],
      });
  }
  D1ACT['to-review'] = (el) => { S.pick.dodReview = el.dataset.id; };

  // one dialog makes a draft or an advancement batch from the filtered list
  function createBatchDialog(flow) {
    const key = flow === 'DOD' ? 'proposal' : 'due'; const f = S.f[key] || {};
    const due = flow === 'DOD' ? dueDrafts() : dueAdvances();
    const fresh = due.filter((r) => !inOpenBatch(flow, r.sn));
    const code = `${flow}-${brCode(f.branch)}-${specCode(f.spec)}-${rateCode(f.rate)}`;

    if (!fresh.length) {
      openDialog({ title: `Create ${noun === 'draft' ? 'Draft' : 'Advancement'} Batch`, size: 'sm', body: notice('warning', 'circle-alert', `Everyone on this list is already in an open batch. Review that batch, or change the filters.`),
        foot: `<button type="button" data-act="close" class="${btn.outline}">Close</button><a href="#${reviewRoute}" class="${btn.primary}">${ic('list')}Go to Review</a>` });

    d1Form({ title: `${existing ? 'Add to' : 'Create'} ${noun === 'draft' ? 'Draft' : 'Advancement'} Batch`, size: 'md',

        + (existing ? notice('info', 'info', `An open batch for these filters already exists. The ${fresh.length} ${fresh.length === 1 ? 'rating' : 'ratings'} not yet in it ${fresh.length === 1 ? 'is' : 'are'} added to it.`) : '')
        + (due.length - fresh.length ? notice('warning', 'circle-alert', `${due.length - fresh.length} already in another open batch ${due.length - fresh.length === 1 ? 'is' : 'are'} left out.`) : ''),
      submit: existing ? 'Add to Batch' : 'Create Batch', icon: 'plus',

        const b = existing || makeBatch(flow, { branch: f.branch || 'All', spec: f.spec || 'All', rate: f.rate || 'All', init: TODAY, by: 'HICO001', rows: [] });

  D1ACT['create-batch'] = (el) => createBatchDialog(el.dataset.id);

  // ---- 3. Review/Print Draft ----
  function viewDraftReview() {
    const list = openBatches('DOD'); const b = pickedBatch('dodReview', list);
    const rows = b ? rowsOf(b) : [];
    const set = rows.filter((x) => x.to).length; const live = rows.filter((x) => !x.rejected).length;
    const acts = b ? `<button type="button" data-d1="dod-add" class="${btn.primary}">${ic('user-plus')}Add Personnel</button><button type="button" data-d1="dod-print" class="${btn.blue}">${ic('printer')}Print Draft</button>

  const boardBatch = () => pickedBatch('advBoard', boardList());
  function boardCheck(b, r, text) { const dt = parseDate(text); if (!dt) return { err: 'Enter the date as dd/mm/yyyy.' }; if (dt > TODAY) return { err: 'The board date cannot be in the future.' }; if (dt < r.rateSince) return { err: `The date cannot be before ${fullName(r)} joined the current rate (${fmt(r.rateSince)}).` }; return { dt }; }

  // ---- 7. Upload Advanced Rates, and Training Drafting's Excel Upload: one upload flow, two templates ----
  const pickSn = (n) => { const pool = ratings.filter((r) => r !== me); return pool[(n * 3) % pool.length].sn; };

  };
  const UPFILES = (cfg) => [
    { id: 'ok', name: `${cfg.sheet}-nov-2026.xlsx`, size: '46 KB', note: '28 rows, a few with problems', rows: 28, ready: 22, skipped: cfg.issues.filter((i) => i[4] === 'skipped').length, errors: cfg.issues.filter((i) => i[4] === 'error').length },

  function viewImport(key) {

    const ok = file && !file.error; const st = us.step;
    const issues = ok ? cfg.issues : [];
    const card3 = ok && st >= 1
      ? `<div class="grid grid-cols-3 gap-2 text-center"><div class="rounded-ctl bg-success-soft p-2 text-success"><b class="block text-lg">${st === 2 ? file.ready : file.ready}</b><span class="text-2xs">${st === 2 ? 'Imported' : 'Ready'}</span></div><div class="rounded-ctl bg-warning-soft p-2 text-warning"><b class="block text-lg">${file.skipped}</b><span class="text-2xs">Skipped</span></div><div class="rounded-ctl bg-error-soft p-2 text-error"><b class="block text-lg">${file.errors}</b><span class="text-2xs">Errors</span></div></div>

  // a read-only record dialog: facts in a grid (a third item makes a fact full width), an optional notice above and more below

    openDialog({ title, size, body: `${alert}<dl class="grid grid-cols-2 gap-x-4 gap-y-3 text-sm phone:grid-cols-1">${rows.map(([k, v, w]) => `<div class="min-w-0 ${w ? 'col-span-2 phone:col-span-1' : ''}"><dt class="text-2xs font-semibold uppercase tracking-wider text-muted-foreground">${esc(k)}</dt><dd class="mt-0.5 break-words">${v === '' || v == null ? '-' : v}</dd></div>`).join('')}</dl>${after}`,
      foot: `<button type="button" data-act="close" class="${btn.outline}">Close</button>${acts}` });
  }
  // a dialog with a form: the main button runs onSubmit() (D1's submit), the other button closes
  function d2Form({ title, size = 'md', body, submit = 'Save', icon = 'check', tone = 'primary', onSubmit, back = 'Cancel', foot = '' }) {
    S.form = onSubmit;
    openDialog({ title, size, body: `<div class="grid grid-cols-1 gap-4">${body}</div>`,
      foot: `${foot}<button type="button" data-act="close" class="${btn.outline}">${esc(back)}</button><button type="button" data-d1="submit" class="${btn[tone]}">${ic(icon)}${esc(submit)}</button>` });
  }
  const corrHtml = (c) => (c.corrections.length ? `<div class="mt-4 border-t border-border pt-3"><div class="mb-2 text-2xs font-semibold uppercase tracking-wider text-muted-foreground">Corrections</div><ol class="space-y-2">${c.corrections.map((k) => `<li class="rounded-card border border-border bg-subtle/60 p-3 text-sm"><div class="flex flex-wrap items-center gap-2"><b>${fmt(k.on)}</b><span class="text-xs text-muted-foreground">by ${esc(k.by)}</span></div><p class="mt-1">${esc(k.reason)}</p><ul class="mt-1.5 space-y-0.5 text-xs text-muted-foreground">${k.changes.map(([f, a, b]) => `<li>${esc(f)}: <s>${esc(a || '-')}</s> to <b class="text-foreground">${esc(b || '-')}</b></li>`).join('')}</ul></li>`).join('')}</ol></div>` : '');
  const personName = (sn) => { const r = bySn(sn); return r ? `${short(r.rate)} ${upperName(r)}` : sn; };
  // ==== D2 END: shared parts ====

  // ==== D2 BEGIN: Disciplinary Action (4 pages) ====
  const DISC_TABS = [
    { route: 'disciplinary/initiate', label: 'Initiate Incident' }, { route: 'disciplinary/pending', label: 'Pending Cases' },
    { route: 'disciplinary/concluded', label: 'Concluded Cases' }, { route: 'disciplinary/report', label: 'Disciplinary Report' },
  ];
  const caseRows = (c) => {
    const r = bySn(c.sn);
    const rows = [['Case Number', `<b>${esc(c.no)}</b>`], ['Status', casePill(c)], ['Official No', c.sn], ['Name', esc(fullName(r))], ['Rate at the Time', esc(c.rate)], ['Ship at the Time', esc(c.ship)],
      ['Offence', esc(c.offence)], ['Incident Date', fmt(c.incident)], ['Reported By', esc(c.reportedBy)], ['Opened', `${fmt(c.opened)} by ${esc(c.openedBy)}`], ['What Happened', esc(c.what), true]];
    if (c.status === 'concluded') rows.push(['Decision Date', fmt(c.decisionDate)], ['Sanction', esc(c.sanction)], ['Authority', esc(c.authority)], ['Concluded', `${fmt(c.concludedOn)} by ${esc(c.concludedBy)}`], ['Decision', esc(c.decision), true]);
    return rows;
  };
  // the record dialog of a case. mode: 'pending' (Conclude, Cancel), 'concluded' (Correct) or 'view' (read only)
  function caseDialog(c, mode) {
    const r = bySn(c.sn);
    const acts = lbtn(`ratings/record/${c.sn}`, 'Open Record', 'id-card') + d2b('case-print', c.no, 'Print Case', 'printer')
      + (mode === 'pending' ? d2b('case-cancel', c.no, 'Cancel Case', 'x', 'outline', 'text-destructive') + d2b('case-conclude', c.no, 'Conclude', 'gavel', 'primary') : '')
      + (mode === 'concluded' ? d2b('case-correct', c.no, 'Correct', 'pencil', 'primary') : '')
      + (mode === 'view' ? lbtn(`disciplinary/${c.status === 'pending' ? 'pending' : 'concluded'}`, c.status === 'pending' ? 'Pending Cases' : 'Concluded Cases', 'list') : '');
    d2Dialog({ title: `${c.no} · ${r.sn}`, size: 'lg', rows: caseRows(c), acts, after: corrHtml(c),
      alert: c.status === 'concluded' ? `<div class="mb-4">${notice('info', 'info', 'A concluded case is final. A mistake is changed with <b>Correct</b>, which needs a reason and is recorded in the audit trail.')}</div>` : '' });
  }
  const caseOf = (no) => CASES.find((c) => c.no === no);
  D2ACT['case-conclude'] = (el) => concludeDialog(caseOf(el.dataset.id));
  D2ACT['case-cancel'] = (el) => cancelDialog(caseOf(el.dataset.id));
  D2ACT['case-correct'] = (el) => correctDialog(caseOf(el.dataset.id));
  D2ACT['case-print'] = (el) => casePdf(caseOf(el.dataset.id));

  // ---- 1. Initiate Incident: find a current rating, then the case form ----
  function viewInitiate() {
    const f = S.f.dcFind || {}; const q = (f.q || '').trim().toLowerCase();
    const all = q ? ratings.filter((r) => qMatch(r, q)) : [];
    const rows = all.filter((r) => r.status === 'current');
    const left = all.length - rows.length;
    let body;
    if (!q) body = `<div class="${CARD}">${emptyBox('gavel', 'Find a Rating', 'Enter an Official Number or a name above. A case can only be opened for a current rating.')}</div>`;
    else if (!rows.length) body = `<div class="${CARD}">${emptyBox('circle-alert', 'No Current Rating Found', left ? `${left} matching ${left === 1 ? 'rating has' : 'ratings have'} left the service. A case can only be opened for a current rating.` : 'Check the Official Number or the spelling, then search again.')}</div>`;
    else body = `<div class="mb-3 text-sm text-muted-foreground"><b class="text-foreground">${rows.length}</b> current ${rows.length === 1 ? 'rating' : 'ratings'} found. Choose one to open a case.</div>` + d1Table('dcFind', rows, {
      cols: [['Official No', (r) => r.sn], ['Name', (r) => nameSub(r)], ['Current Ship', (r) => esc(r.ship)], ['Cases', (r) => (pendingOf(r.sn).length ? caseFlag(r.sn) : `<span class="text-muted-foreground">-</span>`)]],
      open: (r) => d2Dialog({ title: fullName(r), size: 'md', alert: pendingOf(r.sn).length ? `<div class="mb-4">${notice('warning', 'triangle-alert', `${esc(fullName(r))} already has ${pendingOf(r.sn).length === 1 ? 'a pending case' : `${pendingOf(r.sn).length} pending cases`} (${pendingOf(r.sn).map((c) => esc(c.no)).join(', ')}). A new incident opens a separate case.`)}</div>` : '',
        rows: [['Official No', r.sn], ['Rate', esc(r.rate)], ['Branch', esc(r.branch)], ['Current Ship', esc(r.ship)], ['Command', esc(r.command)], ['Date Enlisted', fmt(r.enlisted)], ['Cases on File', `${casesOfSn(r.sn).length}`]],
        acts: lbtn(`ratings/record/${r.sn}`, 'Open Record', 'id-card') + d2b('case-new', r.sn, 'Open Case', 'gavel', 'primary') }),
      card: (r) => ({ t: esc(fullName(r)), s: `${r.sn} · ${esc(r.ship)}`, r: caseFlag(r.sn), body: esc(r.rate) }),
    });
    return pageHeader('Initiate Incident', 'Open a disciplinary case against a current rating')
      + d1Filters('dcFind', [{ name: 'q', label: 'Official No or Name', type: 'text', ph: 'e.g. B0539 or Okafor', w: 'w-80' }]) + body;
  }
  D2ACT['case-new'] = (el) => caseForm(bySn(el.dataset.id));
  function caseForm(r) {
    d2Form({ title: 'Initiate Incident', size: 'lg', submit: 'Open Case', icon: 'gavel',
      body: ratingStrip(r, caseFlag(r.sn)) + grid2(
        fld('Incident Date', inp('date', '', 'dd/mm/yyyy'), 'date') + fld('Offence', sel('offence', OFFENCES, '', '-- Select Offence --'), 'offence')
        + wide(fld('What Happened', ta('what', '', 'Describe the incident: where, when and what was done', 250), 'what', { hint: 'Up to 250 characters.' }))
        + wide(fld('Reported By', inp('by', '', 'e.g. Lt Cdr A. Eze (Divisional Officer)'), 'by')))
        + notice('info', 'info', 'The case opens as <b>Pending</b>. Concluding it, with the sanction, is a separate step on Pending Cases.'),
      onSubmit: () => {
        const err = {}; const date = parseDate(dv('date')); const offence = dv('offence'); const what = dv('what'); const by = dv('by');
        if (!dv('date')) err.date = 'Enter the incident date.'; else if (!date) err.date = 'Use dd/mm/yyyy.'; else if (date > TODAY) err.date = 'The incident cannot be in the future.'; else if (date < r.enlisted) err.date = `${fullName(r)} joined on ${fmt(r.enlisted)}. The incident cannot be earlier.`;
        if (!offence) err.offence = 'Choose the offence.';
        if (!what) err.what = 'Describe what happened.';
        if (!by) err.by = 'Say who reported it.';
        const dup = !err.date && !err.offence && pendingOf(r.sn).find((c) => c.offence === offence && +c.incident === +date);
        if (dup) err.offence = `This incident is already open as ${dup.no}.`;
        if (Object.keys(err).length) return { errors: err };
        const c = makeCase(r, { opened: TODAY, incident: date, offence, what, reportedBy: by, openedBy: 'HICO001' });
        return { done: `Case ${c.no} opened for ${fullName(r)}.`, go: 'disciplinary/pending' };
      } });
  }

  // ---- 2. Pending Cases ----
  function pendingRows() {
    const f = S.f.dcPending || {}; const q = (f.q || '').trim().toLowerCase();
    return pendingCases().filter((c) => qMatch(bySn(c.sn), q) && (!f.offence || c.offence === f.offence)).sort((a, b) => b.opened - a.opened || b.no.localeCompare(a.no));
  }
  const caseCols = (last) => [['Official No', (c) => c.sn], ['Name', (c) => nameSub(bySn(c.sn), esc(c.no))], ['Offence', (c) => esc(c.offence), 'whitespace-normal'], last];
  function viewPending() {
    const rows = pendingRows();
    return pageHeader('Pending Cases', 'Incidents waiting for a decision', `<button type="button" data-d2="pending-pdf" ${rows.length ? '' : 'disabled'} class="${btn.blue} disabled:opacity-50">${ic('printer')}Print List</button>`)
      + d1Filters('dcPending', [{ name: 'q', label: 'Official No or Name', type: 'text', ph: 'e.g. B0539 or Okafor', w: 'w-64' }, { name: 'offence', label: 'Offence', list: OFFENCES, ph: 'All Offences', w: 'w-72' }])
      + `<div class="mb-3 text-sm text-muted-foreground"><b class="text-foreground">${rows.length}</b> ${rows.length === 1 ? 'case is' : 'cases are'} waiting for a decision</div>`
      + d1Table('dcPending', rows, {
        cols: caseCols(['Incident', (c) => fmt(c.incident)]),
        open: (c) => caseDialog(c, 'pending'),
        card: (c) => ({ t: esc(fullName(bySn(c.sn))), s: `${c.sn} · ${esc(c.no)}`, r: casePill(c), body: `${esc(c.offence)} · incident ${fmt(c.incident)}` }),
        empty: ['gavel', 'No Pending Cases', 'Every case has a decision, or none matches these filters.', `<button type="button" data-d1="reset" data-key="dcPending" class="${btn.outline}">${ic('rotate-ccw')}Reset Filters</button>`],
      });
  }
  D2ACT['pending-pdf'] = () => { const rows = pendingRows();
    d1Pdf({ title: 'Pending Disciplinary Cases', file: 'Pending Disciplinary Cases.pdf', meta: [['Cases', String(rows.length)], ['As At', fmt(TODAY)], ['Offence', (S.f.dcPending || {}).offence || 'All']],
      cols: ['Case', 'Official No', 'Name', 'Ship', 'Offence', 'Incident', 'What Happened', 'Reported By'], rows: rows.map((c) => [c.no, c.sn, personName(c.sn), c.ship, c.offence, fmt(c.incident), c.what, c.reportedBy]), sign: ['Prepared By', 'Director of Personnel (Navy)'] }); };
  // Conclude (the approve action): the decision date, sanction, decision and authority
  function concludeDialog(c) {
    const r = bySn(c.sn);
    d2Form({ title: 'Conclude Case', size: 'lg', submit: 'Conclude Case', icon: 'gavel',
      body: ratingStrip(r, casePill(c)) + `<div class="rounded-card border border-border bg-subtle/60 p-3 text-sm"><b>${esc(c.offence)}</b> · incident ${fmt(c.incident)}<span class="mt-1 block text-muted-foreground">${esc(c.what)}</span></div>`
        + grid2(fld('Decision Date', inp('date', '', 'dd/mm/yyyy'), 'date') + fld('Sanction', sel('sanction', SANCTIONS, '', '-- Select Sanction --'), 'sanction')
          + wide(fld('Decision', ta('decision', '', 'The finding and what was awarded', 250), 'decision', { hint: 'Up to 250 characters.' })) + wide(fld('Authority', inp('authority', '', 'e.g. Commanding Officer'), 'authority')))
        + notice('warning', 'triangle-alert', 'Concluding is final. A later change is made with <b>Correct</b> on Concluded Cases, which needs a reason and is recorded in the audit trail.'),
      onSubmit: () => {
        const err = {}; const date = parseDate(dv('date'));
        if (!dv('date')) err.date = 'Enter the decision date.'; else if (!date) err.date = 'Use dd/mm/yyyy.'; else if (date < c.incident) err.date = `The decision cannot be before the incident (${fmt(c.incident)}).`; else if (date > TODAY) err.date = 'The decision cannot be in the future.';
        if (!dv('sanction')) err.sanction = 'Choose the sanction.';
        if (!dv('decision')) err.decision = 'Record the decision.';
        if (!dv('authority')) err.authority = 'Name the authority.';
        if (Object.keys(err).length) return { errors: err };
        Object.assign(c, { status: 'concluded', decisionDate: date, sanction: dv('sanction'), decision: dv('decision'), authority: dv('authority'), concludedBy: 'HICO001', concludedOn: TODAY });
        return { done: `Case ${c.no} concluded: ${c.sanction}.`, go: route.startsWith('disciplinary/') ? 'disciplinary/concluded' : undefined };
      } });
  }
  // Cancel (the delete action): a case opened by mistake leaves the lists; nothing is deleted
  function cancelDialog(c) {
    const r = bySn(c.sn);
    d2Form({ title: 'Cancel Case', size: 'md', back: 'Keep Case', submit: 'Cancel Case', icon: 'x', tone: 'danger',
      body: ratingStrip(r, casePill(c)) + `<div class="text-sm"><b>${esc(c.no)}</b> · ${esc(c.offence)}, incident ${fmt(c.incident)}</div>`
        + fld('Reason', ta('reason', '', 'Why the case is being cancelled', 200), 'reason', { hint: 'Required. It is kept in the audit trail.' })
        + notice('info', 'info', 'Use this for a case opened by mistake. It leaves the lists; nothing is deleted and the audit trail keeps it with this reason.'),
      onSubmit: () => { const v = dv('reason'); if (!v) return { errors: { reason: 'Give the reason the case is cancelled.' } }; c.status = 'cancelled'; c.cancel = { reason: v, by: 'HICO001', on: TODAY }; return { done: `Case ${c.no} cancelled.` }; } });
  }

  // ---- 3. Concluded Cases ----
  function concludedRows(f, { from, to } = {}) {
    const q = (f.q || '').trim().toLowerCase();
    return concludedCases().filter((c) => { const r = bySn(c.sn); return qMatch(r, q) && (!f.offence || c.offence === f.offence) && (!f.sanction || c.sanction === f.sanction) && (!f.ship || c.ship === f.ship) && (!f.rate || c.rate === f.rate) && (!from || c.decisionDate >= from) && (!to || c.decisionDate <= to); })
      .sort((a, b) => b.decisionDate - a.decisionDate || b.no.localeCompare(a.no));
  }
  const decidedCols = () => [['Official No', (c) => c.sn], ['Name', (c) => nameSub(bySn(c.sn), esc(c.no))], ['Offence', (c) => esc(c.offence) + subl(esc(c.sanction)), 'whitespace-normal'], ['Decided', (c) => fmt(c.decisionDate)]];
  const decidedCard = (c) => ({ t: esc(fullName(bySn(c.sn))), s: `${c.sn} · ${esc(c.no)}`, r: `<span class="${pill.success}">${fmt(c.decisionDate)}</span>`, body: `${esc(c.offence)} · ${esc(c.sanction)}` });
  function viewConcluded() {
    const f = S.f.dcConcluded || {}; const rg = rangeOf(f);
    const rows = rg.bad ? [] : concludedRows(f, rg);
    return pageHeader('Concluded Cases', 'Cases with a decision; a mistake is changed with Correct')
      + d1Filters('dcConcluded', [{ name: 'q', label: 'Official No or Name', type: 'text', ph: 'e.g. B0539 or Okafor', w: 'w-56' }, { name: 'offence', label: 'Offence', list: OFFENCES, ph: 'All Offences', w: 'w-64' }, { name: 'sanction', label: 'Sanction', list: SANCTIONS, ph: 'All Sanctions', w: 'w-52' }, { name: 'from', label: 'Decided From', type: 'date', w: 'w-40' }, { name: 'to', label: 'Decided To', type: 'date', w: 'w-40' }])
      + (rg.bad ? `<div class="mb-4">${notice('error', 'circle-alert', esc(rg.bad))}</div>` : `<div class="mb-3 text-sm text-muted-foreground"><b class="text-foreground">${rows.length}</b> concluded ${rows.length === 1 ? 'case' : 'cases'}</div>`)
      + d1Table('dcConcluded', rows, {
        cols: decidedCols(), open: (c) => caseDialog(c, 'concluded'), card: decidedCard,
        empty: ['gavel', rg.bad ? 'Check the Dates' : 'No Concluded Cases', rg.bad ? 'Fix the dates above to see the cases.' : 'No case matches these filters.', rg.bad ? '' : `<button type="button" data-d1="reset" data-key="dcConcluded" class="${btn.outline}">${ic('rotate-ccw')}Reset Filters</button>`],
      });
  }
  // Correct (the edit action): everything but the rating can be changed; a reason is required and the changes are kept
  function correctDialog(c) {
    const r = bySn(c.sn);
    const rows = [['Offence', 'offence'], ['Incident Date', 'incident'], ['What Happened', 'what'], ['Reported By', 'reportedBy'], ['Decision Date', 'decisionDate'], ['Sanction', 'sanction'], ['Decision', 'decision'], ['Authority', 'authority']];
    d2Form({ title: `Correct ${c.no}`, size: 'xl', submit: 'Save Correction', icon: 'check',
      body: ratingStrip(r, casePill(c)) + grid2(
        fld('Offence', sel('offence', OFFENCES, c.offence), 'offence') + fld('Incident Date', inp('incident', fmt(c.incident), 'dd/mm/yyyy'), 'incident')
        + wide(fld('What Happened', ta('what', c.what, '', 250), 'what')) + wide(fld('Reported By', inp('reportedBy', c.reportedBy), 'reportedBy'))
        + fld('Decision Date', inp('decisionDate', fmt(c.decisionDate), 'dd/mm/yyyy'), 'decisionDate') + fld('Sanction', sel('sanction', SANCTIONS, c.sanction), 'sanction')
        + wide(fld('Decision', ta('decision', c.decision, '', 250), 'decision')) + wide(fld('Authority', inp('authority', c.authority), 'authority'))
        + wide(fld('Reason for the Correction', ta('reason', '', 'What was wrong and what the record should say', 200), 'reason', { hint: 'Required. It is kept with the case and in the audit trail.' }))),
      onSubmit: () => {
        const err = {}; const inc = parseDate(dv('incident')); const dec = parseDate(dv('decisionDate'));
        if (!inc) err.incident = 'Use dd/mm/yyyy.'; else if (inc > TODAY) err.incident = 'The incident cannot be in the future.'; else if (inc < r.enlisted) err.incident = `${fullName(r)} joined on ${fmt(r.enlisted)}.`;
        if (!dec) err.decisionDate = 'Use dd/mm/yyyy.'; else if (inc && dec < inc) err.decisionDate = 'The decision cannot be before the incident.'; else if (dec > TODAY) err.decisionDate = 'The decision cannot be in the future.';
        ['what', 'reportedBy', 'decision', 'authority'].forEach((k) => { if (!dv(k)) err[k] = 'This cannot be empty.'; });
        if (!dv('reason')) err.reason = 'Give the reason for the correction.';
        if (Object.keys(err).length) return { errors: err };
        const next = { offence: dv('offence'), incident: inc, what: dv('what'), reportedBy: dv('reportedBy'), decisionDate: dec, sanction: dv('sanction'), decision: dv('decision'), authority: dv('authority') };
        const show = (k, v) => (v instanceof Date ? fmt(v) : v);
        const changes = rows.filter(([, k]) => show(k, c[k]) !== show(k, next[k])).map(([label, k]) => [label, show(k, c[k]), show(k, next[k])]);
        if (!changes.length) return { errors: { reason: 'Nothing was changed. Edit a field first, then give the reason.' } };
        Object.assign(c, next); c.corrections.push({ on: TODAY, by: 'HICO001', reason: dv('reason'), changes });
        return { done: `Case ${c.no} corrected: ${changes.map((x) => x[0]).join(', ')}.` };
      } });
  }

  // ---- 4. Disciplinary Report: concluded cases for a period, with a printout and a workbook ----
  function viewDiscReport() {
    const f = S.f.dcReport || {}; const rg = rangeOf(f);
    const rows = rg.bad ? [] : concludedRows(f, rg);
    const by = (k) => { const m = {}; rows.forEach((c) => { m[c[k]] = (m[c[k]] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1])[0]; };
    const top = by('offence'); const topS = by('sanction');
    return pageHeader('Disciplinary Report', 'Concluded cases by period, offence, sanction, ship and rate', `<button type="button" data-d2="report-print" ${rows.length ? '' : 'disabled'} class="${btn.blue} disabled:opacity-50">${ic('printer')}Print PDF</button><button type="button" data-d1="excel" ${rows.length ? '' : 'disabled'} class="${btn.outline} disabled:opacity-50">${ic('file-spreadsheet')}Export Excel</button>`)
      + d1Filters('dcReport', [{ name: 'from', label: 'Decided From', type: 'date', w: 'w-40' }, { name: 'to', label: 'Decided To', type: 'date', w: 'w-40' }, { name: 'offence', label: 'Offence', list: OFFENCES, ph: 'All Offences', w: 'w-64' }, { name: 'sanction', label: 'Sanction', list: SANCTIONS, ph: 'All Sanctions', w: 'w-52' }, { name: 'ship', label: 'Ship', list: SHIP_NAMES, ph: 'All Ships', w: 'w-52' }, { name: 'rate', label: 'Rate', list: RATES, ph: 'All Rates', w: 'w-56' }])
      + (rg.bad ? `<div class="mb-4">${notice('error', 'circle-alert', esc(rg.bad))}</div>`
        : stat3([['Cases', rows.length], ['Most Common Offence', top ? `<span class="text-base">${esc(top[0])}</span>` : '-'], ['Most Common Sanction', topS ? `<span class="text-base">${esc(topS[0])}</span>` : '-']]))
      + d1Table('dcReport', rows, {
        cols: decidedCols(), open: (c) => caseDialog(c, 'view'), card: decidedCard,
        empty: ['file-text', rg.bad ? 'Check the Dates' : 'No Cases in This Report', rg.bad ? 'Fix the dates above to see the report.' : 'No concluded case matches these filters. Widen the dates or the offence.', rg.bad ? '' : `<button type="button" data-d1="reset" data-key="dcReport" class="${btn.outline}">${ic('rotate-ccw')}Reset Filters</button>`],
      });
  }
  D2ACT['report-print'] = () => { const f = S.f.dcReport || {}; const rows = concludedRows(f, rangeOf(f));
    d1Pdf({ title: 'Disciplinary Report', file: 'Disciplinary Report.pdf', meta: [['Period', `${f.from || 'Start'} to ${f.to || fmt(TODAY)}`], ['Offence', f.offence || 'All'], ['Sanction', f.sanction || 'All'], ['Ship', f.ship || 'All'], ['Rate', f.rate ? short(f.rate) : 'All'], ['Cases', String(rows.length)]],
      cols: ['Case', 'Official No', 'Name', 'Ship', 'Offence', 'Incident', 'Decided', 'Sanction', 'Decision', 'Authority'], rows: rows.map((c) => [c.no, c.sn, personName(c.sn), c.ship, c.offence, fmt(c.incident), fmt(c.decisionDate), c.sanction, c.decision, c.authority]), sign: ['Prepared By', 'Director of Personnel (Navy)'] }); };
  function casePdf(c) {
    const r = bySn(c.sn);

  // ---- Appraisal periods and appraisals ----
  const GRADES = T2('appraisal-ratings').rows.map((r) => ({ name: r[0], code: r[1], range: r[2] }));

    if (e.key === 'ArrowDown') { e.preventDefault(); paletteIndex = (paletteIndex + 1) % Math.max(count, 1); renderPalette(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); paletteIndex = (paletteIndex - 1 + count) % Math.max(count, 1); renderPalette(); }
    else if (e.key === 'Enter') { e.preventDefault(); const a = $(`#palette-results [data-idx="${paletteIndex}"]`); if (a) { location.hash = a.getAttribute('href'); closePalette(); } }
  });

  // ==========================================================================
  // Events
  // ==========================================================================
  document.addEventListener('keydown', (e) => {
    if (locked) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
    else if (e.key === 'Escape') { if (!$('#palette').classList.contains('hidden')) closePalette(); else if (!$('#overlay').classList.contains('hidden')) closeDialog(); else closePhone(); }
    else if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-pick]')) pickRating(e.target.dataset.pick);
  });
  document.addEventListener('click', (e) => {
    const menuBtn = e.target.closest('[data-act="export"],[data-act="account"]');
    document.querySelectorAll('#export-menu,#account-menu').forEach((m) => { if (!menuBtn || !menuBtn.parentElement.contains(m)) m.classList.add('hidden'); });
    const pickEl = e.target.closest('[data-pick]');
    if (pickEl) { pickRating(pickEl.dataset.pick); return; }
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const A = {
      'toggle-rail': () => { state.collapsed = !state.collapsed; renderRail(route); },
      palette: openPalette, 'close-palette': closePalette,
      close: () => closeDialog(),
      account: () => $('#account-menu').classList.toggle('hidden'),
      'account-sheet': () => openDialog({ title: 'HICO Administrator', body: `<div class="mb-3 text-sm text-muted-foreground">HICO001 · Administrator</div><div class="flex flex-col gap-2"><a href="#ratings/my-details" data-act="close" class="${btn.outline} justify-start">${ic('user-round')}View My Details</a><a href="#admin/password" data-act="close" class="${btn.outline} justify-start">${ic('key-round')}Change Password</a><button type="button" data-act="lock" class="${btn.outline} justify-start">${ic('lock-keyhole')}Lock Screen</button><button type="button" data-act="theme" class="${btn.outline} justify-start">${themeItem()}</button><button type="button" data-act="sign-out" class="${btn.outline} justify-start text-destructive">${ic('log-out')}Sign Out</button></div>`, size: 'sm' }),
      'sign-out': () => { closeDialog(); signOut(); },
      theme: () => { closeDialog(); const m = $('#account-menu'); if (m) m.classList.add('hidden'); toggleTheme(); },
      more: openMore,
      export: () => $('#export-menu').classList.toggle('hidden'),
      'export-sheet': () => openDialog({ title: 'Export', size: 'sm', body: `<div class="flex flex-col gap-2">${[['copy', 'Copy Rows'], ['file-spreadsheet', 'Excel'], ['file-text', 'PDF'], ['file-text', 'CSV']].map(([i, l]) => `<button type="button" data-act="exported" class="${btn.outline} justify-start">${ic(i)}${l}</button>`).join('')}</div>` }),
      exported: () => { const m = $('#export-menu'); if (m) m.classList.add('hidden'); closeDialog(); toast('Demo only: no file was made.'); },
      page: () => { const k = el.dataset.list; if (state.list[k]) state.list[k].page = Number(el.dataset.to); else state.pages[k] = Number(el.dataset.to); render(); $('#page').scrollTop = 0; },
      filters: () => openDialog({ title: 'Filter', body: `<div class="space-y-4">${field('Rate', `<select name="rate-filter">${options(RATES, state.rate, 'All Rates')}</select>`)}${field('Ship', `<select name="ship-filter">${options(SHIPS, state.ship, 'All Ships')}</select>`)}</div>`,
        foot: `<button type="button" data-act="clear-filters" class="${btn.outline}">Clear</button><button type="button" data-act="close" class="${btn.primary}">Show Ratings</button>`, size: 'sm' }),
      'clear-filters': () => { state.rate = ''; state.ship = ''; closeDialog(); render(); },
      'record-tab': () => { state.recordTab = el.dataset.tab; state.docPicked = null; render(); },
      edit: () => editForm(el.dataset.what), saved: () => demoSave(),
      print: () => toast('Demo only: the PDF is made by the server.'),
      delete: () => openDialog({ title: 'Delete Rating', body: '<p class="text-sm">This removes the record and all its tabs.</p>', foot: `<button type="button" data-act="close" class="${btn.outline}">Cancel</button><button type="button" data-act="saved" class="${btn.danger}">${ic('trash-2')}Delete Rating</button>`, size: 'sm' }),
      'docs-for': () => { state.docSn = el.dataset.sn; closeDialog(); },
      'doc-cat': () => { state.docCat = el.dataset.cat; state.docPicked = null; render(); },
      'doc-pick': () => pickDoc(el.dataset.doc),
      'upload-doc': () => openDialog({ title: 'Upload Document', body: `<div class="space-y-4">${field('Category', `<select name="doc-category">${options(CATEGORIES.map(([, n]) => n), state.docCat === 'ALL' ? 'Drafting' : (CATEGORIES.find(([c]) => c === state.docCat) || [, ''])[1])}</select>`)}
          <button type="button" class="flex w-full flex-col items-center gap-2 rounded-card border-2 border-dashed border-input bg-subtle transition-colors px-4 py-6 text-sm text-muted-foreground">${ic('file-up', 'icon h-7 w-7')}Choose a PDF, image or Word file</button></div>`,
        foot: `<button type="button" data-act="close" class="${btn.outline}">Cancel</button><button type="button" data-act="saved" class="${btn.primary}">${ic('upload')}Upload</button>`, size: 'sm' }),
      download: () => toast('Demo only: no file to download.'),
      'delete-doc': () => toast('Demo only: nothing was deleted.'),
      step: () => setNewStep(Number(el.dataset.step)),
      'new-rating': () => openNewRating(),
      'save-new': () => { closeDialog(); toast('Demo only: nothing was saved.'); location.hash = '#ratings/record/B0539'; },
      template: () => { state.upload = Math.max(state.upload, 1); render(); toast('Demo only: no workbook was made.'); },
      'choose-workbook': () => { state.upload = 2; render(); },
      commit: () => { state.upload = 3; render(); toast('Demo only: nothing was added.'); },
      demo: () => toast('Demo only.'),
      'table-add': () => tableForm(route.slice(7), null),
      'table-edit': () => tableForm(route.slice(7), Number(el.dataset.i)),
      'run-report': () => { render(); toast('Report updated.'); },
      'user-pick': () => { state.userPicked = el.dataset.user; if (sideBySide()) render(); else { const u = USERS.find((x) => x.username === el.dataset.user); openDialog({ title: 'User', size: 'md', body: userCard(u) }); } },
      'user-add': () => userForm(null),
      'user-edit': () => userForm(USERS.find((x) => x.username === el.dataset.user)),
      'reset-pw': () => openDialog({ title: 'Reset Password', size: 'sm', body: '<p class="text-sm">The user gets a one-time password and must change it at their next sign in.</p>', foot: `<button type="button" data-act="close" class="${btn.outline}">Cancel</button><button type="button" data-act="saved" class="${btn.blue}">${ic('key-round')}Reset Password</button>` }),
      'role-pick': () => { state.role = el.dataset.role; render(); },
      'role-add': () => openDialog({ title: 'Add Role', size: 'sm', body: field('Role Name', `<input type="text" class="${INPUT}" />`) + `<div class="mt-4">${field('Copy Access From', `<select name="role-copy">${options(ROLES, '', '-- None --')}</select>`, true)}</div>`, foot: `<button type="button" data-act="close" class="${btn.outline}">Cancel</button><button type="button" data-act="saved" class="${btn.primary}">${ic('check')}Add Role</button>` }),
      perm: () => { perms[state.role][el.dataset.key] = !perms[state.role][el.dataset.key]; render(); },
      'pw-save': () => { if (!$('#pw-current').value) { toast('Enter your current password.', 'error'); return; } if (!pwCheck()) { toast('The new password needs every check.', 'error'); return; } toast('Demo only: the password is unchanged.'); },
      eye: () => { const i = document.getElementById(el.dataset.for); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.innerHTML = ic(show ? 'eye-off' : 'eye'); el.setAttribute('aria-label', show ? 'Hide Password' : 'Show Password'); },
      'audit-search': () => { const v = (n) => { const x = document.querySelector(`[name="${n}"]`); return x ? x.value : ''; }; state.audit = { action: v('audit-action'), table: v('audit-table'), by: v('audit-by'), key: v('audit-key') }; state.pages.audit = 1; render(); },
      'audit-reset': () => { state.audit = { action: '', table: '', by: '', key: '' }; state.pages.audit = 1; render(); },
      'audit-view': () => { const e = AUDIT[Number(el.dataset.i)]; openDialog({ title: `${e.action} · ${e.key}`, size: 'lg', body: `<div class="mb-4">${dl([['Time', stamp(e.time)], ['Table', e.table], ['Performed By', e.by], ['IP Address', e.ip]])}</div>
          <div class="overflow-hidden rounded-card border border-border/70"><table class="w-full text-sm"><thead class="text-left"><tr><th class="${TH}">Field</th><th class="${TH}">Before</th><th class="${TH}">After</th></tr></thead>
          <tbody>${auditChanges(e).map(([f, b, a]) => `<tr class="border-t border-border/70"><td class="px-4 py-2.5 font-medium">${esc(f)}</td><td class="px-4 py-2.5">${b === '-' ? '<span class="text-muted-foreground">-</span>' : `<span class="rounded bg-error-soft px-1.5 py-0.5 text-error line-through decoration-error/50">${esc(b)}</span>`}</td><td class="px-4 py-2.5">${a === '-' ? '<span class="text-muted-foreground">-</span>' : `<span class="rounded bg-success-soft px-1.5 py-0.5 text-success">${esc(a)}</span>`}</td></tr>`).join('')}</tbody></table></div>` }); },
      lock: () => { closeDialog(); const m = $('#account-menu'); if (m) m.classList.add('hidden'); lockScreen('manual'); },
      'lock-eye': () => { const i = $('#lock-pass'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.innerHTML = ic(show ? 'eye-off' : 'eye'); el.setAttribute('aria-label', show ? 'Hide Password' : 'Show Password'); i.focus(); },
      'lock-signout': () => { unlockScreen({ announce: false }); signOut(); },
      'phone-preview': openPhone, 'close-phone': closePhone,
    };
    if (A[act]) A[act]();
  });
  document.addEventListener('input', (e) => {
    if (e.target.dataset && e.target.dataset.q) {
      const key = e.target.dataset.q; state.qs[key] = e.target.value; state.pages[key] = 1;
      const pos = e.target.selectionStart; const id = e.target.id;
      render();
      const i = document.getElementById(id); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
      return;
    }
    if (e.target.id === 'pw-new' || e.target.id === 'pw-confirm') { pwCheck(); return; }
    if (e.target.id === 'list-q') {
      state.q = e.target.value;
      Object.values(state.list).forEach((l) => { l.page = 1; l.picked = null; });
      const pos = e.target.selectionStart;
      render();
      const i = $('#list-q'); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
    }
  });
  document.addEventListener('change', (e) => {
    const name = e.target.getAttribute && e.target.getAttribute('name');
    if (name === 'rate-filter' || name === 'ship-filter') {
      state[name === 'rate-filter' ? 'rate' : 'ship'] = e.target.value;
      Object.values(state.list).forEach((l) => { l.page = 1; l.picked = null; });
      if ($('#overlay').classList.contains('hidden')) render(); else setTimeout(render, 0);
    } else if (name && name.startsWith('rep-')) {
      state.report[name.slice(4)] = e.target.value;
    } else if (name === 'doc-rating') {
      state.docSn = e.target.value; state.docCat = 'ALL'; state.docPicked = null; render();
    }
  });

  // ---- phone preview (demo only) ----
  function openPhone() {
    const frame = $('#phone-frame');
    $('#phone-iframe').src = `${location.href.split('#')[0].split('?')[0]}?frame=phone${location.hash || '#dashboard'}`;
    frame.classList.remove('hidden'); frame.classList.add('flex');
  }
  function closePhone() { const f = $('#phone-frame'); f.classList.add('hidden'); f.classList.remove('flex'); $('#phone-iframe').src = 'about:blank'; }
  if (new URLSearchParams(location.search).get('frame')) $('#demo-bar').remove();
  themeListeners.push(() => renderRail(route));

  lastRoute = location.hash.replace(/^#\/?/, '') || 'dashboard';
  const openNewAtStart = lastRoute === 'ratings/new';
  if (openNewAtStart) { lastRoute = 'ratings/current'; history.replaceState(null, '', '#ratings/current'); }
  render();
  if (framed) { $('#login').classList.add('hidden'); } else showLogin();
  if (openNewAtStart) openNewRating();
  if (store.get()) lockScreen(store.get(), { announce: false });
})();
</script>
</body>
</html>
