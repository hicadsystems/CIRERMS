  // ==== D1 END: shared parts ====

  // ==== D1 BEGIN: Drafting (9 pages) ====
  const DRAFT_TABS = [
    { route: 'drafting/manning', label: 'Update Manning Requirement' }, { route: 'drafting/proposal', label: 'Print Draft Proposal' }, { route: 'drafting/review', label: 'Review/Print Draft' },
    { route: 'drafting/approval', label: 'Draft Approval' }, { route: 'drafting/close', label: 'Close Draft' }, { route: 'drafting/wef', label: 'Update WEF' },
    { route: 'drafting/batches', label: 'Batch/Signal Content' }, { route: 'drafting/history', label: 'Rate DOD History' }, { route: 'drafting/report', label: 'Draft Report' },
  ];
  const RANKS = ['S/LT', 'LT', 'LTCDR', 'CDR', 'CAPT', 'CDRE', 'R/ADM', 'ADM'];
  const RATE_COLS = ['OS', 'AB', 'LS', 'PO', 'CPO', 'WO', 'MWO', 'NWO'];
  const shipOptions = (r) => SHIP_NAMES.filter((s) => s !== r.ship);

  // ---- 1. Update Manning Requirement ----
  function viewManning() {
    const f = S.f.manning || {};
    const rows = MANNING.filter((m) => (!f.ship || m.ship === f.ship) && (!f.rate || m.rate === f.rate) && (!f.spec || m.spec === f.spec));
    const add = `<button type="button" data-d1="manning-add" class="${btn.outline}">${ic('plus')}Add Requirement</button>`;
    return pageHeader('Update Manning Requirement', 'The ratings each ship or unit needs, by rate and specialisation', `<button type="button" data-d1="manning-print" class="${btn.blue}">${ic('printer')}Print</button><button type="button" data-d1="manning-add" class="${btn.primary}">${ic('plus')}Add Requirement</button>`)
      + d1Filters('manning', [{ name: 'ship', label: 'Ship', list: SHIP_NAMES, ph: 'All Ships' }, { name: 'rate', label: 'Rate', list: RATES, ph: 'All Rates' }, { name: 'spec', label: 'Specialisation', list: SPEC_NAMES, ph: 'All Specialisations', w: 'w-60' }])
      + stat3([['Requirements', rows.length], ['Ratings Required', rows.reduce((a, m) => a + m.qty, 0), 'text-primary-hover'], ['Ships and Units', new Set(rows.map((m) => m.ship)).size]])
      + d1Table('manning', rows, {
        cols: [['#', (m) => m.sn], ['Ship', (m) => `<b class="font-medium">${esc(m.ship)}</b>`], ['Rate', (m) => esc(m.rate)], ['Specialisation', (m) => esc(m.spec)], ['Quantity', (m) => `<b>${m.qty}</b>`, 'text-right'],
          ['', (m) => tbtn('manning-edit', m.sn, 'Edit', 'pencil') + tbtn('manning-del', m.sn, 'Delete', 'trash-2', 'text-destructive'), 'text-right']],
        card: (m) => ({ t: esc(m.ship), s: `${esc(m.rate)} · ${esc(m.spec)}`, r: `<span class="${pill.info}">${m.qty} needed</span>`, acts: sbtn('manning-edit', m.sn, 'Edit', 'pencil') + sbtn('manning-del', m.sn, 'Delete', 'trash-2', 'outline', 'text-destructive') }),
        empty: ['search', 'No Requirement Matches', 'Change the filters, or add a requirement for the ship.', add],
      });
  }
  function manningForm(m) {
    d1Form({ title: m ? 'Edit Requirement' : 'Add Requirement', size: 'md',
      body: fld('Ship or Unit', sel('ship', SHIP_NAMES, m ? m.ship : ''), 'ship') + fld('Rate', sel('rate', RATES, m ? m.rate : ''), 'rate') + fld('Specialisation', sel('spec', SPEC_NAMES, m ? m.spec : ''), 'spec')
        + fld('Quantity', inp('qty', m ? m.qty : '', 'Number of ratings', 'number'), 'qty', { hint: 'How many ratings of this rate and specialisation the ship needs.' }),
      onSubmit: () => {
        const v = { ship: dv('ship'), rate: dv('rate'), spec: dv('spec'), qty: dv('qty') }; const errors = {};
        if (!v.ship) errors.ship = 'Choose the ship or unit.';
        if (!v.rate) errors.rate = 'Choose the rate.';
        if (!v.spec) errors.spec = 'Choose the specialisation.';
        if (!/^\d+$/.test(v.qty) || +v.qty < 1 || +v.qty > 99) errors.qty = 'Enter a whole number from 1 to 99.';
        if (!errors.ship && !errors.rate && !errors.spec && MANNING.some((x) => x !== m && x.ship === v.ship && x.rate === v.rate && x.spec === v.spec)) errors.ship = `${v.ship} already has a requirement for ${short(v.rate)} ${v.spec}. Edit that one instead.`;
        if (Object.keys(errors).length) return { errors };
        if (m) Object.assign(m, { ship: v.ship, rate: v.rate, spec: v.spec, qty: +v.qty }); else MANNING.push({ sn: Math.max(...MANNING.map((x) => x.sn)) + 1, ship: v.ship, rate: v.rate, spec: v.spec, qty: +v.qty });
        return { done: m ? 'Requirement updated.' : 'Requirement added.' };
      } });
  }
  D1ACT['manning-add'] = () => manningForm(null);
  D1ACT['manning-edit'] = (el) => manningForm(MANNING.find((m) => m.sn === +el.dataset.id));
  D1ACT['manning-del'] = (el) => { const m = MANNING.find((x) => x.sn === +el.dataset.id); confirmBox({ title: 'Delete Requirement', text: `Delete the requirement for <b>${esc(short(m.rate))} ${esc(m.spec)}</b> on <b>${esc(m.ship)}</b>? Its ${m.qty} places are removed from the ship's manning.`, label: 'Delete Requirement', icon: 'trash-2', tone: 'danger', run: () => { MANNING.splice(MANNING.indexOf(m), 1); return { done: 'Requirement deleted.' }; } }); };
  D1ACT['manning-print'] = () => d1Form({ title: 'Print Manning Requirement', size: 'sm', body: fld('Ship or Unit', sel('ship', SHIP_NAMES, (S.f.manning || {}).ship || '', 'All ships and units'), 'ship', { opt: true }), submit: 'Preview PDF', icon: 'printer', onSubmit: () => {
    const ship = dv('ship'); const list = MANNING.filter((m) => !ship || m.ship === ship);
    return { then: () => d1Pdf({ title: 'Manning Requirement Report', file: 'Manning Requirement.pdf', meta: [['Ship or Unit', ship || 'All'], ['Requirements', String(list.length)], ['Ratings Required', String(list.reduce((a, m) => a + m.qty, 0))]], cols: ['Ship', 'Rate', 'Specialisation', 'Quantity'], rows: list.map((m) => [m.ship, m.rate, m.spec, String(m.qty)]) }) };
  } });

  // ---- 2. Print Draft Proposal: who is due; the batch is made only when the button is pressed ----
  const dueDrafts = () => { const f = S.f.proposal || {}; return current().filter((r) => shipMo(r) >= 10 && (!f.branch || r.branch === f.branch) && (!f.spec || r.spec === f.spec) && (!f.rate || r.rate === f.rate)).sort((a, b) => shipMo(b) - shipMo(a)); };
  function viewProposal() {
    const rows = dueDrafts();
    return pageHeader('Print Draft Proposal', 'Ratings due for a draft; make a batch of them for review', `<button type="button" data-d1="create-batch" data-id="DOD" ${rows.length ? '' : 'disabled'} class="${btn.primary} disabled:opacity-50">${ic('plus')}Create Draft Batch</button>`, true)
      + d1Filters('proposal', [{ name: 'branch', label: 'Branch', list: BRANCHES, ph: 'All Branches' }, { name: 'spec', label: 'Specialisation', list: SPEC_NAMES, ph: 'All Specialisations', w: 'w-60' }, { name: 'rate', label: 'Rate', list: RATES, ph: 'All Rates' }])
      + `<div class="mb-3 text-sm text-muted-foreground"><b class="text-foreground">${rows.length}</b> ${rows.length === 1 ? 'rating is' : 'ratings are'} due${rows.filter((r) => inOpenBatch('DOD', r.sn)).length ? `, ${rows.filter((r) => inOpenBatch('DOD', r.sn)).length} already in an open batch` : ''}</div>`
      + d1Table('proposal', rows, {
        cols: [['Official No', (r) => r.sn], ['Name', (r) => nameLink(r) + subl(esc(r.gender))], ['Current Ship', (r) => `<b class="font-medium">${esc(r.ship)}</b>`], ['DOJ Ship', (r) => fmt(r.shipSince)], ['On Ship', (r) => shipPill(shipMo(r))], ['Batch', (r) => { const b = inOpenBatch('DOD', r.sn); return b ? `<a href="#drafting/review" data-d1="to-review" data-id="${b.no}" class="${pill.neutral}">${esc(b.no)}</a>` : '-'; }], ['Last Ship 1', (r) => esc(lastShip(r, 1))], ['Last Ship 2', (r) => esc(lastShip(r, 2))], ['Authority', (r) => esc(prevAuth(r)), 'text-muted-foreground']],
        card: (r) => ({ t: esc(fullName(r)), s: `${r.sn} · ${esc(r.ship)}`, r: shipPill(shipMo(r)), body: `Joined ${fmt(r.shipSince)} · last ships ${esc(lastShip(r, 1))}, ${esc(lastShip(r, 2))}${inOpenBatch('DOD', r.sn) ? ` · in ${esc(inOpenBatch('DOD', r.sn).no)}` : ''}` }),
        empty: ['users', 'Nobody Is Due', 'No rating matches these filters. Widen the branch, specialisation or rate.', `<button type="button" data-d1="reset" data-key="proposal" class="${btn.outline}">${ic('rotate-ccw')}Reset Filters</button>`],
      });
  }
  D1ACT['to-review'] = (el) => { S.pick.dodReview = el.dataset.id; };

  // one dialog makes a draft or an advancement batch from the filtered list
  function createBatchDialog(flow) {
    const key = flow === 'DOD' ? 'proposal' : 'due'; const f = S.f[key] || {};
    const due = flow === 'DOD' ? dueDrafts() : dueAdvances();
    const fresh = due.filter((r) => !inOpenBatch(flow, r.sn));
    const code = `${flow}-${brCode(f.branch)}-${specCode(f.spec)}-${rateCode(f.rate)}`;
    const existing = openBatches(flow).find((b) => b.code === code);
    const no = existing ? existing.no : `${code}-${pad6(seqFor(flow, code))}`;
    const noun = flow === 'DOD' ? 'draft' : 'advancement';
    const reviewRoute = flow === 'DOD' ? 'drafting/review' : 'advancement/review';
    if (!fresh.length) {
      openDialog({ title: `Create ${noun === 'draft' ? 'Draft' : 'Advancement'} Batch`, size: 'sm', body: notice('warning', 'circle-alert', `Everyone on this list is already in an open batch. Review that batch, or change the filters.`),
        foot: `<button type="button" data-act="close" class="${btn.outline}">Close</button><a href="#${reviewRoute}" class="${btn.primary}">${ic('list')}Go to Review</a>` });
      return;
    }
    const labels = [['Batch Number', `<b>${esc(no)}</b>`], ['Branch', esc(f.branch || 'All branches')], ['Specialisation', esc(f.spec || 'All specialisations')], [flow === 'DOD' ? 'Rate' : 'Current Rate', esc(f.rate || 'All rates')], ['Ratings to Add', `<b>${fresh.length}</b>`], ['Initiated By', 'HICO001']];
    d1Form({ title: `${existing ? 'Add to' : 'Create'} ${noun === 'draft' ? 'Draft' : 'Advancement'} Batch`, size: 'md',
      body: `<dl class="grid grid-cols-2 gap-x-4 gap-y-3 text-sm">${labels.map(([k, v]) => `<div><dt class="text-2xs font-semibold uppercase tracking-wider text-muted-foreground">${k}</dt><dd class="mt-0.5">${v}</dd></div>`).join('')}</dl>`
        + (existing ? notice('info', 'info', `An open batch for these filters already exists. The ${fresh.length} ${fresh.length === 1 ? 'rating' : 'ratings'} not yet in it ${fresh.length === 1 ? 'is' : 'are'} added to it.`) : '')
        + (due.length - fresh.length ? notice('warning', 'circle-alert', `${due.length - fresh.length} already in another open batch ${due.length - fresh.length === 1 ? 'is' : 'are'} left out.`) : ''),
      submit: existing ? 'Add to Batch' : 'Create Batch', icon: 'plus',
      onSubmit: () => {
        const mk = (r) => (flow === 'DOD' ? { sn: r.sn, from: r.ship, to: '', vice: '', remark: '', request: '', wef: null } : { sn: r.sn, from: r.rate, to: '', reason: '', remark: '', date: null });
        const b = existing || makeBatch(flow, { branch: f.branch || 'All', spec: f.spec || 'All', rate: f.rate || 'All', init: TODAY, by: 'HICO001', rows: [] });
        fresh.forEach((r) => b.rows.push(mk(r)));
        S.pick[flow === 'DOD' ? 'dodReview' : 'advReview'] = b.no;
        return { done: `${existing ? 'Added to' : 'Created'} batch ${b.no}: ${fresh.length} ${fresh.length === 1 ? 'rating' : 'ratings'}.`, go: reviewRoute };
      } });
  }
  D1ACT['create-batch'] = (el) => createBatchDialog(el.dataset.id);

  // ---- 3. Review/Print Draft ----
  function viewDraftReview() {
    const list = openBatches('DOD'); const b = pickedBatch('dodReview', list);
    const rows = b ? rowsOf(b) : [];
    const set = rows.filter((x) => x.to).length;
    const acts = b ? `<button type="button" data-d1="dod-add" class="${btn.primary}">${ic('user-plus')}Add Personnel</button><button type="button" data-d1="dod-print" class="${btn.blue}">${ic('printer')}Print Draft</button>
      <button type="button" data-d1="excel" class="${btn.outline}">${ic('file-spreadsheet')}Export Excel</button><button type="button" data-d1="dod-clear" class="${btn.outline} text-destructive">${ic('trash-2')}Clear Draft</button>` : '';
    let body;
    if (!list.length) body = `<div class="${CARD}">${emptyBox('briefcase', 'No Open Draft Batches', 'Make a batch from the ratings who are due, then review it here.', `<a href="#drafting/proposal" class="${btn.primary}">${ic('plus')}Print Draft Proposal</a>`)}</div>`;
    else if (!b) body = `<div class="${CARD}">${emptyBox('list', 'Choose a Batch', 'Pick an open batch to review its ratings.')}</div>`;
    else body = factStrip([['Batch', `<b>${esc(b.no)}</b>`], ['Branch', esc(b.branch === 'All' ? 'All branches' : b.branch)], ['Initiated', `${fmt(b.init)} by ${esc(b.by)}`], ['Status', batchPill(b)]])
      + `<div class="${CARD} mb-4 flex items-center gap-3 px-4 py-3"><div class="cirerms-progress-track flex-1"><div class="cirerms-progress-bar ${fraction(rows.length ? set / rows.length : 0)}" data-level="${rows.length && set === rows.length ? 'high' : set ? 'mid' : 'low'}"></div></div><span class="text-xs text-muted-foreground"><b class="text-foreground">${set}</b> of ${rows.length} have a proposed ship</span></div>`
      + d1Table('dodReview', rows, {
        cols: [['Official No', (x) => x.sn], ['Name', (x) => nameLink(x.r) + subl(esc(x.r.gender))], ['Current Ship', (x) => esc(x.r.ship) + subl(`since ${fmt(x.r.shipSince)}`)], ['On Ship', (x) => shipPill(shipMo(x.r))],
          ['Proposed Ship', (x) => (x.to ? `<b class="font-medium">${esc(x.to)}</b>` : `<span class="${pill.warning}">Not set</span>`)], ['Vice/Deployment', (x) => esc(x.vice || '-')], ['Remark', (x) => esc(x.remark || '-')],
          ['', (x) => tbtn('dod-edit', x.sn, 'Edit', 'pencil') + tbtn('dod-remove', x.sn, 'Remove', 'trash-2', 'text-destructive'), 'text-right']],
        card: (x) => ({ t: esc(fullName(x.r)), s: `${x.sn} · ${esc(x.r.ship)}`, r: shipPill(shipMo(x.r)), body: x.to ? `Drafted to <b class="text-foreground">${esc(x.to)}</b>${x.vice ? ` · ${esc(x.vice)}` : ''}` : `<span class="${pill.warning}">No proposed ship</span>`, acts: sbtn('dod-edit', x.sn, 'Edit', 'pencil') + sbtn('dod-remove', x.sn, 'Remove', 'trash-2', 'outline', 'text-destructive') }),
        empty: ['users', 'This Batch Is Empty', 'Add personnel by Official Number, or make a new proposal.', `<button type="button" data-d1="dod-add" class="${btn.primary}">${ic('user-plus')}Add Personnel</button>`],
      });
    return pageHeader('Review/Print Draft', 'Choose where each rating is drafted to', acts) + (list.length ? batchPicker('dodReview', list, b, { labelOf: batchLabel }) : '') + body;
  }
  const batchPill = (b) => `<span class="${b.status === 'open' ? pill.warning : pill.success}">${b.status === 'open' ? 'Open' : 'Closed'}</span>`;
  const reviewBatch = () => pickedBatch('dodReview', openBatches('DOD'));
  D1ACT['dod-edit'] = (el) => {
    const b = reviewBatch(); const x = b.rows.find((y) => y.sn === el.dataset.id); const r = bySn(x.sn);
    d1Form({ title: 'Draft Posting', size: 'md',
      body: `<div class="flex items-center gap-3">${avatar(r, 'h-10 w-10 text-xs')}<div class="min-w-0"><b class="block truncate text-sm">${esc(fullName(r))}</b><span class="block truncate text-xs text-muted-foreground">${r.sn} · on ${esc(r.ship)} since ${fmt(r.shipSince)}</span></div></div>`
        + fld('Proposed Ship', sel('ship', SHIP_NAMES, x.to, '-- Select Ship --'), 'ship') + fld('Vice/Deployment', inp('vice', x.vice, 'e.g. Vice AB Okoro'), 'vice', { opt: true }) + fld('Remark', inp('remark', x.remark, ''), 'remark', { opt: true }),
      onSubmit: () => {
        const ship = dv('ship'); if (!ship) return { errors: { ship: 'Choose the ship the rating is drafted to.' } };
        if (ship === r.ship) return { errors: { ship: `${fullName(r)} is already on ${ship}. Choose another ship.` } };
        x.to = ship; x.vice = dv('vice'); x.remark = dv('remark'); return { done: 'Posting saved.' };
      } });
  };
  D1ACT['dod-remove'] = (el) => { const b = reviewBatch(); const r = bySn(el.dataset.id); confirmBox({ title: 'Remove from Batch', text: `Remove <b>${esc(fullName(r))}</b> from <b>${esc(b.no)}</b>? They stay on their ship and can be proposed again later.`, label: 'Remove Rating', icon: 'trash-2', tone: 'danger', run: () => { b.rows = b.rows.filter((x) => x.sn !== r.sn); return { done: 'Removed from the batch.' }; } }); };
  D1ACT['dod-clear'] = () => { const b = reviewBatch(); confirmBox({ title: 'Clear Draft', text: `Remove all <b>${b.rows.length}</b> ratings from <b>${esc(b.no)}</b>? The batch stays open and empty, and every proposed ship is lost.`, label: 'Clear Draft', icon: 'trash-2', tone: 'danger', run: () => { b.rows = []; return { done: 'Draft cleared.' }; } }); };
  function addPersonnel(kind, b, withRequest) {
    S.addCtx = { kind, batch: b }; S.found = null;
    d1Form({ title: 'Add Personnel', size: 'md',
      body: `<div><span class="${LABEL}">Official Number</span><div class="flex gap-2"><input name="sn" type="text" placeholder="e.g. B0539" autocomplete="off" class="${INPUT}" /><button type="button" data-d1="find" class="${btn.blue} flex-none">${ic('search')}Find</button></div><span data-err="sn" class="mt-1 hidden text-xs font-medium text-error"></span></div>
        <div id="d1-found"></div>${kind === 'DOD' ? fld('Request', sel('request', ['Medical', 'Special Requests', 'Others'], '', '-- Select Request --'), 'request', { opt: true }) : kind === 'DOA' ? fld('Reason', sel('reason', ['Outstanding', 'Special Requests', 'Others'], '', '-- Select Reason --'), 'reason', { opt: true }) : ''}`,
      submit: 'Add to Batch', icon: 'user-plus',
      onSubmit: () => {
        if (!S.found) return { errors: { sn: 'Find the rating first.' } };
        const r = S.found; const row = kind === 'DOD' ? { sn: r.sn, from: r.ship, to: '', vice: '', remark: '', request: dv('request'), wef: null } : kind === 'DOA' ? { sn: r.sn, from: r.rate, to: '', reason: dv('reason'), remark: '', date: null } : { sn: r.sn, attended: true, start: null, end: null, place: '', result: '' };
        b.rows.push(row); return { done: `${fullName(r)} added to ${b.no}.` };
      } });
  }
  D1ACT['dod-add'] = () => addPersonnel('DOD', reviewBatch(), true);
  D1ACT['dod-print'] = () => { const b = reviewBatch(); d1Pdf({ title: 'Draft Form', file: `Draft ${b.no}.pdf`, meta: [['Batch Number', b.no], ['Branch', b.branch === 'All' ? 'All' : b.branch], ['Specialisation', b.spec === 'All' ? 'All' : b.spec], ['Initiated By', b.by], ['Date', fmt(b.init)], ['Ratings', String(b.rows.length)]],
    cols: ['Official No', 'Name', 'Rate', 'Sex', 'Current Ship', 'Months', 'Proposed Ship', 'Vice/Deployment', 'Remark'], rows: rowsOf(b).map((x) => [x.sn, upperName(x.r), short(x.r.rate), x.r.gender, x.r.ship, String(shipMo(x.r)), x.to || '-', x.vice || '-', x.remark || '-']), sign: ['Drafting Officer', 'Director of Personnel (Navy)'] }); };

  // ---- 4 and 5, shared with Advancement: department approval and close ----
  const flowOf = () => (route.startsWith('advancement') ? 'DOA' : 'DOD');
  function deptRows(flow) {
    const map = {};
    openBatches(flow).forEach((b) => rowsOf(b).forEach((x) => { (map[x.r.spec] = map[x.r.spec] || []).push({ ...x, batch: b }); }));
    return Object.keys(map).sort().map((spec) => {
      const rows = map[spec]; const counts = {}; rows.forEach((x) => { const rt = flow === 'DOD' ? x.r.rate : x.to; if (rt) { const c = short(rt); counts[c] = (counts[c] || 0) + 1; } });
      return { spec, rows, counts, appr: apprOf(flow, spec) };
    });
  }
  function viewApproval(flow) {
    const rows = deptRows(flow); const adv = flow === 'DOA';
    const pending = rows.filter((d) => !d.appr).length;
    return pageHeader(adv ? 'Approval' : 'Draft Approval', adv ? 'Approve each department\'s advancement list before its batch is closed' : 'Approve each department\'s draft before its batch is closed', `<button type="button" data-d1="excel" class="${btn.outline}">${ic('file-spreadsheet')}Export Excel All Departments</button>`)
      + (rows.length ? stat3([['Departments', rows.length], ['Approved', rows.length - pending, 'text-primary-hover'], ['Waiting', pending, pending ? 'text-warning' : '']]) : '')
      + d1Table(`${flow}appr`, rows, {
        cols: [['Department', (d) => `<b class="font-medium">${esc(d.spec)}</b>`], ['Total', (d) => `<b>${d.rows.length}</b>`, 'text-center'], ...RATE_COLS.map((c) => [c, (d) => d.counts[c] || '<span class="text-muted-foreground/60">-</span>', 'text-center']),
          ['Status', (d) => (d.appr ? `<span class="${pill.success}">Approved</span>` : `<span class="${pill.warning}">Waiting</span>`)], ['Approved By', (d) => (d.appr ? `${esc(d.appr.rank)} ${esc(d.appr.name)}${subl(`${esc(d.appr.appt)} · ${fmt(d.appr.date)}`)}` : '-')]],
        row: (d) => `data-d1="dept-open" data-id="${esc(d.spec)}" tabindex="0"`,
        card: (d) => ({ t: esc(d.spec), s: `${d.rows.length} ${d.rows.length === 1 ? 'rating' : 'ratings'}`, r: d.appr ? `<span class="${pill.success}">Approved</span>` : `<span class="${pill.warning}">Waiting</span>`, body: d.appr ? `${esc(d.appr.rank)} ${esc(d.appr.name)} · ${fmt(d.appr.date)}` : 'Tap to review and approve' }),
        empty: ['shield-check', adv ? 'No Advancement Waiting' : 'No Draft Waiting', 'There are no open batches. Make one from the due list first.', `<a href="#${adv ? 'advancement/due' : 'drafting/proposal'}" class="${btn.primary}">${ic('plus')}${adv ? 'Rates due for Advancement' : 'Print Draft Proposal'}</a>`],
      });
  }
  D1ACT['dept-open'] = (el) => {
    const flow = flowOf(); const d = deptRows(flow).find((x) => x.spec === el.dataset.id); if (!d) return; const adv = flow === 'DOA';
    const rows = d.rows.map((x) => (adv ? [x.sn, fullName(x.r), `${rateMo(x.r)} mo`, x.to || 'Not set', x.batch.no] : [x.sn, fullName(x.r), x.r.ship, x.to || 'Not set', x.batch.no]));
    const missing = d.rows.filter((x) => !x.to).length;
    openDialog({ title: `${adv ? 'Advancement' : 'Draft'} for ${d.spec}`, size: 'xl',
      body: (d.appr ? notice('success', 'circle-check', `Approved by <b>${esc(d.appr.rank)} ${esc(d.appr.name)}</b>, ${esc(d.appr.appt)}, on ${fmt(d.appr.date)}.`) + '<div class="h-3"></div>' : '')

  D1ACT['appr-form'] = (el) => {

  function viewClose(flow) {

  // ---- 7. Update WEF ----
  function viewWef() {
    const list = signalBatches('DOD').filter((b) => b.rows.length && (reportedN(b) < b.rows.length || b.closed >= addDays(TODAY, -30)));

  const wefBatch = () => { const list = signalBatches('DOD').filter((b) => b.rows.length && (reportedN(b) < b.rows.length || b.closed >= addDays(TODAY, -30))); return pickedBatch('wef', list); };
  function wefCheck(b, text) { const dt = parseDate(text); if (!dt) return { err: 'Enter the date as dd/mm/yyyy.' }; if (dt < b.closed) return { err: `The WEF cannot be before the authority date (${fmt(b.closed)}).` }; return { dt }; }
  D1ACT['wef-row'] = (el) => {

    cols: ['Official No', 'Name', 'Current Rate', 'In Rate (months)', 'New Rate', 'Reason'], rows: rowsOf(b).map((x) => [x.sn, upperName(x.r), short(x.r.rate), String(rateMo(x.r)), x.to ? short(x.to) : '-', x.reason || '-']), sign: ['Personnel Officer', 'Chief of Naval Personnel'] }); };

  // ---- 5. Board Returns Update: the date the board approved each advancement ----
  const boardList = () => signalBatches('DOA').filter((b) => b.rows.length && (reportedN(b) < b.rows.length || b.closed >= addDays(TODAY, -30)));

  D1ACT['board-row'] = (el) => {

      } });

  // ---- 7. Upload Advanced Rates, and Training Drafting's Excel Upload: one upload flow, two templates ----
  const pickSn = (n) => { const pool = ratings.filter((r) => r !== me); return pool[(n * 3) % pool.length].sn; };
  const UP = {
    training: { title: 'Excel Upload', sub: 'Load completed training records for ratings from a workbook', noun: 'training records', template: 'Training Upload Template.xlsx', sheet: 'training-records',
      cols: ['Official No', 'Course', 'Institution', 'Qualification', 'Start Date', 'End Date', 'Authority'], effect: "adds a line to each rating's Training tab",
      issues: [[7, 'B0611', 'Official No', 'B0611 is not on the roll', 'error'], [9, pickSn(2), 'Course', '"Gunnery Basic" is not in Static Tables, Training', 'error'], [12, 'B0539', 'Duplicate', 'Petty Officer Course 05/10/2020 to 12/02/2021 is already on the record', 'skipped'], [15, pickSn(4), 'End Date', '31/02/2026 is not a date', 'error'], [19, pickSn(5), 'Duplicate', 'Basic Seamanship starting 08/02/2010 is already on the record', 'skipped'], [24, pickSn(7), 'Duplicate', 'Leading Rate Course 01/09/2015 to 04/12/2015 is already on the record', 'skipped']] },
    advancement: { title: 'Upload Advanced Rates', sub: 'Load past advancements for ratings from a workbook', noun: 'advancements', template: 'Advancement Upload Template.xlsx', sheet: 'advancements',
      cols: ['Official No', 'Old Rate', 'New Rate', 'Effective Date', 'Authority', 'Decoration', 'Remark'], effect: "adds a line to each rating's Advancement tab and sets its rate",
      issues: [[5, pickSn(3), 'Old Rate', 'Old Rate AB does not match the rating\'s rate on record (LS)', 'error'], [8, 'B0611', 'Official No', 'B0611 is not on the roll', 'error'], [11, pickSn(6), 'New Rate', 'New Rate must be above the old rate', 'error'], [14, 'B0539', 'Duplicate', 'B0539 was already advanced to PO on 01/07/2021', 'skipped'], [17, pickSn(8), 'Effective Date', 'The effective date is empty', 'error'], [26, pickSn(9), 'Duplicate', 'Already advanced to AB on 01/07/2012', 'skipped']] },
  };
  const UPFILES = (cfg) => [
    { id: 'ok', name: `${cfg.sheet}-nov-2026.xlsx`, size: '46 KB', note: '28 rows, a few with problems', rows: 28, ready: 22, skipped: cfg.issues.filter((i) => i[4] === 'skipped').length, errors: cfg.issues.filter((i) => i[4] === 'error').length },
    { id: 'empty', name: `${cfg.sheet}-empty.xlsx`, size: '9 KB', note: 'Headers only, no rows', error: 'The workbook has no rows under the headings. Add the rows and choose the file again.' },
    { id: 'header', name: `${cfg.sheet}-old-format.xlsx`, size: '38 KB', note: 'Headings from an older sheet', error: `Column "${cfg.cols[0]}" was not found in row 1. Download the template and copy the rows into it.` },
    { id: 'type', name: `${cfg.sheet}.csv`, size: '12 KB', note: 'A CSV file', error: 'Only .xlsx workbooks are accepted. Save the file as an Excel workbook and try again.' },
  ];
  function viewUpload(key) {
    const cfg = UP[key]; const us = S.up[key] || { step: 0 }; const files = UPFILES(cfg); const file = files.find((f) => f.id === us.file);
    const stepHead = (n, title, on, done) => `<div class="flex items-center gap-3"><span class="flex h-8 w-8 flex-none items-center justify-center rounded-full text-sm font-semibold ${done ? 'bg-primary text-primary-foreground' : on ? 'bg-brand text-brand-foreground' : 'bg-muted text-muted-foreground'}">${done ? ic('check') : n}</span><h2 class="text-sm font-semibold">${title}</h2></div>`;
    const ok = file && !file.error; const st = us.step;
    const issues = ok ? cfg.issues : [];
    const card3 = ok && st >= 1
      ? `<div class="grid grid-cols-3 gap-2 text-center"><div class="rounded-ctl bg-success-soft p-2 text-success"><b class="block text-lg">${st === 2 ? file.ready : file.ready}</b><span class="text-2xs">${st === 2 ? 'Imported' : 'Ready'}</span></div><div class="rounded-ctl bg-warning-soft p-2 text-warning"><b class="block text-lg">${file.skipped}</b><span class="text-2xs">Skipped</span></div><div class="rounded-ctl bg-error-soft p-2 text-error"><b class="block text-lg">${file.errors}</b><span class="text-2xs">Errors</span></div></div>
        <button type="button" data-d1="up-import" data-id="${key}" ${st === 2 ? 'disabled' : ''} class="${btn.primary} w-full disabled:opacity-50">${ic('check')}${st === 2 ? 'Imported' : `Import ${file.ready} ${cfg.noun === 'advancements' ? 'Advancements' : 'Records'}`}</button>`
      : '<p class="text-sm text-muted-foreground">Choose a workbook to see what will be imported.</p>';
    return pageHeader(cfg.title, cfg.sub)

      'doc-pick': () => pickDoc(el.dataset.doc),
      'upload-doc': () => openDialog({ title: 'Upload Document', body: `<div class="space-y-4">${field('Category', `<select name="doc-category">${options(CATEGORIES.map(([, n]) => n), state.docCat === 'ALL' ? 'Drafting' : (CATEGORIES.find(([c]) => c === state.docCat) || [, ''])[1])}</select>`)}
          <button type="button" class="flex w-full flex-col items-center gap-2 rounded-card border-2 border-dashed border-input bg-subtle transition-colors px-4 py-6 text-sm text-muted-foreground">${ic('file-up', 'icon h-7 w-7')}Choose a PDF, image or Word file</button></div>`,
        foot: `<button type="button" data-act="close" class="${btn.outline}">Cancel</button><button type="button" data-act="saved" class="${btn.primary}">${ic('upload')}Upload</button>`, size: 'sm' }),
      download: () => toast('Demo only: no file to download.'),
      'delete-doc': () => toast('Demo only: nothing was deleted.'),
      step: () => setNewStep(Number(el.dataset.step)),
      'new-rating': () => openNewRating(),
      'save-new': () => { closeDialog(); toast('Demo only: nothing was saved.'); location.hash = '#ratings/record/B0539'; },
      template: () => { state.upload = Math.max(state.upload, 1); render(); toast('Demo only: no workbook was made.'); },
      'choose-workbook': () => { state.upload = 2; render(); },
      commit: () => { state.upload = 3; render(); toast('Demo only: nothing was added.'); },
      demo: () => toast('Demo only.'),
      'table-add': () => tableForm(route.slice(7), null),
      'table-edit': () => tableForm(route.slice(7), Number(el.dataset.i)),
      'run-report': () => { render(); toast('Report updated.'); },
      'user-pick': () => { state.userPicked = el.dataset.user; if (sideBySide()) render(); else { const u = USERS.find((x) => x.username === el.dataset.user); openDialog({ title: 'User', size: 'md', body: userCard(u) }); } },
      'user-add': () => userForm(null),
      'user-edit': () => userForm(USERS.find((x) => x.username === el.dataset.user)),
      'reset-pw': () => openDialog({ title: 'Reset Password', size: 'sm', body: '<p class="text-sm">The user gets a one-time password and must change it at their next sign in.</p>', foot: `<button type="button" data-act="close" class="${btn.outline}">Cancel</button><button type="button" data-act="saved" class="${btn.blue}">${ic('key-round')}Reset Password</button>` }),
      'role-pick': () => { state.role = el.dataset.role; render(); },
      'role-add': () => openDialog({ title: 'Add Role', size: 'sm', body: field('Role Name', `<input type="text" class="${INPUT}" />`) + `<div class="mt-4">${field('Copy Access From', `<select name="role-copy">${options(ROLES, '', '-- None --')}</select>`, true)}</div>`, foot: `<button type="button" data-act="close" class="${btn.outline}">Cancel</button><button type="button" data-act="saved" class="${btn.primary}">${ic('check')}Add Role</button>` }),
      perm: () => { perms[state.role][el.dataset.key] = !perms[state.role][el.dataset.key]; render(); },
      'pw-save': () => { if (!$('#pw-current').value) { toast('Enter your current password.', 'error'); return; } if (!pwCheck()) { toast('The new password needs every check.', 'error'); return; } toast('Demo only: the password is unchanged.'); },
      eye: () => { const i = document.getElementById(el.dataset.for); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.innerHTML = ic(show ? 'eye-off' : 'eye'); el.setAttribute('aria-label', show ? 'Hide Password' : 'Show Password'); },
      'audit-search': () => { const v = (n) => { const x = document.querySelector(`[name="${n}"]`); return x ? x.value : ''; }; state.audit = { action: v('audit-action'), table: v('audit-table'), by: v('audit-by'), key: v('audit-key') }; state.pages.audit = 1; render(); },
      'audit-reset': () => { state.audit = { action: '', table: '', by: '', key: '' }; state.pages.audit = 1; render(); },
      'audit-view': () => { const e = AUDIT[Number(el.dataset.i)]; openDialog({ title: `${e.action} · ${e.key}`, size: 'lg', body: `<div class="mb-4">${dl([['Time', stamp(e.time)], ['Table', e.table], ['Performed By', e.by], ['IP Address', e.ip]])}</div>
          <div class="overflow-hidden rounded-card border border-border/70"><table class="w-full text-sm"><thead class="text-left"><tr><th class="${TH}">Field</th><th class="${TH}">Before</th><th class="${TH}">After</th></tr></thead>
          <tbody>${auditChanges(e).map(([f, b, a]) => `<tr class="border-t border-border/70"><td class="px-4 py-2.5 font-medium">${esc(f)}</td><td class="px-4 py-2.5">${b === '-' ? '<span class="text-muted-foreground">-</span>' : `<span class="rounded bg-error-soft px-1.5 py-0.5 text-error line-through decoration-error/50">${esc(b)}</span>`}</td><td class="px-4 py-2.5">${a === '-' ? '<span class="text-muted-foreground">-</span>' : `<span class="rounded bg-success-soft px-1.5 py-0.5 text-success">${esc(a)}</span>`}</td></tr>`).join('')}</tbody></table></div>` }); },
      lock: () => { closeDialog(); const m = $('#account-menu'); if (m) m.classList.add('hidden'); lockScreen('manual'); },
      'lock-eye': () => { const i = $('#lock-pass'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.innerHTML = ic(show ? 'eye-off' : 'eye'); el.setAttribute('aria-label', show ? 'Hide Password' : 'Show Password'); i.focus(); },
      'lock-signout': () => { unlockScreen({ announce: false }); signOut(); },
      'phone-preview': openPhone, 'close-phone': closePhone,
    };
    if (A[act]) A[act]();
  });
  document.addEventListener('input', (e) => {
    if (e.target.dataset && e.target.dataset.q) {
      const key = e.target.dataset.q; state.qs[key] = e.target.value; state.pages[key] = 1;
      const pos = e.target.selectionStart; const id = e.target.id;
      render();
      const i = document.getElementById(id); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
      return;
    }
    if (e.target.id === 'pw-new' || e.target.id === 'pw-confirm') { pwCheck(); return; }
    if (e.target.id === 'list-q') {
      state.q = e.target.value;
      Object.values(state.list).forEach((l) => { l.page = 1; l.picked = null; });
      const pos = e.target.selectionStart;
      render();
      const i = $('#list-q'); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
    }
  });
  document.addEventListener('change', (e) => {
    const name = e.target.getAttribute && e.target.getAttribute('name');
    if (name === 'rate-filter' || name === 'ship-filter') {
      state[name === 'rate-filter' ? 'rate' : 'ship'] = e.target.value;
      Object.values(state.list).forEach((l) => { l.page = 1; l.picked = null; });
      if ($('#overlay').classList.contains('hidden')) render(); else setTimeout(render, 0);
    } else if (name && name.startsWith('rep-')) {
      state.report[name.slice(4)] = e.target.value;
    } else if (name === 'doc-rating') {
      state.docSn = e.target.value; state.docCat = 'ALL'; state.docPicked = null; render();
    }
  });

  // ---- phone preview (demo only) ----
  function openPhone() {
    const frame = $('#phone-frame');
    $('#phone-iframe').src = `${location.href.split('#')[0].split('?')[0]}?frame=phone${location.hash || '#dashboard'}`;
    frame.classList.remove('hidden'); frame.classList.add('flex');
  }
  function closePhone() { const f = $('#phone-frame'); f.classList.add('hidden'); f.classList.remove('flex'); $('#phone-iframe').src = 'about:blank'; }
  if (new URLSearchParams(location.search).get('frame')) $('#demo-bar').remove();
  themeListeners.push(() => renderRail(route));

  lastRoute = location.hash.replace(/^#\/?/, '') || 'dashboard';
  const openNewAtStart = lastRoute === 'ratings/new';
  if (openNewAtStart) { lastRoute = 'ratings/current'; history.replaceState(null, '', '#ratings/current'); }
  render();
  if (framed) { $('#login').classList.add('hidden'); } else showLogin();
  if (openNewAtStart) openNewRating();
  if (store.get()) lockScreen(store.get(), { announce: false });
})();
</script>
</body>
</html>
