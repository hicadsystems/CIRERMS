<section class="space-y-4">
  <!-- Top Filter Row (Official No + Name + Process, matching legacy CIRERMS) -->
  <form id="list-filter-form" class="flex flex-wrap items-end gap-4">
    <div class="w-full sm:w-52">
      <label for="filter-official-no" class="block text-sm text-gray-600 mb-1">Official No</label>
      <input
        id="filter-official-no"
        name="officialNo"
        type="text"
        placeholder="e.g. B0539"
        class="cirerms-input bg-white"
      />
    </div>

    <div class="w-full sm:w-60">
      <label for="filter-name" class="block text-sm text-gray-600 mb-1">Name</label>
      <input
        id="filter-name"
        name="name"
        type="text"
        placeholder="Surname or First Name"
        class="cirerms-input bg-white"
      />
    </div>

    <div class="flex items-center gap-2">
      <button type="submit" class="cirerms-btn-teal px-5 py-2">
        Process
      </button>
      <button
        id="filter-reset-btn"
        type="button"
        class="hidden rounded border border-cirerms-border bg-white px-3.5 py-2 text-xs font-medium text-gray-700 hover:bg-gray-50"
      >
        Reset
      </button>
    </div>
  </form>

  <!-- Entries selector + quick search -->
  <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
    <div class="flex items-center gap-2 text-sm text-gray-700">
      <span>Show</span>
      <select id="list-page-size" class="rounded border border-cirerms-border bg-white px-2.5 py-1.5 text-sm focus:border-cirerms-blue focus:outline-none">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
      <span>entries</span>
    </div>

    <div class="flex items-center gap-2 text-sm text-gray-700">
      <label for="list-quick-search" class="text-xs font-medium text-gray-600">Search:</label>
      <input
        id="list-quick-search"
        type="search"
        placeholder="Rate, ship, branch, name..."
        class="w-56 rounded border border-cirerms-border bg-white px-3 py-1.5 text-sm focus:border-cirerms-blue focus:outline-none"
      />
    </div>
  </div>

  <!-- Data Table Card -->
  <div class="bg-white rounded shadow-sm border border-cirerms-border overflow-hidden">
    <div class="overflow-x-auto cirerms-scroll">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr id="list-thead-row" class="border-b-2 border-gray-700 bg-white text-xs font-bold text-cirerms-ink"></tr>
        </thead>
        <tbody id="list-tbody" class="divide-y divide-gray-100 text-sm text-gray-700"></tbody>
      </table>
    </div>
  </div>

  <!-- Bottom Export Bar (Copy | Excel | PDF | CSV) + Pagination -->
  <div class="flex flex-wrap items-center justify-between gap-4 pt-1">
    <div class="flex flex-wrap items-center gap-3">
      <div class="inline-flex rounded overflow-hidden shadow-sm">
        <button id="export-copy-btn" type="button" class="cirerms-dt-btn border-r-0">Copy</button>
        <button id="export-excel-btn" type="button" class="cirerms-dt-btn border-r-0">Excel</button>
        <button id="export-pdf-btn" type="button" class="cirerms-dt-btn border-r-0">PDF</button>
        <button id="export-csv-btn" type="button" class="cirerms-dt-btn">CSV</button>
      </div>
      <span id="list-summary-text" class="text-xs text-gray-600"></span>
    </div>

    <div class="flex items-center gap-1.5">
      <button
        id="page-prev-btn"
        type="button"
        class="rounded border border-cirerms-border bg-white px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Previous
      </button>
      <div id="page-numbers" class="flex items-center gap-1"></div>
      <button
        id="page-next-btn"
        type="button"
        class="rounded border border-cirerms-border bg-white px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Next
      </button>
    </div>
  </div>
</section>
