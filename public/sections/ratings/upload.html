<section class="space-y-6">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <!-- Left Guidance Column (matches Screenshot 161446) -->
    <div class="lg:col-span-6 space-y-4">
      <div class="text-cirerms-note space-y-2">
        <p class="text-sm font-medium">Please Note:</p>
        <ul class="list-disc pl-7 space-y-1 text-sm">
          <li>Duplicate Official Numbers will not be uploaded (they are skipped safely and listed below).</li>
          <li>Compulsory fields (<span class="font-semibold">Official Number, Surname, First Name, Rate, Gender</span>) must be filled.</li>
          <li>All dates must be in ISO format (<span class="font-mono text-xs">YYYY-MM-DD</span>, e.g. <span class="font-mono text-xs">1994-06-21</span>).</li>
        </ul>
      </div>

      <div>
        <button id="download-sample-btn" type="button" class="cirerms-btn-teal">
          <span>Download Sample File</span>
          <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v3.586L7.707 9.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 10.586V7z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Right Upload Box -->
    <div class="lg:col-span-6">
      <form
        id="batch-upload-form"
        class="rounded border border-cirerms-border bg-background/70 p-5 shadow-sm space-y-4 max-w-md"
      >
        <div class="rounded bg-cirerms-blue p-2.5 text-on-fill">
          <input
            id="batch-file-input"
            name="file"
            type="file"
            accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            class="block w-full text-xs text-on-fill file:mr-3 file:rounded file:border-0 file:bg-background file:px-3 file:py-1.5 file:text-xs file:font-medium file:text-cirerms-ink hover:file:bg-gray-100 cursor-pointer"
          />
        </div>

        <div class="text-center">
          <button id="batch-submit-btn" type="submit" class="cirerms-btn-blue px-6 py-2">
            Upload File
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Import Results Container -->
  <div id="batch-result-panel" class="hidden bg-background rounded shadow-sm border border-cirerms-border p-5 space-y-4"></div>
</section>
