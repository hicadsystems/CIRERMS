<section class="space-y-4">
  <!-- Unlinked Admin Notice (shown ONLY on #ratings/my-details when req.user.service_number is NULL) -->
  <div id="my-details-unlinked" class="hidden bg-background rounded shadow-sm border border-cirerms-border p-6 space-y-4 max-w-2xl">
    <div class="flex items-start gap-3.5">
      <div class="w-10 h-10 rounded-full bg-sky-50 border border-sky-200 text-cirerms-sidebar flex items-center justify-center shrink-0">
        <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
        </svg>
      </div>
      <div class="space-y-1.5">
        <h2 class="text-base font-semibold text-cirerms-ink">No Personal Service Record Linked to This Account</h2>
        <p id="my-details-unlinked-msg" class="text-sm text-gray-600 leading-relaxed"></p>
      </div>
    </div>
    <div class="flex flex-wrap gap-2.5 pt-2">
      <a href="#ratings/current" class="cirerms-btn-teal text-xs">Browse Current Ratings List</a>
      <a href="#ratings/edit/B0539" class="cirerms-btn-blue text-xs">Inspect Demo Rating (B0539)</a>
    </div>
  </div>

  <!-- Main 10-Tab Dossier Card -->
  <div id="profile-card" class="bg-background rounded shadow-sm border border-cirerms-border overflow-hidden">
    <!-- Top Card Bar -->
    <div class="px-5 py-2.5 border-b border-gray-100 flex flex-wrap items-center justify-between gap-2 bg-background">
      <div class="flex items-center gap-2 text-xs text-gray-500">
        <span id="profile-mode-badge" class="inline-flex items-center rounded px-2 py-0.5 font-semibold bg-sky-50 text-cirerms-sidebar border border-sky-200">
          Dossier
        </span>
        <span id="profile-lock-hint" class="hidden text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded">
          Save Personal Details first to unlock tabs 2–10.
        </span>
      </div>

      <div class="flex items-center gap-2">
        <button id="profile-print-dossier-btn" type="button" class="hidden cirerms-btn-blue text-xs py-1 px-3">
          Print Full Dossier PDF
        </button>
      </div>
    </div>

    <!-- 10-Tab Strip (matches Screenshot 161302) -->
    <div id="profile-tabs-bar" class="grid grid-cols-2 sm:grid-cols-5 lg:grid-cols-10 bg-cirerms-tab-idle border-b border-cirerms-border text-xs"></div>

    <!-- Striped Progress Bar -->
    <div class="px-5 pt-4 pb-2">
      <div class="cirerms-progress-track">
        <div id="profile-progress-fill" class="cirerms-progress-bar" style="width: 10%"></div>
      </div>
    </div>

    <!-- Active Tab Content Container -->
    <div class="p-5 space-y-5">
      <!-- Banner: "Ratings Information of SURNAME, FIRST NAME" -->
      <div class="rounded border border-gray-100 bg-gray-50/60 px-4 py-3 flex flex-wrap items-center justify-between gap-2">
        <h2 id="profile-banner-title" class="text-base font-normal text-cirerms-ink">New Rating Registration</h2>
        <span id="profile-ship-badge" class="hidden text-xs font-medium text-cirerms-teal bg-teal-50 border border-teal-200 px-2.5 py-0.5 rounded"></span>
      </div>

      <!-- ================================================================ -->
      <!-- TAB 1: RATINGS DETAILS (4 Sub-steps + Passport Photo)            -->
      <!-- ================================================================ -->
      <div id="tab-pane-personal" class="space-y-5">
        <!-- 4 Sub-Step Pills -->
        <div id="personal-substeps-bar" class="grid grid-cols-2 sm:grid-cols-4 border border-cirerms-border rounded overflow-hidden text-xs font-medium">
          <button type="button" data-substep="1" class="substep-btn py-2.5 px-3 text-center transition">Step 1: Basic Details</button>
          <button type="button" data-substep="2" class="substep-btn py-2.5 px-3 text-center border-l border-cirerms-border transition">Step 2: Contact</button>
          <button type="button" data-substep="3" class="substep-btn py-2.5 px-3 text-center border-t sm:border-t-0 sm:border-l border-cirerms-border transition">Step 3: Health Info</button>
          <button type="button" data-substep="4" class="substep-btn py-2.5 px-3 text-center border-t sm:border-t-0 border-l border-cirerms-border transition">Step 4: Official</button>
        </div>

        <form id="personal-info-form" class="space-y-5" novalidate>
          <!-- Sub-step 1: Basic Details -->
          <div data-substep-pane="1" class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <div class="lg:col-span-9 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
              <div>
                <label class="cirerms-label">Rate</label>
                <select name="rate_id" class="cirerms-input"></select>
              </div>
              <div>
                <label class="cirerms-label">Title</label>
                <select name="title_id" class="cirerms-input"></select>
              </div>
              <div>
                <label class="cirerms-label">Official Number <span class="text-red-600">*</span></label>
                <input name="service_number" type="text" placeholder="e.g. B0539" class="cirerms-input uppercase" required />
              </div>
              <div>
                <label class="cirerms-label">Date of Birth</label>
                <input name="date_of_birth" type="date" class="cirerms-input" />
              </div>

              <div class="sm:col-span-2 md:col-span-1">
                <label class="cirerms-label">Surname <span class="text-red-600">*</span></label>
                <input name="surname" type="text" class="cirerms-input uppercase" required />
              </div>
              <div class="sm:col-span-2 md:col-span-1">
                <label class="cirerms-label">First Name <span class="text-red-600">*</span></label>
                <input name="first_name" type="text" class="cirerms-input uppercase" required />
              </div>
              <div class="sm:col-span-2 md:col-span-2">
                <label class="cirerms-label">Middle Name</label>
                <input name="middle_name" type="text" class="cirerms-input uppercase" />
              </div>

              <div>
                <label class="cirerms-label">Maiden Name</label>
                <input name="maiden_name" type="text" class="cirerms-input uppercase" />
              </div>
              <div>
                <label class="cirerms-label">Gender</label>
                <select name="gender_id" class="cirerms-input"></select>
              </div>
              <div>
                <label class="cirerms-label">Marital Status</label>
                <select name="marital_status_id" class="cirerms-input"></select>
              </div>
              <div>
                <label class="cirerms-label">Married to Military Personnel</label>
                <input name="married_to_military_personnel" type="text" placeholder="No / Service No." class="cirerms-input" />
              </div>

              <div>
                <label class="cirerms-label">Religion</label>
                <select name="religion_id" class="cirerms-input"></select>
              </div>
              <div>
                <label class="cirerms-label">Religion Denomination</label>
                <select name="religion_denomination_id" class="cirerms-input"></select>
              </div>
              <div>
                <label class="cirerms-label">Tribe</label>
                <select name="tribe_id" class="cirerms-input"></select>
              </div>
              <div>
                <label class="cirerms-label">Personnel Status</label>
                <select name="status" class="cirerms-input">
                  <option value="current">Current Rating</option>
                  <option value="former">Former Rating</option>
                </select>
              </div>
            </div>

            <!-- Passport Photograph Box -->
            <div class="lg:col-span-3">
              <div class="rounded border border-cirerms-border bg-gray-50 p-3.5 text-center space-y-2.5">
                <div class="text-xs font-semibold text-gray-600">Passport Photograph</div>
                <div class="mx-auto w-32 h-36 rounded border border-gray-300 bg-background flex items-center justify-center overflow-hidden">
                  <img id="passport-photo-img" alt="Passport Photo" class="hidden w-full h-full object-cover" />
                  <div id="passport-photo-placeholder" class="text-[11px] text-gray-400 px-2">
                    No photograph uploaded
                  </div>
                </div>
                <div id="passport-upload-controls" class="space-y-1.5">
                  <input id="passport-file-input" type="file" accept=".jpg,.jpeg,.png,.webp" class="hidden" />
                  <button id="passport-choose-btn" type="button" class="cirerms-btn-blue text-xs w-full">
                    Upload Passport Photo
                  </button>
                  <p class="text-[10px] text-gray-400">JPG, PNG or WebP (max 5 MB)</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Sub-step 2: Contact -->
          <div data-substep-pane="2" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <div>
              <label class="cirerms-label">State of Origin</label>
              <select name="state_id" class="cirerms-input"></select>
            </div>
            <div>
              <label class="cirerms-label">Local Government</label>
              <select name="local_government_id" class="cirerms-input"></select>
            </div>
            <div>
              <label class="cirerms-label">Geo-Political Zone</label>
              <select name="geo_political_zone_id" class="cirerms-input"></select>
            </div>

            <div>
              <label class="cirerms-label">Place of Birth</label>
              <input name="place_of_birth" type="text" class="cirerms-input" />
            </div>
            <div>
              <label class="cirerms-label">Mother Base</label>
              <select name="mother_base_id" class="cirerms-input"></select>
            </div>
            <div>
              <label class="cirerms-label">Phone Number</label>
              <input name="phone" type="tel" class="cirerms-input" />
            </div>

            <div>
              <label class="cirerms-label">Email Address</label>
              <input name="email_address" type="email" class="cirerms-input" />
            </div>
            <div>
              <label class="cirerms-label">Identification Type</label>
              <select name="identification_type_id" class="cirerms-input"></select>
            </div>
            <div>
              <label class="cirerms-label">Identity Number</label>
              <input name="identity_number" type="text" class="cirerms-input" />
            </div>

            <div>
              <label class="cirerms-label">Driver License Number</label>
              <input name="driver_license_number" type="text" class="cirerms-input" />
            </div>
            <div>
              <label class="cirerms-label">Driver License Expiry Date</label>
              <input name="driver_license_expiry_date" type="date" class="cirerms-input" />
            </div>
            <div class="sm:col-span-2 md:col-span-3">
              <label class="cirerms-label">Home Address</label>
              <textarea name="home_address" rows="2" class="cirerms-input"></textarea>
            </div>
          </div>

          <!-- Sub-step 3: Health Info -->
          <div data-substep-pane="3" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
            <div>
              <label class="cirerms-label">Weight (kg)</label>
              <input name="weight_kg" type="number" step="0.01" min="20" max="350" placeholder="e.g. 78.50" class="cirerms-input" />
            </div>
            <div>
              <label class="cirerms-label">Height (m)</label>
              <input name="height_m" type="number" step="0.01" min="0.50" max="2.60" placeholder="e.g. 1.79" class="cirerms-input" />
            </div>
            <div>
              <label class="cirerms-label">Chest (cm)</label>
              <input name="chest_cm" type="number" step="0.1" min="30" max="250" placeholder="e.g. 98.0" class="cirerms-input" />
            </div>
            <div>
              <label class="cirerms-label">Tribal Mark</label>
              <select name="tribal_mark" class="cirerms-input">
                <option value="0">No</option>
                <option value="1">Yes</option>
              </select>
            </div>

            <div>
              <label class="cirerms-label">Blood Group</label>
              <select name="blood_group_id" class="cirerms-input"></select>
            </div>
            <div>
              <label class="cirerms-label">Blood Genotype</label>
              <select name="blood_genotype_id" class="cirerms-input"></select>
            </div>
            <div>
              <label class="cirerms-label">Hair Color</label>
              <select name="hair_color_id" class="cirerms-input"></select>
            </div>
            <div>
              <label class="cirerms-label">Eye Color</label>
              <select name="eye_color_id" class="cirerms-input"></select>
            </div>

            <div>
              <label class="cirerms-label">Complexion</label>
              <select name="complexion_id" class="cirerms-input"></select>
            </div>
            <div>
              <label class="cirerms-label">Disability</label>
              <select name="disability_id" class="cirerms-input"></select>
            </div>
            <div class="sm:col-span-2">
              <label class="cirerms-label">Disability Comment</label>
              <input name="disability_comment" type="text" class="cirerms-input" />
            </div>
          </div>

          <!-- Sub-step 4: Official -->
          <div data-substep-pane="4" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <div>
              <label class="cirerms-label">Branch</label>
              <select name="branch_id" class="cirerms-input"></select>
            </div>
            <div>
              <label class="cirerms-label">Command</label>
              <select name="command_id" class="cirerms-input"></select>
            </div>
            <div>
              <label class="cirerms-label">Staff Branch</label>
              <select name="staff_branch_id" class="cirerms-input"></select>
            </div>

            <div>
              <label class="cirerms-label">Specialisation</label>
              <select name="specialisation_id" class="cirerms-input"></select>
            </div>
            <div>
              <label class="cirerms-label">Entry Mode</label>
              <select name="entry_mode_id" class="cirerms-input"></select>
            </div>
            <div>
              <label class="cirerms-label">Current Ship (Active Drafting)</label>
              <input id="official-current-ship-display" type="text" disabled placeholder="Derived from open Drafting row" class="cirerms-input" />
            </div>

            <div>
              <label class="cirerms-label">Date Employed</label>
              <input name="date_employed" type="date" class="cirerms-input" />
            </div>
            <div>
              <label class="cirerms-label">Seniority Date</label>
              <input name="seniority_date" type="date" class="cirerms-input" />
            </div>
            <div>
              <label class="cirerms-label">Hobbies</label>
              <input name="hobbies" type="text" class="cirerms-input" />
            </div>

            <div>
              <label class="cirerms-label">Exit Type (Former Ratings)</label>
              <select name="exit_type_id" class="cirerms-input"></select>
            </div>
            <div>
              <label class="cirerms-label">Exit Date</label>
              <input name="exit_date" type="date" class="cirerms-input" />
            </div>
            <div>
              <label class="cirerms-label">Exit Reason</label>
              <input name="exit_reason" type="text" class="cirerms-input" />
            </div>
          </div>

          <!-- Step Navigation & Save Footer -->
          <div class="pt-4 border-t border-gray-100 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
              <button id="substep-prev-btn" type="button" class="rounded border border-cirerms-border bg-background px-4 py-2 text-xs font-medium text-gray-700 hover:bg-gray-50">
                &larr; Previous Step
              </button>
              <button id="substep-next-btn" type="button" class="rounded border border-cirerms-border bg-background px-4 py-2 text-xs font-medium text-gray-700 hover:bg-gray-50">
                Next Step &rarr;
              </button>
            </div>

            <div id="personal-save-actions" class="flex items-center gap-2">
              <button id="delete-rating-btn" type="button" class="hidden cirerms-btn-danger py-2 px-3.5">
                Delete Rating
              </button>
              <button id="save-personal-btn" type="submit" class="cirerms-btn-teal px-6 py-2">
                Save Personal Details
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- ================================================================ -->
      <!-- TABS 2–9: DYNAMIC CHILD RECORD WORKSPACE                         -->
      <!-- ================================================================ -->
      <div id="tab-pane-child" class="hidden space-y-5"></div>

      <!-- ================================================================ -->
      <!-- TAB 10: VIEW DOCUMENT / UPLOAD (matches Screenshot 161432)       -->
      <!-- ================================================================ -->
      <div id="tab-pane-documents" class="hidden space-y-5"></div>
    </div>
  </div>
</section>
