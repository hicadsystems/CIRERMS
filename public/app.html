<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CIRERMS</title>
  <link rel="icon" type="image/png" href="/assets/navy-logo.png" />
  <!-- Light or dark before the page draws (the person's choice, else the device's) -->
  <script src="/js/core/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/output.css" />
  <!-- Turns every <select> into a searchable dropdown; must run before the app's modules -->
  <script src="/js/core/choices.js"></script>
</head>
<body class="app-canvas h-full overflow-hidden text-foreground">
  <!-- The shell: js/sections/app-shell.js fills these slots (js/shell/*) -->
  <div id="shell" data-shell class="flex h-dvh min-h-0">
    <!-- desktop sidebar (js/shell/rail.js) -->
    <aside id="rail" aria-label="Main" class="flex w-rail flex-none flex-col bg-gradient-to-b from-sidebar to-sidebar-deep text-sidebar-foreground phone:hidden"></aside>

    <div class="flex min-h-0 min-w-0 flex-1 flex-col">
      <!-- desktop top bar -->
      <header class="relative z-20 flex h-14 flex-none items-center gap-3 border-b border-border/60 bg-background/70 px-4 backdrop-blur-xl phone:hidden">
        <button id="rail-toggle" type="button" aria-controls="rail" aria-expanded="true" aria-label="Fold Menu" class="inline-flex h-9 w-9 flex-none items-center justify-center rounded-ctl text-muted-foreground hover:bg-muted hover:text-foreground focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ring/15">
          <svg class="icon h-5 w-5" aria-hidden="true"><use href="/assets/icons.svg#panel-left"></use></svg>
        </button>
        <button id="search-open" type="button" class="flex h-9 w-full max-w-md items-center gap-2 rounded-full border border-border bg-muted px-3.5 text-sm text-muted-foreground transition-all hover:border-input hover:bg-background hover:shadow-card focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ring/15">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#search"></use></svg>
          <span class="truncate">Search Ratings and Screens</span>
          <span class="ml-auto flex gap-1 text-2xs font-semibold" aria-hidden="true"><kbd class="rounded border border-border bg-background px-1.5 py-0.5">Ctrl</kbd><kbd class="rounded border border-border bg-background px-1.5 py-0.5">K</kbd></span>
        </button>
        <!-- light / dark (js/core/theme.js) -->
        <button id="theme-toggle" type="button" aria-label="Switch to Dark Mode" class="ml-auto inline-flex h-9 w-9 flex-none items-center justify-center rounded-ctl text-muted-foreground transition-colors hover:bg-muted hover:text-foreground focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ring/15">
          <svg class="icon h-5 w-5" aria-hidden="true"><use href="/assets/icons.svg#moon"></use></svg>
        </button>
      </header>

      <!-- phone header (js/shell/phone.js) -->
      <header id="phone-header" class="relative z-10 flex h-14 flex-none items-center gap-2 bg-gradient-to-r from-sidebar to-sidebar-deep px-2 text-sidebar-foreground shadow-md desk:hidden"></header>

      <!-- the module's pages: a tab strip on desktop, chips on a phone (js/shell/module-tabs.js) -->
      <nav id="module-tabs" class="hidden"></nav>

      <main id="page" class="min-h-0 flex-1 overflow-y-auto overflow-x-hidden px-4 pb-10 pt-5 phone:px-3.5 phone:pb-24 phone:pt-3.5">
        <div id="app-main" class="mx-auto w-full max-w-page"></div>
      </main>

      <!-- phone bottom bar -->
      <nav id="bottom-bar" aria-label="Main" class="grid flex-none grid-cols-5 border-t border-border/60 bg-background/80 px-1 pb-[env(safe-area-inset-bottom)] shadow-pop backdrop-blur-xl desk:hidden"></nav>
    </div>
  </div>

  <!-- New Rating on a phone, on the ratings lists -->
  <a id="fab" href="#ratings/new" aria-label="New Rating" class="fixed bottom-24 right-4 z-30 hidden h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-primary to-primary-hover text-primary-foreground shadow-lg shadow-primary/30 ring-1 ring-primary-foreground/20 desk:hidden">
    <svg class="icon h-6 w-6" aria-hidden="true"><use href="/assets/icons.svg#plus"></use></svg>
  </a>

  <!-- dialogs and sheets (js/ui/dialog.js), toasts (js/ui/toast.js) -->
  <div id="overlay-root"></div>
  <div id="toast-root" class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-80 flex-col gap-2 phone:bottom-20 phone:left-3 phone:right-3 phone:w-auto" aria-live="polite"></div>

  <script type="module" src="/js/sections/app-shell.js"></script>
</body>
</html>
