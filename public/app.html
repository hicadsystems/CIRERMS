<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIRERMS — Nigerian Navy Ratings Management</title>
  <link rel="icon" type="image/png" href="/assets/navy-logo.png" />
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="min-h-screen bg-cirerms-canvas text-cirerms-ink overflow-x-hidden">
  <div class="flex min-h-screen">
    <!-- ================================================================== -->
    <!-- LEFT SIDEBAR (#0074a8)                                             -->
    <!-- ================================================================== -->
    <aside
      id="app-sidebar"
      class="w-60 shrink-0 bg-cirerms-sidebar text-white flex flex-col transition-all duration-200 z-30"
    >
      <!-- Top White Crest Box -->
      <div class="h-24 bg-white border-b border-r border-cirerms-border flex items-center justify-center px-4 shrink-0">
        <a href="#dashboard" class="flex items-center justify-center focus:outline-none" title="CIRERMS Dashboard">
          <img src="/assets/navy-logo.png" alt="Nigerian Navy Crest" class="h-20 w-auto object-contain" />
        </a>
      </div>

      <!-- Navigation Scroll Area -->
      <nav class="flex-1 overflow-y-auto cirerms-scroll px-3 py-4 space-y-1 text-[13px]" aria-label="Primary">
        <div class="px-2 pb-1.5 text-[10px] font-semibold uppercase tracking-widest text-sky-200/80">
          Navigation
        </div>

        <!-- Dashboard -->
        <a
          href="#dashboard"
          data-nav-route="dashboard"
          class="nav-top-link flex items-center gap-2.5 rounded px-3 py-2 font-medium transition"
        >
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h3a1 1 0 001-1v-3h2v3a1 1 0 001 1h3a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
          </svg>
          <span>Dashboard</span>
        </a>

        <!-- Ratings Management (Active Module Group) -->
        <div class="pt-0.5">
          <button
            id="ratings-group-toggle"
            type="button"
            aria-expanded="true"
            class="w-full flex items-center justify-between gap-2 rounded px-3 py-2 font-medium transition bg-white text-cirerms-ink shadow-sm"
          >
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z" />
              </svg>
              <span>Ratings Management</span>
            </span>
            <svg id="ratings-group-caret" class="w-3.5 h-3.5 transition-transform rotate-90" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
            </svg>
          </button>

          <div id="ratings-submenu" class="mt-1.5 ml-3 space-y-0.5">
            <a href="#ratings/my-details" data-sub-route="ratings/my-details" class="nav-sub-link flex items-center gap-2 px-3 py-1.5 rounded text-white/90 hover:text-white hover:bg-white/10 transition">
              <svg class="w-3.5 h-3.5 shrink-0 opacity-80" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" /></svg>
              <span>View My Details</span>
            </a>
            <a href="#ratings/new" data-sub-route="ratings/new" class="nav-sub-link flex items-center gap-2 px-3 py-1.5 rounded text-white/90 hover:text-white hover:bg-white/10 transition">
              <svg class="w-3.5 h-3.5 shrink-0 opacity-80" viewBox="0 0 20 20" fill="currentColor"><path d="M8 9a3 3 0 100-6 3 3 0 000 6zM8 11a6 6 0 016 6H2a6 6 0 016-6zM16 7a1 1 0 10-2 0v1h-1a1 1 0 100 2h1v1a1 1 0 102 0v-1h1a1 1 0 100-2h-1V7z" /></svg>
              <span>New Ratings</span>
            </a>
            <a href="#ratings/upload" data-sub-route="ratings/upload" class="nav-sub-link flex items-center gap-2 px-3 py-1.5 rounded text-white/90 hover:text-white hover:bg-white/10 transition">
              <svg class="w-3.5 h-3.5 shrink-0 opacity-80" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>
              <span>Batch Upload</span>
            </a>
            <a href="#ratings/former" data-sub-route="ratings/former" class="nav-sub-link flex items-center gap-2 px-3 py-1.5 rounded text-white/90 hover:text-white hover:bg-white/10 transition">
              <span class="text-xs leading-none">&#9656;</span>
              <span>Former Ratings List</span>
            </a>
            <a href="#ratings/current" data-sub-route="ratings/current" class="nav-sub-link flex items-center gap-2 px-3 py-1.5 rounded text-white/90 hover:text-white hover:bg-white/10 transition">
              <span class="text-xs leading-none">&#9656;</span>
              <span>Current Ratings List</span>
            </a>
            <a href="#ratings/documents" data-sub-route="ratings/documents" class="nav-sub-link flex items-center gap-2 px-3 py-1.5 rounded text-white/90 hover:text-white hover:bg-white/10 transition">
              <span class="text-xs leading-none">&#9656;</span>
              <span>View Document</span>
            </a>
          </div>
        </div>

        <!-- Disabled Non-Ratings Modules (preserved visually per migration demo scope) -->
        <div class="pt-2 space-y-0.5 border-t border-white/15 mt-2">
          <button type="button" data-disabled-module="Drafting" class="w-full flex items-center justify-between gap-2 px-3 py-2 rounded text-left text-white/65 hover:bg-white/5 cursor-not-allowed" title="Out of scope in Ratings Management migration demo">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0 opacity-75" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 6V5a3 3 0 013-3h2a3 3 0 013 3v1h2a2 2 0 012 2v3.57A22.952 22.952 0 0110 13a22.95 22.95 0 01-8-1.43V8a2 2 0 012-2h2zm2-1a1 1 0 011-1h2a1 1 0 011 1v1H8V5zm1 5a1 1 0 011-1h.01a1 1 0 110 2H10a1 1 0 01-1-1z" clip-rule="evenodd" /><path d="M2 13.692V16a2 2 0 002 2h12a2 2 0 002-2v-2.308A24.974 24.974 0 0110 15c-2.796 0-5.487-.46-8-1.308z" /></svg>
              <span>Drafting</span>
            </span>
          </button>

          <button type="button" data-disabled-module="Special Drafting" class="w-full flex items-center justify-between gap-2 px-3 py-2 rounded text-left text-white/65 hover:bg-white/5 cursor-not-allowed" title="Out of scope in Ratings Management migration demo">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0 opacity-75" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 6V5a3 3 0 013-3h2a3 3 0 013 3v1h2a2 2 0 012 2v3.57A22.952 22.952 0 0110 13a22.95 22.95 0 01-8-1.43V8a2 2 0 012-2h2zm2-1a1 1 0 011-1h2a1 1 0 011 1v1H8V5z" clip-rule="evenodd" /></svg>
              <span>Special Drafting</span>
            </span>
          </button>

          <button type="button" data-disabled-module="Advancement Processing" class="w-full flex items-center justify-between gap-2 px-3 py-2 rounded text-left text-white/65 hover:bg-white/5 cursor-not-allowed" title="Out of scope in Ratings Management migration demo">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0 opacity-75" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 001.414 1.414L9 9.414V13a1 1 0 102 0V9.414l1.293 1.293a1 1 0 001.414-1.414z" clip-rule="evenodd" /></svg>
              <span>Advancement Processing</span>
            </span>
          </button>

          <button type="button" data-disabled-module="Assessment of NAVAL Character & Efficiency" class="w-full flex items-center justify-between gap-2 px-3 py-2 rounded text-left text-white/65 hover:bg-white/5 cursor-not-allowed" title="Out of scope in Ratings Management migration demo">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0 opacity-75" viewBox="0 0 20 20" fill="currentColor"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" /><path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" /></svg>
              <span class="leading-snug">Assessment of NAVAL Character &amp; Efficiency</span>
            </span>
          </button>

          <button type="button" data-disabled-module="Disciplinary Action" class="w-full flex items-center justify-between gap-2 px-3 py-2 rounded text-left text-white/65 hover:bg-white/5 cursor-not-allowed" title="Out of scope in Ratings Management migration demo">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0 opacity-75" viewBox="0 0 20 20" fill="currentColor"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" /><path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" /></svg>
              <span>Disciplinary Action</span>
            </span>
          </button>

          <button type="button" data-disabled-module="Discharge Administration" class="w-full flex items-center justify-between gap-2 px-3 py-2 rounded text-left text-white/65 hover:bg-white/5 cursor-not-allowed" title="Out of scope in Ratings Management migration demo">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0 opacity-75" viewBox="0 0 20 20" fill="currentColor"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" /><path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" /></svg>
              <span>Discharge Administration</span>
            </span>
          </button>

          <button type="button" data-disabled-module="Training Drafting" class="w-full flex items-center justify-between gap-2 px-3 py-2 rounded text-left text-white/65 hover:bg-white/5 cursor-not-allowed" title="Out of scope in Ratings Management migration demo">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0 opacity-75" viewBox="0 0 20 20" fill="currentColor"><path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3z" /></svg>
              <span>Training Drafting</span>
            </span>
          </button>
        </div>
      </nav>
    </aside>

    <!-- ================================================================== -->
    <!-- MAIN COLUMN                                                        -->
    <!-- ================================================================== -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Top White Header Bar -->
      <header class="h-12 bg-white border-b border-cirerms-border flex items-center justify-between px-4 shrink-0">
        <button
          id="sidebar-toggle-btn"
          type="button"
          class="p-1.5 rounded text-gray-600 hover:bg-gray-100 hover:text-cirerms-ink focus:outline-none"
          title="Toggle Navigation Sidebar"
          aria-label="Toggle Sidebar"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <!-- Authenticated User Menu -->
        <div class="relative">
          <button
            id="user-menu-btn"
            type="button"
            class="flex items-center gap-2 rounded px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 focus:outline-none"
          >
            <span id="header-username">...</span>
            <svg class="w-3.5 h-3.5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </button>

          <div
            id="user-menu-dropdown"
            class="hidden absolute right-0 mt-1 w-56 rounded bg-white shadow-lg border border-cirerms-border py-1 z-40"
          >
            <div class="px-4 py-2 border-b border-gray-100">
              <div id="menu-fullname" class="text-xs font-semibold text-cirerms-ink truncate"></div>
              <div id="menu-role" class="text-[11px] text-gray-500"></div>
            </div>
            <a
              href="#ratings/my-details"
              id="menu-my-details"
              class="block px-4 py-2 text-xs text-gray-700 hover:bg-gray-50"
            >
              View My Details
            </a>
            <button
              id="logout-btn"
              type="button"
              class="w-full text-left px-4 py-2 text-xs text-red-600 hover:bg-red-50 font-medium"
            >
              Sign Out
            </button>
          </div>
        </div>
      </header>

      <!-- Subheader Bar (#f7f7f7) -->
      <div class="bg-cirerms-subheader border-b border-cirerms-border px-6 py-3.5 flex flex-wrap items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full border-2 border-cirerms-ink flex items-center justify-center text-cirerms-ink">
            <svg id="subheader-icon" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
              <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h3a1 1 0 001-1v-3h2v3a1 1 0 001 1h3a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
            </svg>
          </div>
          <h1 id="page-heading" class="text-xl font-normal text-cirerms-ink tracking-tight">Dashboard</h1>
        </div>

        <div class="text-xs text-gray-500 flex items-center gap-1.5">
          <span class="uppercase tracking-wider text-[10px] text-gray-400">You are here:</span>
          <span id="breadcrumb-parent" class="text-cirerms-sidebar font-medium">CIRERMS</span>
          <span>/</span>
          <span id="breadcrumb-current" class="text-cirerms-ink">Dashboard</span>
        </div>
      </div>

      <!-- SPA View Outlet -->
      <main id="app-main" class="flex-1 p-6"></main>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-root" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- Modal Root (Document / PDF Preview & Confirmation Dialogs) -->
  <div id="modal-root" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"></div>

  <script type="module" src="/js/sections/app-shell.js"></script>
</body>
</html>
