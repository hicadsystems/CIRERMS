<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Nigerian Navy CIRERMS</title>
  <link rel="icon" type="image/png" href="/assets/navy-logo.png" />
  <link rel="stylesheet" href="/css/output.css" />
  <!-- Turns every <select> into a searchable dropdown; must run before the app's modules -->
  <script src="/js/core/choices.js"></script>
</head>
<body class="min-h-screen bg-cirerms-sidebar flex flex-col justify-between">
  <!-- Subtle top naval stripe -->
  <div class="h-1.5 w-full bg-gradient-to-r from-cirerms-pill via-cirerms-teal to-yellow-400"></div>

  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <!-- Crest & System Title -->
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-white p-2 shadow-lg mb-3">
          <img src="/assets/navy-logo.png" alt="Nigerian Navy Crest" class="h-20 w-auto object-contain" />
        </div>
        <h1 class="text-2xl font-bold tracking-wide text-white">NIGERIAN NAVY</h1>
        <p class="mt-1 text-xs uppercase tracking-widest text-sky-100">
          Centralised Integrated Ratings Electronic Records Management System (CIRERMS)
        </p>
      </div>

      <!-- Login Card -->
      <div class="bg-white rounded-md shadow-xl border border-white/20 overflow-hidden">
        <div class="bg-cirerms-subheader border-b border-cirerms-border px-6 py-3.5 flex items-center justify-between">
          <h2 class="text-sm font-semibold text-cirerms-ink uppercase tracking-wider">Personnel Portal Sign In</h2>
          <span class="text-[11px] font-medium text-cirerms-teal bg-teal-50 border border-teal-200 px-2 py-0.5 rounded">
            Ratings Module
          </span>
        </div>

        <form id="login-form" class="p-6 space-y-4" novalidate>
          <div id="login-error" class="hidden rounded border border-red-300 bg-red-50 px-3.5 py-2.5 text-xs text-red-700" role="alert"></div>

          <div>
            <label for="username" class="cirerms-label">Username / Official Number</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
              placeholder="e.g. HICO001"
              class="cirerms-input"
            />
          </div>

          <div>
            <label for="password" class="cirerms-label">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="Enter password"
              class="cirerms-input"
            />
          </div>

          <button
            id="login-submit"
            type="submit"
            class="w-full cirerms-btn-teal py-2.5 text-sm font-semibold"
          >
            Sign In to CIRERMS
          </button>
        </form>

        <!-- Demo Account Quick-Fill Helper -->
        <div class="bg-slate-50 border-t border-cirerms-border px-6 py-3.5">
          <p class="text-[11px] font-semibold uppercase tracking-wider text-gray-500 mb-2">
            Migration Demo Accounts (Click to Autofill)
          </p>
          <div class="grid grid-cols-2 gap-2">
            <button
              type="button"
              data-demo-user="HICO001"
              data-demo-pass="Admin@123"
              class="text-left rounded border border-gray-200 bg-white px-2.5 py-1.5 hover:border-cirerms-blue hover:bg-sky-50/40 transition"
            >
              <div class="text-xs font-semibold text-cirerms-ink">HICO001</div>
              <div class="text-[11px] text-gray-500">Admin (Unlinked)</div>
            </button>
            <button
              type="button"
              data-demo-user="B0539"
              data-demo-pass="Rating@123"
              class="text-left rounded border border-gray-200 bg-white px-2.5 py-1.5 hover:border-cirerms-teal hover:bg-teal-50/40 transition"
            >
              <div class="text-xs font-semibold text-cirerms-ink">B0539</div>
              <div class="text-[11px] text-gray-500">PO Okonkwo (My Details)</div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center text-xs text-sky-100/80">
    &copy; Nigerian Navy — Onward Together
  </footer>

  <script type="module" src="/js/sections/auth.js"></script>
</body>
</html>
